    ${un ? `<h3 style="margin-top:22px">Unattributed channels</h3><div class="attn">${un}</div>` : ''}
    <button class="btn ghost" onclick="renderContacts()">‹ Back to contacts</button>`;
}

async function ctDecide(i, action) {
  const m = window._ctMerges[i];
  await api('/api/contacts/review', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, agency: m.agency, names: m.candidates.map(c => c.normalized_name) }),
  });
  ctReview();
}

/* ============ outreach rail: operator shortlist on every view ============ */
/* Grown by research passes server-side; curated here. Drag rows to reorder,
   × to delete (tombstoned), click a channel to hand-correct it, drop an
   enriched .json/.csv onto the rail to merge channels back in. */
let OR = { entries: null, dragId: null, msg: '',
           collapsed: localStorage.getItem('orailCollapsed') === '1' };

/* The rail belongs to CLIENT views: renderClient shows it, home and the
   contacts/review views hide it. Collapse state persists across reloads. */
function setRailContext(show) {
  // client view -> that client's contacts; every other view -> blank navy
  const rail = $id('orail');
  OR.clientScope = (show && SEL)
    ? { slug: SEL, workstationId: WSEL,
        name: (DETAIL && DETAIL.client_name) || SEL } : null;
  rail.classList.remove('hidden');
  rail.classList.toggle('blank', !OR.clientScope);
  if (!OR.clientScope) {
    rail.classList.remove('collapsed');
    rail.replaceChildren();
    rail.onclick = rail.ondragover = rail.ondrop = rail.ondragleave = null;
    return;
  }
  rail.classList.toggle('collapsed', OR.collapsed);
  if (OR.collapsed) renderOutreach();
  else loadOutreach();
}

function toggleRail(collapsed) {
  OR.collapsed = collapsed;
  localStorage.setItem('orailCollapsed', collapsed ? '1' : '0');
  setRailContext(true);
}

function railActive() {
  const rail = $id('orail');
  return !rail.classList.contains('hidden') && !rail.classList.contains('collapsed')
      && !rail.classList.contains('blank');
}

async function loadOutreach() {
  const scope = OR.clientScope;
  const sameScope = () => Boolean(scope && OR.clientScope
    && OR.clientScope.slug === scope.slug
    && OR.clientScope.workstationId === scope.workstationId);
  try {
    if (scope) {
      const d = await api(workstationAuxPath(
        scope.slug, 'targets', scope.workstationId));
      // stale response: the operator already navigated elsewhere
      if (!sameScope()) return;
      OR.entries = d.targets; OR.pocs = d.pursuit_pocs;
    } else {
      OR.entries = (await api('/api/outreach')).entries; OR.pocs = null;
      if (OR.clientScope) return;
    }
  } catch {
    if ((scope && !sameScope()) || (!scope && OR.clientScope)) return;
    OR.entries = null; OR.pocs = null;
  }
  renderOutreach();
}

function oChanLine(entry, kind) {
  const ch = entry[kind];
  const span = el(`<span class="o-chan" title="click to edit ${kind}"></span>`);
  if (ch && ch.value) {
    const g = ch.manual ? '<span class="g gm">M</span>'
                        : (ch.grade ? `<span class="g g${ch.grade}">${ch.grade}</span>` : '');
    span.innerHTML = `${g}${esc(ch.value)}`;
    if (!ch.manual && ch.last_observed) span.title = `${kind} · observed ${ch.last_observed} · click to override`;
  } else {
    span.innerHTML = `<span class="miss">+ ${kind}</span>`;
  }
  span.onclick = (ev) => {
    ev.stopPropagation();
    const cur = (entry.overrides && entry.overrides[kind]) || (ch && ch.value) || '';
    const inp = el(`<input type="text" spellcheck="false">`);
    inp.value = cur;
    span.replaceChildren(inp);
    inp.focus();
    const commit = async () => {
      const v = inp.value.trim();
      // unchanged value = the operator just looked — never convert a graded
      // official channel into a manual override by accident
      if (v === cur.trim()) { renderOutreach(); return; }
      try {
        await api('/api/outreach/override', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: entry.id, [kind]: v }),
        });
      } catch (e) { OR.msg = `edit failed: ${e.message || e}`; }
      loadOutreach();
    };
    inp.onkeydown = (e) => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.onblur = null; renderOutreach(); } };
    inp.onblur = commit;
  };
  return span;
}

function renderOutreach() {
  const rail = $id('orail');
  if (rail.classList.contains('blank')) return;  // blank stays blank, always
  rail.replaceChildren();

  const scoped = !!OR.clientScope;
  if (OR.collapsed) {
    // slim reopen tab; file drops and row handlers are inert while closed
    rail.ondragover = rail.ondrop = rail.ondragleave = null;
    rail.onclick = () => toggleRail(false);
    rail.appendChild(el(`<div class="o-vert" title="open the targets rail">▸ ${scoped ? 'TARGETS' : 'OUTREACH'}${OR.entries ? ' · ' + OR.entries.length : ''}</div>`));
    return;
  }
  rail.onclick = null;

  const head = el(`<div class="o-head">${scoped ? 'TARGETS' : 'OUTREACH'} <span class="o-cnt">${OR.entries ? OR.entries.length : '—'}</span>
    <button title="grow the list from the research so far">⟳</button>
    <button class="o-enrich" title="export an Apollo enrichment spec for entries missing email/phone">ENRICH</button>
    <button class="o-collapse" title="close the outreach list">◂</button></div>`);
  const [refreshBtn, enrichBtn, collapseBtn] = head.querySelectorAll('button');
  // stopPropagation: the re-render installs the rail's reopen handler while
  // this same click is still bubbling — without it, collapse instantly reopens
  collapseBtn.onclick = (ev) => { ev.stopPropagation(); toggleRail(true); };
  refreshBtn.onclick = async () => {
    const r = await api('/api/outreach/refresh', { method: 'POST' });
    OR.msg = r.added ? `+${r.added} from research` : 'nothing new from research yet';
    loadOutreach();
  };
  enrichBtn.onclick = async () => {
    const r = await api('/api/outreach/enrich', { method: 'POST' });
    OR.msg = r.count ? `enrichment spec for ${r.count} → ${r.path} — run it in Cowork (Apollo), then drop the result file here`
                     : 'nothing needs enrichment';
    loadOutreach();
  };
  rail.appendChild(head);
  rail.appendChild(el(scoped
    ? `<div class="o-hint">prospecting targets for <b>${esc(OR.clientScope.name)}</b> ·
       every name is here for a reason: POC on a live pursuit, watchlist
       sighting, or added for this client · × removes · click a channel to
       edit · drop an enriched .json/.csv here to merge</div>`
    : `<div class="o-hint">relevant contacts from the research so far ·
       drag to reorder · × removes for good · click a channel to edit ·
       drop an enriched .json/.csv here to merge</div>`));
  if (OR.msg) {
    const m = el(`<div class="o-msg">${esc(OR.msg)}</div>`);
    rail.appendChild(m);
    setTimeout(() => { if (OR.msg) { OR.msg = ''; m.remove(); } }, 12000);
  }

  if (OR.entries === null) {
    rail.appendChild(el('<div class="o-hint">contacts unavailable</div>'));
    return;
  }
  // TARGET BUCKETS (2026-07-10): the rail separates why someone is a
  // target — live solicitation POCs, forming candidates, teaming primes
  const BUCKET_META = {
    solicitation: ['SOLICITATION TARGETS', 'POCs on live graded solicitations'],
    candidate:    ['CANDIDATE TARGETS', 'watchlist sightings and hand-added names'],
    prime:        ['PRIME TARGETS', 'contacts at teaming primes'],
  };
  const BUCKET_ORDER = { solicitation: 0, candidate: 1, prime: 2 };
  if (scoped && OR.entries.length) {
    OR.entries.sort((a, b) =>
      ((BUCKET_ORDER[a.bucket] ?? 1) - (BUCKET_ORDER[b.bucket] ?? 1)) ||
      ((a.reason_rank ?? 50) - (b.reason_rank ?? 50)));
  }
  if (!OR.entries.length) {
    rail.appendChild(el(scoped
      ? '<div class="o-hint">no targets yet — promote a POC below, or add one by hand</div>'
      : '<div class="o-hint">empty — run a sweep or the contact backfill and relevant names appear here</div>'));
  }

  let lastBucket = null;
  OR.entries.forEach((e, i) => {
    if (scoped) {
      const b = e.bucket || 'candidate';
      if (b !== lastBucket) {
        lastBucket = b;
        const [blabel, bhint] = BUCKET_META[b] || [b.toUpperCase() + ' TARGETS', ''];
        const n = OR.entries.filter(x => (x.bucket || 'candidate') === b).length;
        rail.appendChild(el(`<div class="o-head" style="margin-top:10px" title="${bhint}">${blabel} <span class="o-cnt">${n}</span></div>`));
      }
    }
    const row = el(`<div class="o-row"${scoped ? '' : ' draggable="true"'}>
      <div class="o-top">${scoped ? '' : '<span class="o-drag">⠿</span>'}<span class="o-rank">${i + 1}</span>
        <span class="o-name" title="${esc(e.source_note || '')}${e.in_graph ? '' : ' · no longer in graph'}">${esc(e.person_name)}</span>
        <button class="o-x" title="remove — research passes will not re-add">×</button></div>
      <div class="o-sub">${esc([e.title, e.agency].filter(Boolean).join(' · '))}</div>
      ${scoped && e.reason ? `<div class="o-why">${esc(e.reason)}</div>` : ''}
      ${e.enrich_status === 'requested' ? '<div class="o-flag">ENRICHMENT REQUESTED</div>' : ''}
    </div>`);
    const sub = row.querySelector('.o-sub');
    sub.after(oChanLine(e, 'phone'));
    sub.after(oChanLine(e, 'email'));
    row.querySelector('.o-x').onclick = async (ev) => {
      ev.stopPropagation();
      await api('/api/outreach/remove', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: e.id }),
      });
      loadOutreach();
    };
    if (!scoped) row.addEventListener('dragstart', (ev) => {
      OR.dragId = e.id; row.classList.add('dragging');
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', e.id);
    });
    row.addEventListener('dragend', () => { OR.dragId = null; row.classList.remove('dragging'); });
    if (!scoped) row.addEventListener('dragover', (ev) => {
      if ([...ev.dataTransfer.types].includes('Files')) return; // rail handles files
      if (!OR.dragId || OR.dragId === e.id) return;
      ev.preventDefault();
      // top half = insert before, bottom half = insert after (so the last
      // position is reachable)
      row.classList.toggle('dropover', ev.offsetY <= row.offsetHeight / 2);
      row.classList.toggle('dropafter', ev.offsetY > row.offsetHeight / 2);
    });
    row.addEventListener('dragleave', () => row.classList.remove('dropover', 'dropafter'));
    if (!scoped) row.addEventListener('drop', async (ev) => {
      if ([...ev.dataTransfer.types].includes('Files')) return; // bubble to rail
      if (!OR.dragId || OR.dragId === e.id) return;
      ev.preventDefault(); ev.stopPropagation();
      const after = ev.offsetY > row.offsetHeight / 2;
      const before = OR.entries.map(x => x.id);
      const ids = before.filter(x => x !== OR.dragId);
      ids.splice(ids.indexOf(e.id) + (after ? 1 : 0), 0, OR.dragId);
      OR.dragId = null;
      if (ids.join() === before.join()) { renderOutreach(); return; } // no-op drop
      try {
        await api('/api/outreach/reorder', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids }),
        });
      } catch (err) { OR.msg = `reorder failed: ${err.message || err}`; }
      loadOutreach();
    });
    rail.appendChild(row);
  });

  if (scoped) {
    // manual prospecting: a form for known information, tagged to this client
    const addBtn = el('<button class="btn sm ghost" style="width:100%;margin-top:8px">+ add target</button>');
    addBtn.onclick = () => addBtn.replaceWith(oAddForm());
    rail.appendChild(addBtn);

    // POCs with a REASON who aren't targets yet — one click promotes them
    const pocs = OR.pocs || [];
    const g = el(`<div class="o-graph"><div class="o-head">POCS ON LIVE PURSUITS
      <span class="o-cnt">${pocs.length}</span></div></div>`);
    if (!pocs.length) {
      g.appendChild(el('<div class="o-hint">no unlisted POCs on this client’s pursuits or watchlist</div>'));
    }
    pocs.forEach(p => {
      const chips = (p.channels || []).map(c =>
        `<span class="ct-chip g${c.grade}">${c.kind === 'email' ? '@' : '☎'} ${c.grade}</span>`).join(' ');
      const row = el(`<div class="o-grow">
        <div style="display:flex;gap:6px;align-items:baseline">
          <b style="flex:1">${esc(p.person_name)}</b> ${chips}
          <span class="t">${p.sighting_count}×</span>
          <button class="btn sm ghost" title="promote to active targets">+ target</button>
        </div>
        <div class="t">${esc([p.title, p.agency].filter(Boolean).join(' · '))}</div>
        <div class="o-why">${esc(p.reason || '')}</div></div>`);
      row.querySelector('button').onclick = async (ev) => {
        ev.stopPropagation();
        await api('/api/outreach/add', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ person_name: p.person_name, agency: p.agency,
            title: p.title || null, client: OR.clientScope.slug }),
        });
        loadOutreach();
      };
      row.onclick = () => { CT.filters = { q: p.person_name }; CT.page = 1; renderContacts(); };
      g.appendChild(row);
    });
    const browse = el('<div class="o-grow"><span class="t">browse the full contacts database ↗</span></div>');
    browse.onclick = () => { CT.filters = {}; CT.page = 1; renderContacts(); };
    g.appendChild(browse);
    rail.appendChild(g);
  }

  // whole-rail file drop: merge an enrichment result back in
  rail.ondragover = (ev) => {
    if ([...ev.dataTransfer.types].includes('Files')) { ev.preventDefault(); rail.classList.add('filehover'); }
  };
  rail.ondragleave = (ev) => {
    if (!rail.contains(ev.relatedTarget)) rail.classList.remove('filehover');
  };
  rail.ondrop = async (ev) => {
    rail.classList.remove('filehover');
    if (![...ev.dataTransfer.types].includes('Files')) return;
    ev.preventDefault();
    const file = ev.dataTransfer.files[0];
    if (!file) return;
    const text = await file.text();
    let rows = [];
    try {
      if (file.name.endsWith('.json')) {
        const doc = JSON.parse(text);
        rows = Array.isArray(doc) ? doc : (doc.rows || doc.people || []);
      } else {
        const table = parseCsv(text);
        const cols = (table[0] || []).map(c => c.trim().toLowerCase());
        rows = table.slice(1).map(vals => {
          const o = {}; cols.forEach((c, j) => { o[c] = vals[j]; }); return o;
        });
      }
    } catch { OR.msg = `could not parse ${file.name}`; renderOutreach(); return; }
    try {
      const r = await api('/api/outreach/merge', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rows }),
      });
      OR.msg = `merged ${r.updated.length} · ambiguous ${r.ambiguous.length} · unmatched ${r.unmatched.length}`;
    } catch (err) { OR.msg = `merge failed: ${err.message || err}`; }
    loadOutreach();
  };
}

function oAddForm() {
  const f = el(`<div class="o-addform">
    <div class="o-head" style="margin-bottom:4px">NEW TARGET · ${esc(OR.clientScope.name)}</div>
    <input placeholder="full name *">
    <input placeholder="title / role">
    <input placeholder="agency / organization">
    <input placeholder="email">
    <input placeholder="phone">
    <div style="display:flex;gap:6px;margin-top:6px">
      <button class="btn sm">Save</button>
      <button class="btn sm ghost">Cancel</button>
    </div>
    <div style="font-size:10px;color:var(--muted);margin-top:5px">saved as an active
      target for this client · hand-entered channels show M, never a source grade</div>
  </div>`);
  const [nameI, titleI, agencyI, emailI, phoneI] = f.querySelectorAll('input');
  const [save, cancel] = f.querySelectorAll('button');
  cancel.onclick = () => loadOutreach();
  save.onclick = async () => {
    if (!nameI.value.trim()) { nameI.focus(); return; }
    try {
      await api('/api/outreach/add', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ person_name: nameI.value, title: titleI.value || null,
          agency: agencyI.value || null, email: emailI.value || null,
          phone: phoneI.value || null, client: OR.clientScope.slug }),
      });
      OR.msg = 'contact added';
    } catch (e) { OR.msg = 'add failed: ' + (e.message || e); }
    loadOutreach();
  };
  setTimeout(() => nameI.focus(), 0);
  return f;
}

// RFC-4180-ish CSV: quoted fields may contain commas ("VETERANS AFFAIRS,
// DEPARTMENT OF") and doubled quotes. Enrichment exports rely on this.
function parseCsv(text) {
  const rows = [[]]; let field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { rows[rows.length - 1].push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      rows[rows.length - 1].push(field); field = '';
      rows.push([]);
    } else field += c;
  }
  rows[rows.length - 1].push(field);
  return rows.filter(r => r.length > 1 || (r[0] || '').trim());
}

// a drag can end anywhere (including over a row the interval replaced) —
// always clear the drag state at the document level
document.addEventListener('dragend', () => { OR.dragId = null; });

async function ctAddOutreach(i) {
  const p = (CT.lastProfiles || [])[i];
  if (!p) return;
  await api('/api/outreach/add', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ person_name: p.person_name, agency: p.agency, title: p.title }),
  });
  loadOutreach();
}

initSuggest();
// Canonical deep links restore an exact workstation.  The legacy client URL
// resolves once to the last-opened/current workstation and is replaced, never
// layered into history as a second, ambiguous page.
const _deepWorkstation = location.pathname.match(
  /^\/client\/([a-z0-9_]+)\/workstation\/(all|agency_[a-z0-9_]+)\/?$/);
const _deepClient = location.pathname.match(/^\/client\/([a-z0-9_]+)\/?$/);
const _deepContacts = location.pathname === '/'
  && new URLSearchParams(location.search).get('view') === 'contacts';
const _bootLocation = location.pathname + location.search;
loadClients(false).then(() => {
  if (location.pathname + location.search !== _bootLocation) return;
  if (_deepWorkstation) {
    openWorkstation(_deepWorkstation[1], _deepWorkstation[2], { history: 'none' });
  } else if (_deepClient) {
    select(_deepClient[1], { history: 'replace' });
  } else if (_deepContacts) renderContacts({ history: 'none' });
});
window.addEventListener('popstate', () => {
  if (NEW_SCOPE_CLOSE && !NEW_SCOPE_CLOSE()) {
    const origin = SEL && WSEL ? workstationPath(SEL, WSEL) : '/';
    historyReplace(origin);
    return;
  }
  const match = location.pathname.match(
    /^\/client\/([a-z0-9_]+)\/workstation\/(all|agency_[a-z0-9_]+)\/?$/);
  if (match) openWorkstation(match[1], match[2], { history: 'none' });
  else if (location.pathname === '/'
           && new URLSearchParams(location.search).get('view') === 'contacts') {
    renderContacts({ history: 'none' });
  }
  else if (location.pathname === '/') {
    renderHome(false);
  }
});
setInterval(() => {
  if (document.querySelector('.console.show')) return;
  // Keep the cache current without hard-refreshing the Command Center.
  // A client workspace may repaint its scoped sidebar; home stays untouched.
  loadClients(true, { paint: Boolean(SEL) }).catch(() => {});
  // refresh the rail only when it's open in a client view, and never mid-edit
  // or mid-drag — that would destroy the operator's in-progress gesture
  if (railActive() && !OR.dragId && !document.querySelector('#orail input')) loadOutreach();
}, 20000);
</script>
