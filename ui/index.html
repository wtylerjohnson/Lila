      if (e.key !== 'Enter') return;
      e.preventDefault();
      const v = inp.value.trim();
      if (v && !chips[inp.dataset.chipadd].includes(v)) {
        chips[inp.dataset.chipadd].push(v);
        drawChips(inp.dataset.chipadd);
      }
      inp.value = '';
    };
  });

  function termRow(kind, row) {
    const isKill = kind === 'tax-kills';
    const r = el(`<div class="ob-row${isKill ? ' kill' : ''}"></div>`);
    if (isKill) {
      r.innerHTML = `<input type="text" placeholder="kill phrase" value="${esc(row?.term || '')}">
        <select><option value="span">span</option><option value="record">record</option></select>
        <input type="text" placeholder="reason" value="${esc(row?.reason || '')}">
        <button type="button" aria-label="remove">&times;</button>`;
      if (row?.scope === 'record') r.querySelector('select').value = 'record';
    } else {
      r.innerHTML = `<input type="text" placeholder="term" value="${esc(row?.term || '')}">
        <select>${MODES.map(m => `<option value="${m}">${m}</option>`).join('')}</select>
        <input type="text" placeholder="acronym context, comma-separated" value="${esc((row?.expansion_context || []).join(', '))}">
        <button type="button" aria-label="remove">&times;</button>`;
      if (row?.mode) r.querySelector('select').value = row.mode;
    }
    r.querySelector('button').onclick = () => r.remove();
    dialog.querySelector(`[data-rows="${kind}"]`).appendChild(r);
  }
  dialog.querySelectorAll('[data-addrow]').forEach(b => {
    b.onclick = () => termRow(b.dataset.addrow);
  });

  function readRows(kind) {
    const isKill = kind === 'tax-kills';
    return [...dialog.querySelectorAll(`[data-rows="${kind}"] .ob-row`)].map(r => {
      const [a, b, c] = [r.children[0].value.trim(), r.children[1].value, r.children[2].value.trim()];
      if (!a) return null;
      if (isKill) return { term: a, scope: b, reason: c };
      const t = { term: a, mode: b };
      if (b === 'acronym') t.expansion_context = c.split(',').map(s => s.trim()).filter(Boolean);
      return t;
    }).filter(Boolean);
  }

  function prefill(state) {
    const p = state.files.profile.raw || {};
    q('#ob-name').value = p.client_name || state.client_name || '';
    q('#ob-display-name').value = p.display_name || '';
    q('#ob-summary').value = p.capability_summary || '';
    const ct = p.capability_terms || {};
    chips.core = [...(ct.core || [])]; chips.adjacent = [...(ct.adjacent || [])];
    chips.excluded = [...(ct.excluded || [])];
    chips.naics = [...(p.naics_boundary || [])];
    chips.competitors = [...(p.named_competitors_and_incumbents || [])];
    chips.mission = [...(p.mission_components || [])];
    const t = state.files.taxonomy.raw;
    ['tax-core','tax-adjacent','tax-kills'].forEach(k =>
      dialog.querySelector(`[data-rows="${k}"]`).innerHTML = '');
    if (t) {
      q('#ob-tax-version').value = t.version || 1;
      q('#ob-tax-updated').value = t.updated || '';
      (t.core || []).forEach(row => termRow('tax-core', row));
      (t.adjacent || []).forEach(row => termRow('tax-adjacent', row));
      (t.exclude || []).forEach(row => termRow('tax-kills', row));
    }
    const s = state.files.scope.raw;
    dialog.querySelector('input[data-inc="scope"]').checked = Boolean(s);
    chips['scope-add'] = [...((s && s.add) || [])];
    chips['scope-remove'] = [...((s && s.remove) || [])];
    if (s && s.preset) {
      const radio = dialog.querySelector(`input[name="ob-preset"][value="${s.preset}"]`);
      if (radio) radio.checked = true;
    }
    Object.keys(chips).forEach(drawChips);
    shas = { profile: state.files.profile.sha256,
             taxonomy: state.files.taxonomy.sha256,
             scope: state.files.scope.sha256 };
    const ready = q('.ob-ready');
    ready.hidden = false;
    ready.textContent = state.sweep_ready ? 'SWEEP-READY' : 'NOT SWEEP-READY';
    ready.className = 'ob-ready ' + (state.sweep_ready ? 'ok' : 'no');
  }

  q('.ob-load').onclick = async () => {
    const name = q('#ob-name').value.trim();
    if (!name) { q('.ns-msg').textContent = 'enter a client name or slug to load'; return; }
    try { prefill(await api(`/api/onboarding/${encodeURIComponent(name.toLowerCase().replace(/[^a-z0-9]+/g, '_'))}`)); }
    catch (e) { q('.ns-msg').textContent = 'load failed: ' + (e.message || e); }
  };

  function close() { overlay.remove(); }
  q('.ob-cancel').onclick = close;
  overlay.onclick = e => { if (e.target === overlay) close(); };

  q('.ob-save').onclick = async () => {
    dialog.querySelectorAll('.ob-fileerr').forEach(n => n.textContent = '');
    q('.ns-msg').textContent = '';
    const name = q('#ob-name').value.trim();
    if (!name) { q('.ns-msg').textContent = 'client name is required'; return; }
    const body = { client_name: name, expected_shas: shas, profile: {
      client_name: name,
      capability_summary: q('#ob-summary').value.trim(),
      capability_terms: { core: chips.core, adjacent: chips.adjacent,
                          excluded: chips.excluded },
      named_competitors_and_incumbents: chips.competitors,
      mission_components: chips.mission,
      naics_boundary: chips.naics,
    } };
    const displayName = q('#ob-display-name').value.trim();
    if (displayName) body.profile.display_name = displayName;
    if (dialog.querySelector('input[data-inc="taxonomy"]').checked) {
      body.taxonomy = { client_name: name,
        version: Number(q('#ob-tax-version').value) || 1,
        updated: q('#ob-tax-updated').value
                 || new Date().toISOString().slice(0, 10),
        core: readRows('tax-core'), adjacent: readRows('tax-adjacent'),
        exclude: readRows('tax-kills') };
    }
    if (dialog.querySelector('input[data-inc="scope"]').checked) {
      body.scope = { preset: dialog.querySelector('input[name="ob-preset"]:checked').value };
      if (chips['scope-add'].length) body.scope.add = chips['scope-add'];
      if (chips['scope-remove'].length) body.scope.remove = chips['scope-remove'];
    }
    try {
      // local fetch, not the shared api(): the per-file validator texts ride
      // the error body and must reach their fieldsets verbatim
      const r = await fetch('/api/onboarding', { method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body) });
      const j = await r.json();
      if (!r.ok) {
        if (j.errors) {
          Object.entries(j.errors).forEach(([kind, text]) => {
            const slot = dialog.querySelector(`[data-err="${kind}"]`);
            if (slot) slot.textContent = text;
          });
          q('.ns-msg').textContent =
            'validation failed; the messages above are the validators\' own text';
        } else {
          q('.ns-msg').textContent = j.error || r.statusText;
        }
        return;
      }
      prefill(j);
      q('.ns-msg').style.color = 'var(--ink2)';
      q('.ns-msg').textContent =
        `${name} saved · ${j.sweep_ready ? 'sweep-ready' : 'NOT sweep-ready'}`;
      loadClients();
    } catch (e) {
      q('.ns-msg').textContent = (e.message || e);
    }
  };

  q('.ob-draft').onclick = async () => {
    const name = q('#ob-name').value.trim();
    const materials = q('#ob-materials').value.trim();
    const slot = dialog.querySelector('[data-err="draft"]');
    slot.textContent = '';
    if (!name || !materials) { slot.textContent = 'client name and materials are required'; return; }
    slot.textContent = 'drafting…';
    try {
      const r = await fetch('/api/onboarding/draft', { method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ client_name: name, materials }) });
      const j = await r.json();
      if (!r.ok) { slot.textContent = j.error || r.statusText; return; }
      const sp = (j.suggestion || {}).profile || {};
      const st = (j.suggestion || {}).taxonomy || null;
      if (sp.display_name) q('#ob-display-name').value = sp.display_name;
      if (sp.capability_summary) q('#ob-summary').value = sp.capability_summary;
      const ct = sp.capability_terms || {};
      if (ct.core) chips.core = [...ct.core];
      if (ct.adjacent) chips.adjacent = [...ct.adjacent];
      if (ct.excluded) chips.excluded = [...ct.excluded];
      if (sp.naics_boundary) chips.naics = [...sp.naics_boundary];
      if (sp.named_competitors_and_incumbents) chips.competitors = [...sp.named_competitors_and_incumbents];
      if (sp.mission_components) chips.mission = [...sp.mission_components];
      if (st) {
        ['tax-core','tax-adjacent','tax-kills'].forEach(k =>
          dialog.querySelector(`[data-rows="${k}"]`).innerHTML = '');
        (st.core || []).forEach(row => termRow('tax-core', row));
        (st.adjacent || []).forEach(row => termRow('tax-adjacent', row));
        (st.exclude || []).forEach(row => termRow('tax-kills', row));
        if (st.version) q('#ob-tax-version').value = st.version;
        if (st.updated) q('#ob-tax-updated').value = st.updated;
      }
      Object.keys(chips).forEach(drawChips);
      slot.textContent = j.validation_errors
        ? 'draft prefilled; some fields need edits before they validate'
        : 'draft prefilled; review every field, then Validate & save';
    } catch (e) { slot.textContent = (e.message || e); }
  };

  if (slug) { q('#ob-name').value = slug; q('.ob-load').click(); }
  dialog.focus();
  return dialog;
}

// ── + New scope creation door (Tranche 3, UI-only) ──────────────────────────
// An accessible dialog that POSTs an EXPLICIT scope and always copies the
// baseline strategy into a fresh Pending packet; it never copies
// approval, evidence, reports, release, or Target work. Cancel/close before
// submission writes nothing; an in-flight creation cannot masquerade as canceled.
function openNewScopeDialog(slug, trigger, preselect) {
  if (NEW_SCOPE_CLOSE && !NEW_SCOPE_CLOSE()) return null;
  const origin = { slug, workstationId: WSEL, navSeq: NAV_SEQ };
  const agencies = [];   // selected {abbr,name}; empty until "specific" chosen
  const overlay = el(`<div class="overlay show" id="newScopeOverlay"></div>`);
  const dialog = el(`<div class="modal newscope" role="dialog" aria-modal="true"
    aria-labelledby="newScopeTitle"
    aria-describedby="newScopeDescription newScopeDisclosure" tabindex="-1"
    style="max-width:560px;width:92vw"></div>`);
  dialog.innerHTML = `
    <h2 id="newScopeTitle">New scope workstation</h2>
    <p class="sub" id="newScopeDescription">A scope is its own workstation with its own boundary, approvals,
       evidence, reports, and Target work.</p>
    <fieldset class="ns-scope"><legend>Scope</legend>
      <label class="ns-radio"><input type="radio" name="ns-scope" value="all" checked>
        <span>All Federal</span></label>
      <label class="ns-radio"><input type="radio" name="ns-scope" value="agencies">
        <span>Specific agencies</span></label>
    </fieldset>
    <div class="ns-agencies" hidden>
      <label for="ns-agency-input">Add an agency</label>
      <input id="ns-agency-input" class="chip-add" autocomplete="off"
        placeholder="type an agency, e.g. DHS, then Enter" style="max-width:100%">
      <div class="ns-chips" aria-live="polite"></div>
    </div>
    <p class="ns-disclose" id="newScopeDisclosure" role="note">Every new scope starts
      with this client’s complete baseline strategy: pursuit framing, included and
      kept-out keywords and NAICS, target-agency notes, set-aside angles, near-miss
      decisions, and search-plan inputs. The copy is a fresh Pending review; it never
      carries approval, search results, evidence, reports, release state, or Target work.</p>
    <div class="ns-msg" role="alert" aria-live="assertive"></div>
    <div class="ns-actions">
      <button type="button" class="btn ghost sm ns-cancel">Cancel</button>
      <button type="button" class="btn sm ns-create">Create scope</button>
    </div>`;
  overlay.appendChild(dialog);
  document.body.appendChild(overlay);

  // aria-modal is a promise: background controls must be physically unavailable
  // to keyboard and assistive-technology users until this dialog closes.
  const background = [...document.body.children]
    .filter(node => node !== overlay && node.tagName !== 'SCRIPT')
    .map(node => ({ node, inert: node.inert,
                    ariaHidden: node.getAttribute('aria-hidden') }));
  background.forEach(({ node }) => {
    node.inert = true;
    node.setAttribute('aria-hidden', 'true');
  });

  const q = sel => dialog.querySelector(sel);
  const agencyWrap = q('.ns-agencies');
  const agencyInput = q('#ns-agency-input');
  const chips = q('.ns-chips');
  const msg = q('.ns-msg');
  const createBtn = q('.ns-create');
  const scopeMode = () => dialog.querySelector('input[name="ns-scope"]:checked').value;

  function drawChips() {
    chips.innerHTML = '';
    agencies.forEach((a, i) => {
      const chip = el(`<span class="ed-chip">${esc(a.abbr)}<button type="button"
        aria-label="Remove ${esc(a.abbr)}">&times;</button></span>`);
      chip.querySelector('button').onclick = () => { agencies.splice(i, 1); drawChips(); };
      chips.appendChild(chip);
    });
  }
  dialog.querySelectorAll('input[name="ns-scope"]').forEach(r => {
    r.onchange = () => {
      const specific = scopeMode() === 'agencies';
      agencyWrap.hidden = !specific;
      if (specific) agencyInput.focus();
      msg.textContent = '';
    };
  });
  // Pre-fill from a quick-scope chip (2026-07-13): a common-agency chip opens
  // this SAME sole creation door with that agency already selected — one
  // confirm, full clone disclosure intact. The custom chip opens it focused on
  // the agency search (autofill via /api/agencies).
  if (preselect && (preselect.agency || preselect.custom)) {
    const specific = dialog.querySelector('input[name="ns-scope"][value="agencies"]');
    specific.checked = true;
    agencyWrap.hidden = false;
    if (preselect.agency
        && !agencies.some(a => a.abbr === preselect.agency.abbr)) {
      agencies.push({ abbr: preselect.agency.abbr, name: preselect.agency.name });
      drawChips();
    }
    setTimeout(() => agencyInput.focus(), 0);
  }
  let agencyRequestSeq = 0;
  agencyInput.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const raw = agencyInput.value.trim();
    if (!raw) return;
    const requestSeq = ++agencyRequestSeq;
    try {
      const j = await api('/api/agencies?q=' + encodeURIComponent(raw));
      if (closed || requestSeq !== agencyRequestSeq) return;
      const m = (j.matches || [])[0];
      if (!m) { msg.textContent = `No agency match for “${raw}”.`; return; }
      if (!agencies.some(a => a.abbr === m.abbr)) agencies.push({ abbr: m.abbr, name: m.name });
      agencyInput.value = ''; msg.textContent = ''; drawChips();
    } catch (err) {
      if (closed || requestSeq !== agencyRequestSeq) return;
      msg.textContent = 'Agency lookup failed: ' + (err.message || err);
    }
  };

  let closed = false;
  let submitting = false;
  const focusable = () => [...dialog.querySelectorAll(
    'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')]
    .filter(node => !node.hidden && node.getClientRects().length);
  function setSubmitting(value) {
    submitting = value;
    dialog.querySelectorAll('button,input').forEach(node => { node.disabled = value; });
  }
  function onBeforeUnload(event) {
    if (!submitting) return;
    event.preventDefault();
    event.returnValue = '';
    return '';
  }
  window.addEventListener('beforeunload', onBeforeUnload);
  function close(force = false) {
    if (closed) return true;
    if (submitting && !force) {
      msg.textContent = 'Creation is in progress. Wait for the result before closing.';
      return false;
    }
    closed = true;
    if (NEW_SCOPE_CLOSE === requestClose) NEW_SCOPE_CLOSE = null;
    document.removeEventListener('keydown', onKey);
    window.removeEventListener('beforeunload', onBeforeUnload);
    overlay.remove();
    background.forEach(({ node, inert, ariaHidden }) => {
      node.inert = inert;
      if (ariaHidden === null) node.removeAttribute('aria-hidden');
      else node.setAttribute('aria-hidden', ariaHidden);
    });
    if (trigger && trigger.focus) trigger.focus();   // return focus to the door
    return true;
  }
  function requestClose() { return close(false); }
  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key !== 'Tab') return;
    const nodes = focusable();
    if (!nodes.length) { e.preventDefault(); dialog.focus(); return; }
    const first = nodes[0], last = nodes[nodes.length - 1];
    if (e.shiftKey && (document.activeElement === first
        || !dialog.contains(document.activeElement))) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && (document.activeElement === last
               || !dialog.contains(document.activeElement))) {
      e.preventDefault(); first.focus();
    }
  }
  document.addEventListener('keydown', onKey);
  NEW_SCOPE_CLOSE = requestClose;
  overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });
  q('.ns-cancel').onclick = () => close();

  createBtn.onclick = async () => {
    msg.textContent = '';
    let scope;
    if (scopeMode() === 'all') scope = { all: true };
    else {
      if (!agencies.length) { msg.textContent = 'Add at least one agency, or choose All Federal.'; return; }
      scope = { agencies: agencies.map(a => a.abbr) };
    }
    setSubmitting(true); msg.textContent = 'Creating…';
    try {
      const r = await api(`/api/client/${encodeURIComponent(slug)}/workstations`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scope, clone_baseline: true }) });
      if (closed || NAV_SEQ !== origin.navSeq
          || SEL !== origin.slug || WSEL !== origin.workstationId) return;
      if (r && r.created === false) {
        // duplicate: stays visible + recoverable; never a silent fall-through
        msg.textContent = 'That scope already exists as a workstation. Cancel and switch to it from the rail.';
        setSubmitting(false);
        createBtn.focus();
        return;
      }
      // navigate to the EXACT canonical location the server returned
      const loc = r && r.location;
      const parsed = typeof loc === 'string'
        && loc.match(/^\/client\/([^/]+)\/workstation\/([^/]+)$/);
      if (!parsed || parsed[1] !== origin.slug) {
        msg.textContent = 'Created, but the server did not return a workstation location.';
        setSubmitting(false);
        createBtn.focus();
        return;
      }
      close(true);
      openWorkstation(parsed[1], parsed[2], { history: 'push' });
    } catch (err) {
      if (closed || NAV_SEQ !== origin.navSeq
          || SEL !== origin.slug || WSEL !== origin.workstationId) return;
      // failure stays visible + recoverable; the current workstation is untouched
      msg.textContent = 'Not created: ' + (err.message || err);
      setSubmitting(false);
      createBtn.focus();
    }
  };

  dialog.querySelector('input[name="ns-scope"]').focus();
  return overlay;
}

async function openWorkstation(slug, workstationId,
                               { history = 'push', seq = null } = {}) {
  if (NEW_SCOPE_CLOSE && !NEW_SCOPE_CLOSE()) {
    const origin = SEL && WSEL ? workstationPath(SEL, WSEL) : '/';
    if (location.pathname !== origin || location.search) historyReplace(origin);
    return false;
  }
  seq = seq == null ? ++NAV_SEQ : seq;
  if (seq !== NAV_SEQ) return;
  closeScopedOverlay();
  SEL = slug; WSEL = workstationId; CT.active = false;
  DETAIL = null; WORKSTATIONS = [];
  setRailContext(false);
  bareSidebar(false);
  $id('clientList').innerHTML = '';
  $id('main').innerHTML = '<div style="padding:28px 0;color:var(--muted)">Opening scope workstation…</div>';
  const path = workstationPath(slug, workstationId);
  if (history === 'push' && location.pathname !== path) historyPush(path);
  else if (history === 'replace' && location.pathname !== path) historyReplace(path);
  try {
    const d = await api(`/api/client/${encodeURIComponent(slug)}/workstation/${encodeURIComponent(workstationId)}`);
    if (seq !== NAV_SEQ) return;
    DETAIL = d;
    WORKSTATIONS = d.workstations || [];
    WSEL = d.workstation.ref.id;
    workstationPreference(slug, WSEL);
    // Preserve the newer workstation contract when the Lovable home shell is
    // promoted. Dormant, held, and early scopes keep their purpose-built
    // surfaces; only a full legacy-current workstation enters renderClient().
    if (d.workstation_mode === 'dormant') renderDormantWorkstation();
    else if (d.workstation_mode === 'legacy-current-held') renderHeldWorkstation();
    else if (d.workstation_mode === 'legacy-current-early'
          || d.workstation_mode === 'native-early') renderEarlyWorkstation();
    else renderClient();
    if (seq !== NAV_SEQ) return;
    renderClientSidebar();
  } catch (error) {
    if (seq !== NAV_SEQ) return;
    DETAIL = null; WORKSTATIONS = [];
    $id('main').innerHTML = `<div class="attn"><div class="arow"><span class="what"><b>Workstation unavailable.</b> ${esc(error.message || error)}</span></div></div>`;
  }
}

function historyPush(path) { window.history.pushState({}, '', path); }
function historyReplace(path) { window.history.replaceState({}, '', path); }

async function select(slug, { history = 'push' } = {}) {
  if (window.LILACommandCenterHome) window.LILACommandCenterHome.deactivate();
  if (NEW_SCOPE_CLOSE && !NEW_SCOPE_CLOSE()) {
    const origin = SEL && WSEL ? workstationPath(SEL, WSEL) : '/';
    if (location.pathname !== origin || location.search) historyReplace(origin);
    return false;
  }
  const seq = ++NAV_SEQ;
  closeScopedOverlay();
  if (slug === SEL && WSEL) {
    return openWorkstation(slug, WSEL, { history: 'none', seq });
  }
  const catalog = await api('/api/client/' + encodeURIComponent(slug) + '/workstations');
  if (seq !== NAV_SEQ) return;
  const rows = catalog.workstations || [];
  const preferred = workstationPreference(slug);
  const chosen = rows.find(row => row.ref.id === preferred)
    || rows.find(row => row.is_legacy_current) || rows[0];
  if (!chosen) throw new Error('No scope workstation is available for this client.');
  return openWorkstation(slug, chosen.ref.id, { history, seq });
}

function reloadActiveWorkstation() {
  return SEL && WSEL ? openWorkstation(SEL, WSEL, { history: 'none' }) : Promise.resolve();
}

function renderCommandCenter(d, main) {
  // full-bleed dark wrapper cancels #main's light padding without mutating it
  const mount = el('<div id="ccMount" style="background:#1A1A18;margin:-26px -34px 0;min-height:calc(100vh - 52px)"></div>');
  main.appendChild(mount);
  const modelUrl = '/api/client/' + encodeURIComponent(d.slug) + '/cc-model';
  const statusUrl = '/api/client/' + encodeURIComponent(d.slug) + '/press-status';
  const getStatus = () => fetch(statusUrl).then(r => r.ok ? r.json() : null).catch(() => null);
  const render = (model, initialStatus) => {
    if (!window.LILAClientView) { setTimeout(() => render(model, initialStatus), 50); return; }
    window.LILAClientView.render(mount, model, {
      initialStatus: initialStatus,
      logoDomain: (DETAIL && DETAIL.logo_domain) || null,
      // the existing press dispatch — candidate-review golden press for this
      // client; a 409 JobRunning means a press is already live: poll it.
      dispatch: () => fetch('/api/run', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_name: model.client.name, step: 'candidate_review', args: {} }),
      }).then(r => r.json().then(j => ({
        ok: r.ok, running: r.status === 409 && !!j.running_job_id, error: j.error,
      }))).catch(e => ({ ok: false, running: false, error: String(e) })),
      pollStatus: getStatus,
      reloadModel: () => fetch(modelUrl).then(r => r.ok ? r.json() : null).catch(() => null),
      // the REAL analyst workshop (keyword + NAICS boundary workshops with
      // inspectors, provenance, saves) mounts inside the dark panel on a
      // light working sheet; all legacy machinery, none reimplemented.
      openWorkshop: (container) => {
        const step = ((DETAIL && DETAIL.steps) || []).find(s => s.key === 'approve');
        if (!step || !step.detail) {
          container.innerHTML = '<div style="padding:12px;font-size:12.5px">No strategy packet on this workstation yet.</div>';
          return;
        }
        renderStrategyEditor(container, step.detail.strategy || {}, step.detail);
      },
    });
  };
  Promise.all([
    fetch(modelUrl).then(r => r.json().then(j => ({ ok: r.ok, j }))),
    getStatus(),
  ]).then(([m, st]) => m.ok ? render(m.j, st) : ccError(mount, m.j))
    .catch(e => ccError(mount, { error: String(e) }));
}

      ${st.scopeLabel ? `<span class="chip c-ready">SCOPE · ${esc(st.scopeLabel)}</span>` : '<span class="chip c-ready">SCOPE · ALL FEDERAL</span>'}
      ${st.strictCurrent ? '<span class="chip c-ok" title="report truth derives from the immutable strict run">STRICT TRUTH · CURRENT</span>' : ''}
      ${st.clientReady ? '<span class="chip c-ok">CLIENT READY</span>' : ''}
      <span class="chip ${d.target_approved ? 'c-ok' : 'c-wait'}">${d.target_approved ? 'TARGET UNLOCKED' : 'TARGET LOCKED'}</span>
      ${st.lastVerified ? `<span style="font-size:11px;color:var(--muted)">evidence as of ${esc(String(st.lastVerified).slice(0, 10))}</span>` : ''}
      <span style="flex:1"></span>
      ${st.holds.length ? `<span class="chip c-wait" title="${esc(st.holds.join(' · '))}">${st.holds.length} HOLD${st.holds.length === 1 ? '' : 'S'}</span>` : ''}
    </div>
    <div style="display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap">
      ${st.next ? `<button class="btn next-action">${esc(st.next.label)} →</button>
      <span style="font-size:12px;color:var(--muted)">${esc(st.next.hint)}</span>`
      : `<span class="chain-status" style="font-size:12px;color:var(--muted)"></span>`}
      <span style="flex:1"></span>${mapStrip}
    </div>
  </div>`);
  const nextBtn = head.querySelector('.next-action');
  if (nextBtn) nextBtn.onclick = () => {
    if (TAB !== 'pipeline') switchTab('pipeline');
    const target = document.querySelector(st.next.anchor);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  // honest chain status, interim until V4.4's motion layer: one truthful
  // line from the C2 seam (state + since, or the seam's alert line), else
  // the last press date from artifacts on disk, else nothing. Real data
  // only; no fake progress ever.
  const chainSlot = head.querySelector('.chain-status');
  if (chainSlot) api('/api/radar').then(r => {
    const row = ((r && r.cards) || []).find(c => c.slug === d.slug);
    if (!row) return;
    const a = row.assessment;
    if (a && a.state) {
      chainSlot.textContent = a.alert_line
        || (d.slug + ' · ' + String(a.state).toLowerCase().replaceAll('_', ' ')
            + (a.since ? ' · since ' + String(a.since).slice(0, 10) : ''));
    } else if (row.last_press) {
      chainSlot.textContent = 'last assessment: ' + row.last_press;
    }
  }).catch(() => {});
  main.appendChild(head);
  if (st.map) {
    api(workstationAuxPath(
      d.slug, 'recompetes', d.workstation.ref.id)).then(rc => {
      if (!isActiveWorkstation(d)) return;
      const rows = (rc && (rc.attack || rc.rows || [])) || [];
      const slot = head.querySelector('[data-slot="recompetes"]');
      if (slot && rows.length) { slot.textContent = 'RECOMPETES ' + rows.length; slot.style.display = ''; }
    }).catch(() => {});
  }

  // ── Pipeline / Deliverables tabs (Phase B): the operating screen leads
  // with work; documents live one tab over, one card per artifact family ──
  const nDocs = groupDocsByLabel(d.documents || []).length;
  const tabBar = el(`<div style="display:flex;gap:2px;margin-bottom:12px;border-bottom:2px solid var(--rule-dk)">
    <button class="btn sm ghost tab-pipeline" style="border:none;border-radius:0">Pipeline</button>
    <button class="btn sm ghost tab-deliverables" style="border:none;border-radius:0">Deliverables${nDocs ? ' · ' + nDocs : ''}</button>
  </div>`);
  main.appendChild(tabBar);
  const paneDeliver = el('<div id="pane-deliverables" style="display:none"></div>');
  const panePipeline = el('<div id="pane-pipeline"></div>');
  main.appendChild(paneDeliver);
  main.appendChild(panePipeline);
  const switchTab = (which) => {
    TAB = which;
    panePipeline.style.display = which === 'pipeline' ? '' : 'none';
    paneDeliver.style.display = which === 'pipeline' ? 'none' : '';
    tabBar.querySelector('.tab-pipeline').style.borderBottom = which === 'pipeline' ? '3px solid var(--blue-dk)' : 'none';
    tabBar.querySelector('.tab-deliverables').style.borderBottom = which === 'pipeline' ? 'none' : '3px solid var(--blue-dk)';
  };
  tabBar.querySelector('.tab-pipeline').onclick = () => switchTab('pipeline');
  tabBar.querySelector('.tab-deliverables').onclick = () => switchTab('deliverables');
  window.switchTab = switchTab;
  switchTab('pipeline');
  main = panePipeline;  // everything below renders into the Pipeline pane

  // Fresh-client cliff (2026-07-24): say it up front and open the guided
  // forms; a missing populated profile must never surface as a job-log error.
  if (d.profile_populated === false) {
    const profileBar = el(`<div style="display:flex;gap:12px;align-items:center;border:1px solid var(--rule-dk);border-left:4px solid var(--blue-dk);background:var(--panel);padding:10px 14px;margin-bottom:14px">
      <span style="font-size:12.5px">The capability profile is not complete yet. The sweep and the Pre-Assessment press need it.</span>
      <span style="flex:1"></span>
      <button class="btn sm btn-complete-profile">Complete the client profile</button>
    </div>`);
    profileBar.querySelector('.btn-complete-profile').onclick =
      () => openOnboardingDialog(d.slug);
    main.appendChild(profileBar);
  }

  // The client's own tape, then dated truth, then the pipeline.
  const tickerSlot = el('<div class="tape" hidden></div>');
  main.appendChild(tickerSlot);
  buildClientTicker(d.slug, tickerSlot);
  const fedcalSlot = el('<div id="fedcalSlot"></div>');
  main.appendChild(fedcalSlot);
  buildFederalCalendar(d.slug, fedcalSlot);

  // scoreboard banner (internal view) — computed server-side from the
  // AssessmentDocument; empty when no assessment has run. The slot itself
  // is mounted above the fold per the client view law; only the fetch
  // lives here.
  api(workstationAuxPath(d.slug, 'banner', d.workstation.ref.id))
    .then(b => {
      if (b.html && isActiveWorkstation(d)) {
        bannerSlot.innerHTML = b.html;
        // internal workbench: spell the agency badges out (the locked client
        // template keeps its two-letter marks; the full name rides the title
        // attribute, so this stays a dashboard-only enhancement)
        bannerSlot.querySelectorAll('.vb-badge[data-entity="agency_badge"][title]')
          .forEach(badge => {
            if (badge.querySelector('.vb-agname')) return;
            const full = badge.getAttribute('title') || '';
            const abbr = (badge.querySelector('.vb-mono') || {}).textContent || '';
            if (full && full.trim() !== abbr.trim()) {
              badge.appendChild(el(`<span class="vb-agname" style="display:block;font-size:10px;line-height:1.25;color:var(--muted);max-width:130px">${esc(full)}</span>`));
            }
          });
        // methodology behind a disclosure (Phase B): the number leads, the
        // "how" is one click away and verbatim
        const tam = bannerSlot.querySelector('.vb-tam');
        if (tam) {
          const lines = Array.from(tam.querySelectorAll('.l')).filter(n =>
            /^(How this number is built|Context only)/.test((n.textContent || '').trim()));
          if (lines.length) {
            const det = el(`<details style="margin-top:4px"><summary style="cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">How calculated</summary></details>`);
            lines.forEach(n => det.appendChild(n));
            tam.appendChild(det);
          }
        }
        // internal workbench: the competitors line drills into award detail
        const comp = bannerSlot.querySelector('.vb-comp');
        if (comp) {
          comp.style.cursor = 'pointer';
          comp.title = 'click for competitor detail — awards, amounts, agencies';
          comp.onclick = () => openCompetitors(d.slug, d.workstation.ref.id);
        }
        // recompete calendar (L16): standing expiry schedule, internal only
        const rcp = el(`<div style="margin-top:6px;font-size:12px"><a href="#"
          style="color:var(--navy);text-decoration:underline dotted">Recompete
          calendar: expiring awards in the client's lanes, ranked by attack
          value</a></div>`);
        rcp.querySelector('a').onclick = (e) => {
          e.preventDefault();
          openRecompetes(d.slug, d.workstation.ref.id);
        };
        bannerSlot.appendChild(rcp);
      }
    })
    .catch(() => {});
  // Recurring intelligence motion belongs only to the operator's INTERNAL
  // workbench. Client and sales renderers never receive this artifact.
  // One-refresh law (operator ruling 2026-07-23): the refresh-press
  // cockpit and the change-digest panel are retired from the page; the
  // single Refresh control at the bottom returns to the Analyst Layer.
  // ── Client documents shelf: the deliverables, front and center ──
  if (d.documents && d.documents.length) {
    const shelf = el(`<div style="margin-bottom:22px">
      <div style="display:flex;align-items:center;gap:10px;margin:4px 0 10px">
        <h3 style="font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:#93a0ae;
            margin:0;font-weight:800">Client documents</h3>
        <button class="alink" onclick="api('/api/open_folder',{client:DETAIL.client_name})">Open folder in Finder</button>
      </div>
      <div class="docgrid"></div>
    </div>`);
    const grid = shelf.querySelector('.docgrid');
    for (const group of groupDocsByLabel(d.documents)) {
      const doc = group.newest;
      // One-deliverable law: the retired capture-brief baseline stays off
      // the shelf (the Pre-Assessment is the product; views + picture stay).
      const briefLabel = (doc && doc.label) || '';
      if (/federal opportunity assessment/i.test(briefLabel)
          && !/pre.?assessment/i.test(briefLabel)) continue;
      // a build that once passed QA leads the preview line: its "superseded"
      // label is the one that prevents a stale pass reading as sendable
      const older = group.members.slice(1)
        .sort((a, b) => (b.qa_pass === true) - (a.qa_pass === true))
        .slice(0, 3).map(m =>
          `${esc((m.fmt || '').toUpperCase())} · ${new Date((m.updated || 0) * 1000)
            .toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}` +
          (m.qa_pass === true ? ' · passed, superseded' : '')).join('  /  ')
        + (group.count > 4 ? '  /  …' : '');
      const when = new Date(doc.updated * 1000).toLocaleDateString('en-US',
        { month: 'short', day: 'numeric', year: 'numeric' });
      const badge = doc.kind === 'working'
        ? '<span class="qa-badge" style="color:var(--blue-dk)">INTELLIGENCE · INTERNAL</span>'
        : doc.qa_pass === true
        ? '<span class="qa-badge" style="color:var(--ok)">QA PASSED</span>'
        : doc.qa_pass === false
        ? '<span class="qa-badge" style="color:var(--bad)">DO NOT SEND</span>'
        : '<span class="qa-badge" style="color:var(--muted)">MIRROR · STATE NOT TRACKED</span>';
      const preview = doc.fmt === 'html'
        ? `<iframe src="/report?path=${encodeURIComponent(doc.path)}" tabindex="-1" scrolling="no"></iframe>`
        : `<div class="fauxdoc"><div class="fl hd"></div><div class="fl" style="width:90%"></div>
           <div class="fl" style="width:82%"></div><div class="fl" style="width:88%"></div>
           <div class="fl" style="width:60%"></div><div class="fl" style="width:85%;margin-top:14px"></div>
           <div class="fl" style="width:78%"></div><div class="fl" style="width:83%"></div></div>`;
      const card = el(`<div class="docard" role="button" tabindex="0" title="${esc(doc.label)}">
        <div class="page">${preview}
          <span class="doc-ctls">
            <span class="doc-ctl" role="button" tabindex="0" title="move left">&#9664;</span>
            <span class="doc-ctl" role="button" tabindex="0" title="move right">&#9654;</span>
            <span class="doc-ctl x" role="button" tabindex="0" title="hide from shelf (file kept)">&#215;</span>
            ${doc.fmt === 'html' ? '<span class="doc-ctl pdf" role="button" tabindex="0" aria-label="Internal review PDF (watermarked)" title="Internal review PDF (watermarked)">&#10515;</span>' : ''}
          </span>
          <span class="fmt-badge">${esc((doc.fmt || '').toUpperCase())}</span></div>
        <div class="meta">
          <div class="eyebrow">${esc(doc.stage || 'Report')}</div>
          <div class="ttl">${esc(doc.label)}</div>
          <div class="dt">${when}${group.count > 1 ? ` · newest of ${group.count}` : ''}</div>
          ${badge}
          ${group.count > 1 ? `<div style="font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35">${older}</div>` : ''}
        </div>
      </div>`);
      card.onclick = () => {
        if (doc.fmt === 'html' || doc.source === 'desktop')
          window.open('/report?path=' + encodeURIComponent(doc.path), '_blank');
        else viewArtifact({ path: doc.path, fmt: doc.fmt }, docViewer);
      };
      const [left, right, hide] = card.querySelectorAll('.doc-ctl');
      const pdfCtl = card.querySelector('.doc-ctl.pdf');
      if (pdfCtl) {
        const fire = (e) => { e.stopPropagation(); reviewPdf(doc.path, pdfCtl); };
        pdfCtl.onclick = fire;
        pdfCtl.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fire(e); } };
      }
      left.onclick = (e) => { e.stopPropagation(); moveDoc(doc.key, -1); };
      right.onclick = (e) => { e.stopPropagation(); moveDoc(doc.key, +1); };
      hide.onclick = (e) => { e.stopPropagation(); hideDoc(doc); };
      grid.appendChild(card);
      if (doc.fmt === 'md' && doc.source !== 'desktop') fillMiniDoc(card, doc);
    }
    if (d.docs_hidden) {
      const restore = el(`<button class="alink" style="margin-top:6px">Show ${d.docs_hidden} hidden document${d.docs_hidden > 1 ? 's' : ''}</button>`);
      restore.onclick = async () => { await docPrefs({ unhide_all: true }); select(SEL); };
      shelf.appendChild(restore);
    }
    // Deliverables live one tab over (Phase B): the operating screen leads
    // with the pipeline; documents are one card per family with history.
    const deliverPane = $id('pane-deliverables') || main;
    deliverPane.appendChild(shelf);
    var docViewer = el('<div class="viewer"></div>');
    deliverPane.appendChild(docViewer);
  }

  const stepsWrap = el('<div></div>');
  let steps = null;
  let lastStage = null;
  let finalePlaced = false;
  d.steps.forEach((s, i) => {
    const stage = s.stage || 'ASSESS';
    if (stage !== lastStage) {
      // The capture brief CLOSES the Assess stage: the red button renders as
      // Assess's final step, before Target ever starts. Execute stays parked.
      if (lastStage === 'ASSESS' && !finalePlaced) {
        stepsWrap.appendChild(buildFinale(d));
        finalePlaced = true;
      }
      const stageNum = {ASSESS:'01',TARGET:'02',EXECUTE:'03'}[stage] || '';
      stepsWrap.appendChild(el(`<div class="stage-hd">STAGE ${stageNum} — ${esc(stage)}</div>`));
      steps = el('<div class="steps"></div>');
      stepsWrap.appendChild(steps);
      lastStage = stage;
    }
    steps.appendChild(stepCard(s, i + 1));
  });
  if (!finalePlaced) stepsWrap.appendChild(buildFinale(d));
  main.appendChild(stepsWrap);
}

/* ============ FINAL PRODUCT: the canonical Signal Board ============ */
function buildFinale(d) {
  const locked = !d.assess_ready || !d.review_approved;
  const origin = {
    slug: d.slug,
    workstationId: (d.workstation && d.workstation.ref.id) || WSEL,
    clientName: d.client_name,
  };
  const refreshOrigin = () => {
    if (isActiveOrigin(origin)) {
      return openWorkstation(origin.slug, origin.workstationId, { history: 'none' });
    }
    return Promise.resolve();
  };
  // one deliverable law (2026-07-18): the Signal Board is the product.
  // The capture-brief press button, its format picker, and its delivery
  // downloads are hidden; this builder's code and the runner stay intact
  // (the press route is flag-gated server-side, LILA_CAPTURE_BRIEF=1).
  // The internal preview below keeps opening historical artifacts.
  const SHOW_CAPTURE_BRIEF = false;
  const wrap = el(`<div class="finale">
    <div class="stage-hd">Federal Opportunity Pre-Assessment</div>
    ${SHOW_CAPTURE_BRIEF ? `<button class="btn-final" ${locked ? `disabled title="${!d.assess_ready ? 'unlocks after the opportunity search' : 'approve the reviewed opportunities in the Review step first'}"` : ''}>
      Produce Opportunity Assessment</button>
    <label style="display:flex;gap:7px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted);cursor:pointer" title="three cached schema-enforced compose calls instead of one monolith: unchanged sections never re-pay their model cost on a re-press">
      <input type="checkbox" class="opt-split" ${locked ? 'disabled' : ''}>
      sectioned compose — cache narrative, news, and boards independently
    </label>` : ''}
    <div class="finale-note">${locked
      ? (!d.assess_ready
          ? 'Unlocks after the opportunity search and review.'
          : 'Approve the reviewed opportunities above to activate.')
      : 'One press: live search, verification, and the certified report.'}</div>
    <div class="dl-row" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px"></div>
    <div class="dl-msg" style="font-family:var(--mono),monospace;font-size:11px;margin-top:6px"></div>
    <div class="console"></div>
    <div class="fin-preview-slot"></div>
    <div style="display:flex;justify-content:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--rule-dk)">
      <button class="btn sm ghost btn-one-refresh"
        title="Adjust keywords, NAICS, or scope and re-approve to run a fresh press">
        Refresh &middot; return to the Analyst Layer</button>
    </div>
  </div>`);
  const signalRow = wrap.querySelector('.dl-row');
  const signalMsg = wrap.querySelector('.dl-msg');
  const signalDownload = el('<button class="btn sm">Download HTML — Federal Opportunity Pre-Assessment</button>');
  signalDownload.onclick = async () => {
    const href = `/client/${d.slug}/download/signal-board.html`;
    const r = await fetch(href);
    if (r.ok) { window.location = href; signalMsg.textContent = ''; signalMsg.style.color = ''; return; }
    const j = await r.json().catch(() => ({}));
    signalMsg.style.color = j.do_not_send ? 'var(--bad,#e06060)' : 'var(--muted)';
    signalMsg.textContent = (j.do_not_send ? 'DO NOT SEND — ' : '') + (j.error || r.statusText);
  };
  signalRow.appendChild(signalDownload);
  const oneRefresh = wrap.querySelector('.btn-one-refresh');
  if (oneRefresh) oneRefresh.onclick = () => {
    const gateCard = document.querySelector('.step[data-key="gate"]');
    if (gateCard) gateCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  const btn = wrap.querySelector('.btn-final');
  const con = wrap.querySelector('.console');

  const slot = wrap.querySelector('.fin-preview-slot');
  const renderPreview = fb => {
    if (!fb) return;
    slot.innerHTML = '';
    const when = new Date(fb.updated * 1000).toLocaleString('en-US',
      { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    slot.appendChild(el(`<div class="finale-preview">
      <div class="cap">
        <span class="t">${esc(d.display_name || d.client_name)} · Federal Opportunity Pre-Assessment</span>
        <span class="s">The conclusion of every stage above · ${esc(when)}</span>
        <span style="flex:1"></span>
        ${fb.qa_pass
          ? '<span class="qa-badge" style="color:#54d67b">QA PASSED — CLIENT READY</span>'
          : `<span class="qa-badge" style="color:#e06060" title="${esc(fb.reason || '')}">NOT RELEASABLE — ${esc((fb.reason || 'QA FAILED').slice(0, 80).toUpperCase())}</span>`}
        <button class="btn sm ghost" style="border-color:#9db2c9;color:#f6f4ef"
          onclick="window.open('/report?path=${encodeURIComponent(fb.path)}${String(fb.family || '').startsWith('signal_board') ? '&logo_editor=1' : ''}', '_blank')">${String(fb.family || '').startsWith('signal_board') ? 'Open & customize marks' : 'Open full report'}</button>
        ${String(fb.family || '').startsWith('signal_board') ? '' : `<button class="btn sm ghost review-pdf-btn" style="border-color:#9db2c9;color:#f6f4ef"
          title="Watermarked internal copy for review; the client deliverable ships only through the gated export">Review PDF (internal)</button>`}
      </div>
    </div>`));
    const rp = slot.querySelector('.review-pdf-btn');
    if (rp) rp.onclick = () => reviewPdf(fb.path, rp);
  };
  // one-deliverable law: the brief preview presented the capture-brief as
  // the client deliverable; demoted, it stays reachable only through the
  // internal documents shelf and sidebar (both internal-labeled).
  if (d.signal_board) renderPreview(d.signal_board);
  else if (SHOW_CAPTURE_BRIEF) renderPreview(d.final_brief);
  // Dossier press retired from the finale (clean pass, 2026-07-24).
  // Refresh Watchlist retired (one-refresh law, 2026-07-23).
  if (btn) btn.onclick = async () => {
    btn.disabled = true; btn.classList.add('working');
    btn.textContent = 'Producing — weighing the full picture ...';
    con.classList.add('show'); con.textContent = 'starting…';
    const halt = msg => {  // a snag STOPS everything, visibly
      btn.classList.remove('working'); btn.disabled = false;
      btn.textContent = 'Produce Opportunity Assessment';
      con.textContent += `\n\n[HALTED] ${msg}`;
      con.scrollTop = con.scrollHeight;
    };
    try {
      const splitOpt = wrap.querySelector('.opt-split');
      const { job_id } = await api('/api/run', { method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ client_name: origin.clientName, step: 'report',
                               args: { kind: 'capture_brief',
                                       workstation_id: origin.workstationId,
                                       ...(splitOpt && splitOpt.checked
                                           ? { compose_split: true } : {}) } }) });
      const poll = setInterval(async () => {
        let j;
        try { j = await api('/api/job/' + job_id); }
        catch (e) { clearInterval(poll); halt('lost contact with the job: ' + e.message); return; }
        con.textContent = renderJobConsole(j);
        con.scrollTop = con.scrollHeight;
        if (j.status !== 'running') {
          clearInterval(poll);
          if (j.status === 'done' || j.artifacts_written) {
            btn.classList.remove('working'); btn.disabled = false;
            btn.textContent = 'Rebuild Opportunity Assessment';
            con.textContent += j.status === 'done'
              ? '\n\n[done]'
              : '\n\n[DRAFT AVAILABLE] release blocked; review the QA log above';
            refreshOrigin();
          } else {
            halt('the run failed — read the log above, fix, and press again.');
          }
        }
      }, 900);
    } catch (e) { halt(e.message); }
  };
  return wrap;
}

/* ---- downloads: first-class controls, not buried in a menu ---- */
function buildDownloads(row, msg, d) {
  const dl = (label, href, ghost) => {
    const b = el(`<button class="btn sm ${ghost ? 'ghost' : ''}">${label}</button>`);
    b.onclick = async () => {
      // probe first so a DO-NOT-SEND state surfaces in the dashboard
      // instead of a browser download error
      const r = await fetch(href);
      if (r.ok) { window.location = href; msg.textContent = ''; msg.style.color = ''; return; }
      const j = await r.json().catch(() => ({}));
      msg.style.color = j.do_not_send ? 'var(--bad,#e06060)' : 'var(--muted)';
      msg.textContent = (j.do_not_send ? 'DO NOT SEND — ' : '') + (j.error || r.statusText);
    };
    return b;
  };
  row.appendChild(dl('Download HTML — Federal Opportunity Assessment',
                     `/client/${d.slug}/download/foa.html`, false));
  const pdfBtn = el(`<button class="btn sm ghost">PDF — Assessment</button>`);
  pdfBtn.onclick = () => exportPdf('foa', d, pdfBtn, msg);
  row.appendChild(pdfBtn);
  const targets = (d.sidebar && d.sidebar.targets) || [];
  for (const t of targets.filter(t => t.dossier)) {
    row.appendChild(dl(`Dossier #${t.rank}`, `/client/${d.slug}/download/dossier/${t.rank}.html`, true));
  }
  if (targets.some(t => t.dossier)) {
    row.appendChild(dl('Download all dossiers', `/client/${d.slug}/download/dossiers.html`, true));
  }
}

async function exportPdf(kind, d, btn, msg) {
  btn.disabled = true;
  msg.style.color = ''; msg.textContent = 'exporting PDF (gates run first) …';
  try {
    const r = await fetch('/api/export/pdf', { method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ slug: d.slug, kind }) });
    const j = await r.json();
    if (r.ok && j.pdf) {
      msg.textContent = '';
      window.open('/report?path=' + encodeURIComponent(j.pdf), '_blank');
    } else {
      msg.style.color = j.do_not_send ? 'var(--bad,#e06060)' : 'var(--muted)';

function stepCard(s, n) {
  const [chipCls, chipTxt] = STATE_CHIP[s.state] || STATE_CHIP.waiting;
  const card = el(`<div class="step ${s.state}" data-key="${esc(s.key)}">
      <div class="num">${s.state === 'done' ? '✓' : n}</div>
      <div class="hd"><h2>${esc(s.title)}</h2><span class="chip ${chipCls}">${chipTxt}</span></div>
      <div class="sum">${esc(s.summary)}</div>
      <div class="acts"></div>
      <div class="arts"></div>
      <div class="console"></div>
      <div class="viewer"></div>
    </div>`);
  const acts = card.querySelector('.acts');
  const arts = card.querySelector('.arts');
  const viewer = card.querySelector('.viewer');

  // artifacts -> readable buttons
  for (const a of s.artifacts) {
    const b = el(`<button class="alink">${esc(a.name)}</button>`);
    b.onclick = () => viewArtifact(a, viewer);
    arts.appendChild(b);
  }

  if (s.key === 'approve') buildGate(s, card, acts, viewer);
  else if (s.key === 'review') buildReview(s, acts, card);
  else if (s.key === 'search' && !s.action
           && Array.isArray((s.detail || {}).opportunities)) {
    buildReadOnlySearchReview(s, acts, card);
  }
  else if (s.action && s.action.kind === 'run') buildRun(s, acts, card);
  return card;
}

/* ---- gate card: read, REVISE, approve/reject ---- */
const KW_CATS = ['capability', 'technology', 'naics', 'agency', 'set_aside', 'search_term'];
let GATE = null;

function buildGate(s, card, acts, viewer) {
  if (s.detail.strategy_md) {
    const show = el(`<button class="alink">Read the full strategy</button>`);
    show.onclick = () => { viewer.classList.toggle('show');
      if (!viewer.innerHTML) viewer.innerHTML = safeMarkdownHtml(s.detail.strategy_md); };
    acts.appendChild(show);
  }
  if (s.detail.revision_count) {
    acts.appendChild(el(`<span class="chip c-ready" title="hand-revised${s.detail.revised_at ? ' ' + esc(s.detail.revised_at) : ''}">REVISED ×${s.detail.revision_count}</span>`));
  }
  const locked = s.detail.status === 'approved';

  // 1 · ANALYST LAYER: strategy, keywords, and NAICS live HERE. Pre-lock
  // edits revise the strategy; post-lock edits preserve approval.
  const panel = el(`<div class="gate-edit" style="display:none"></div>`);
  const editBtn = el(`<button class="btn sm ghost">Open Analyst Layer</button>`);
  editBtn.onclick = () => {
    const opening = panel.style.display === 'none';
    panel.style.display = opening ? 'block' : 'none';
    editBtn.textContent = opening ? 'Close Analyst Layer' : 'Open Analyst Layer';
    if (opening) renderStrategyEditor(panel, s.detail.strategy || {}, s.detail);
  };
  acts.appendChild(editBtn);
  card.appendChild(panel);

  // 2 · SCOPE: chosen after the terms are settled; ALWAYS visible (it is a
  // search-time choice and must survive the lock).
  const scopeBox = el(`<div class="gate-field" style="margin-top:10px"></div>`);
  renderScopeControl(scopeBox, s.detail);
  card.appendChild(scopeBox);

  if (locked) {
    // THE run control (operator ruling 2026-07-25): an approved client gets
    // one unmistakable button. Live watch + press in one job; the report
    // lands on the Deliverables shelf and the calendar refreshes.
    const pressBar = el(`<div class="gate-savebar" style="margin-top:10px"></div>`);
    const press = el(`<button class="btn ok">Run report</button>`);
    const pressMsg = el(`<span class="gate-msg" role="status"></span>`);
    const pressCon = el(`<div class="console"></div>`);
    press.onclick = async () => {
      press.disabled = true;
      press.textContent = 'Running — live watch + press …';
      pressCon.classList.add('show');
      pressCon.textContent = 'starting…';
      try {
        const { job_id } = await api('/api/run', { method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ client_name: DETAIL.client_name,
            step: 'candidate_review',
            args: { workstation_id: WSEL } }) });
        const poll = setInterval(async () => {
          const j = await api('/api/job/' + job_id);
          pressCon.textContent = renderJobConsole(j);
          pressCon.scrollTop = pressCon.scrollHeight;
          if (j.status !== 'running') {
            clearInterval(poll);
            press.disabled = false;
            press.textContent = 'Run report';
            pressMsg.textContent = j.status === 'done'
              ? 'report pressed · see Deliverables'
              : 'run stopped · the console names the reason';
            if (j.status === 'done' || j.artifacts_written) {
              openWorkstation(DETAIL.slug, WSEL, { history: 'none' });
            }
          }
        }, 1500);
      } catch (error) {
        press.disabled = false;
        press.textContent = 'Run report';
        pressMsg.style.color = 'var(--bad)';
        pressMsg.textContent = 'not started: ' + (error.message || error);
      }
    };
    pressBar.append(press, pressMsg);
    card.appendChild(pressBar);
    card.appendChild(pressCon);
    // A stale or early workstation still presses the report (the press
    // runs its own live watch); only the LEGACY machinery below stays
    // suppressed for early modes.
    if (DETAIL && (DETAIL.workstation_mode === 'legacy-current-early'
        || DETAIL.workstation_mode === 'native-early')) return;
    // 3 · RUN: terms locked + scope chosen -> launch. The fan-out visual
    // renders in the Opportunity search step below.
    const runBar = el(`<div class="gate-savebar" style="margin-top:8px"></div>`);
    const run = el(`<button class="btn sm">Run opportunity search →</button>`);
    run.onclick = async () => {
      run.disabled = true;
      try { await SCOPE_SAVE; } catch (_e) { /* status handled below */ }
      if (!SCOPE_SAVE_OK) {
        run.disabled = false;
        run.textContent = 'Scope not saved — fix the scope above, then run';
        setTimeout(() => { run.textContent = 'Run opportunity search →'; }, 3500);
        return;
      }
      run.disabled = false;
      const searchCard = document.querySelector('.step[data-key="search"]');
      if (searchCard) {
        runJob('searches', {}, searchCard, run);
        searchCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else runJob('searches', {}, card, run);
    };
    runBar.append(run, el(`<span class="gate-sub">uses the locked keywords/codes + the scope above; the live board renders in the search step</span>`));
    if (SHOW_LEGACY_WORKSTATION) card.appendChild(runBar);

    return;
  }

  const note = el(`<input placeholder="note (rejections should say what to change)" style="max-width:340px">`);
  const yes = el(`<button class="btn ok sm">Approve + Run report</button>`);
  const no  = el(`<button class="btn bad sm">Reject</button>`);
  const decisionMsg = el('<span class="gate-msg" role="status"></span>');
  yes.onclick = () => gate(true, note.value, [yes, no], decisionMsg);
  no.onclick  = () => gate(false, note.value, [yes, no], decisionMsg);
  acts.append(note, yes, no, decisionMsg);
}


/* scope control: All agencies (plain assessment, no designator) vs Specific
   (scoped sweep + designator). Lives in the Analyst Layer, survives the lock,
   saves instantly. */
function renderScopeControl(box, detail) {
  if (DETAIL && DETAIL.workstation) {
    const ref = DETAIL.workstation.ref;
    box.innerHTML = `<label>Workstation scope
      <span class="gate-sub">scope is durable identity here; switching the top rail changes the entire workstation and never rewrites this gate</span></label>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px">
        <span class="chip c-ready">${esc(ref.label)}</span>
        <span class="gate-msg">Bound as <b>${esc(ref.id)}</b> · use the top workstation rail to change views</span>
      </div>`;
    return;
  }
  const state = { search_scope: (detail && detail.search_scope) || { all: true },
                  chips: [] };
  api('/api/agencies').then(j => { state.chips = j.chips || []; draw(); }).catch(() => {});
  const draw = () => {
    box.innerHTML = '';
    box.appendChild(el(`<label>Search scope
      <span class="gate-sub">all agencies renders a plain Federal Opportunity Assessment; picking agencies scopes the sweep and the report carries the designator</span></label>`));
    const row = el(`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"></div>`);
    const msg = el(`<span class="gate-msg"></span>`);
    const selected = state.search_scope.agencies || [];
    const isAll = !selected.length;
    const save = (scope) => {
      // serialized queue (A4, 2026-07-12): rapid chip clicks compose in
      // click order and can never lose an earlier selection to a race; the
      // run-search button awaits this chain so a sweep can never launch on
      // a scope the server has not persisted.
      msg.textContent = 'saving …';
      SCOPE_SAVE = SCOPE_SAVE.then(async () => {
        const r = await api('/api/strategy/scope', { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client_name: DETAIL.client_name, scope }) });
        state.search_scope = r.search_scope;
        SCOPE_SAVE_OK = true;
        msg.textContent = '';
        draw();
      }).catch(e => {
        SCOPE_SAVE_OK = false;
        msg.textContent = 'scope not saved: ' + (e.message || e);
      });
      return SCOPE_SAVE;
    };
    const toggle = (abbr) => {
      const cur = state.search_scope.agencies || [];
      const next = cur.includes(abbr)
        ? cur.filter(a => a !== abbr) : [...cur, abbr];
      state.search_scope = next.length ? { agencies: next } : { all: true };
      draw();  // optimistic: the chips reflect the click instantly
      save(next.length ? { agencies: next } : { all: true });
    };
    const allBtn = el(`<button class="btn sm ${isAll ? '' : 'ghost'}">All agencies</button>`);
    allBtn.onclick = () => save({ all: true });
    row.appendChild(allBtn);
    // one-click agency chips: the prefill set + anything already selected
    const shown = [...new Set([...state.chips, ...selected])];
    shown.forEach(abbr => {
      const on = selected.includes(abbr);
      const c = el(`<button class="btn sm ${on ? '' : 'ghost'}" style="${on ? 'border-color:#54d67b' : ''}">${esc(abbr)}${on ? ' ×' : ''}</button>`);
      c.onclick = () => toggle(abbr);
      row.appendChild(c);
    });
    // Other…: reveal the autocomplete-backed input for any agency
    const other = el(`<button class="btn sm ghost">Other…</button>`);
    const add = el(`<input class="chip-add" placeholder="type an agency + Enter" style="display:none;max-width:230px">`);
    other.onclick = () => { add.style.display = 'inline-block'; add.focus(); };
    add.onkeydown = async (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const q = add.value.trim();
      if (!q) return;
      try {
        const j = await api('/api/agencies?q=' + encodeURIComponent(q));
        const m = (j.matches || [])[0];
        if (!m) { msg.textContent = `no agency match for "${q}"`; return; }
        add.value = '';
        if (!selected.includes(m.abbr)) toggle(m.abbr);
      } catch (err) { msg.textContent = 'scope not saved: ' + (err.message || err); }
    };
    row.append(other, add, msg);
    box.appendChild(row);
  };
  draw();
}

const NAICS_EXPLANATION_NEEDED = 'This legacy strategy retained the code but not a code-specific rationale. Inspect it and add the explanation before relying on this lane.';

const cloneNaics = e => ({
  code: (e.code || '').trim(), title: e.title || '',
  role: e.role === 'core' ? 'core' : 'boundary',
  origin: e.origin || 'system', rationale: e.rationale || '', note: e.note || '',
  _rationaleSource: e._rationaleSource || ((e.rationale || '').trim() ? 'explicit' : 'missing'),
  _reviewContext: e._reviewContext || '' });

function legacyNaicsExplanation(code, keywords, nearMisses) {
  // Recover only exact-code evidence already retained in the packet. A NAICS
  // keyword rationale is an affirmative explanation. A matching near-miss is
  // potentially exclusionary, so preserve it separately as review context and
  // never recast it as the reason the code belongs.
  const key = String(code).trim().toLowerCase();
  const kw = (keywords || []).find(k => String(k.category || '').toLowerCase() === 'naics'
    && String(k.term || '').trim().toLowerCase() === key && String(k.rationale || '').trim());
  const near = (nearMisses || []).find(c => String(c.kind || '').toLowerCase() === 'naics'
    && String(c.value || '').trim().toLowerCase() === key && String(c.reason || '').trim());
  const reconsider = NAICS_RECONSIDER_RULES.find(r => r.code === key
    && (keywords || []).some(k => r.pattern.test(k.term || '')));
  const context = near ? String(near.reason).trim()
    : (reconsider ? reconsider.reason + ' (flagged from your keywords; never changed for you)' : '');
  return {
    rationale: kw ? String(kw.rationale).trim() : '',
    source: kw ? 'legacy-keyword' : 'missing',
    context,
  };
}

function retainNaicsReviewContext(entry, context) {
  if (!context) return;
  entry._reviewContext = entry._reviewContext || context;
  const normalize = value => String(value || '').trim().replace(/\s+/g, ' ').toLowerCase();
  // The first workshop version persisted the mixed near-miss text as an
  // affirmative rationale. Migrate that exact legacy shape back to context.
  if (normalize(entry.rationale) === normalize(context)) {
    entry.rationale = '';
    entry._rationaleSource = 'missing';
  }
}

function normalizeNaics(codes, meta, keywords, nearMisses) {
  // The boundary is inferred_naics; metadata rides alongside per code. New
  // intake packets carry complete metadata. Legacy packets recover only exact
  // retained evidence and stay visibly incomplete when none exists.
  const byCode = {};
  (meta || []).forEach(m => { if (m && m.code) byCode[String(m.code).trim()] = m; });
  const seen = new Set(); const out = [];
  (codes || []).forEach(c => {
    const code = String(c).trim();
    if (!code || seen.has(code)) return;
    seen.add(code);
    const entry = cloneNaics(byCode[code] || { code, origin: 'system' });
    const recovered = legacyNaicsExplanation(code, keywords, nearMisses);
    if (!(entry.rationale || '').trim()) {
      entry.rationale = recovered.rationale;
      entry._rationaleSource = recovered.source;
    }
    // Review context is independent of an affirmative rationale. Retain both
    // when the packet records why a code was close and why it had been cut.
    retainNaicsReviewContext(entry, recovered.context);
    out.push(entry);
  });
  return out;
}

// classification bands: the consultant-facing grouping of the real
// KeywordCategory enum (no schema migration — display only)
const KW_BANDS = [
  { key: 'core', label: 'Core capabilities', cats: ['capability'] },
  { key: 'adjacent', label: 'Adjacent capabilities', cats: ['technology'] },
  { key: 'buyer', label: 'Buyer language', cats: ['agency'] },
  { key: 'mission', label: 'Mission language', cats: ['search_term'] },
  { key: 'structural', label: 'Structural', cats: ['naics', 'set_aside'] },
];
const KW_PROV_ICON = { system: '◇', consultant: '◆', edited: '✎' };
const KW_PROV_LABEL = { system: 'System inferred', consultant: 'Consultant added',
                       edited: 'Consultant edited' };

function bandFor(cat) {
  const b = KW_BANDS.find(b => b.cats.includes(cat));
  return b ? b.key : 'mission';
}
function normTerm(t) { return (t || '').trim().toLowerCase(); }

// Data-driven keyword→NAICS reconsideration rules (2026-07-12): generalizes
// the former hard-coded MDR/541513 nudge into the candidate/decision system.
// A rule NEVER adds a code; it surfaces a code as a judgment-lane candidate so
// the consultant decides. Add rows here, not inline logic.
const NAICS_RECONSIDER_RULES = [
  { pattern: /managed detection and response|\bmdr\b/i, code: '541513',
    title: 'Computer Facilities Management Services',
    reason: 'the “managed detection and response” keyword points at a managed-service lane' },
  { pattern: /\bsatellite|\bspace\b|geospatial/i, code: '517410',
    title: 'Satellite Telecommunications',
    reason: 'space/satellite keywords may justify the satellite telecom lane' },
  { pattern: /training|simulation|courseware/i, code: '611430',
    title: 'Professional and Management Development Training',
    reason: 'training/simulation keywords may justify the training-services lane' },
];

function naicsReconsiderCandidates(g) {
  // codes a keyword suggests reconsidering, not already in the boundary or
  // already kept out. Surfaced as judgment-lane candidates; never auto-added.
  const inBoundary = new Set(g.naics.map(e => e.code));
  const keptOut = new Set((g.kept_out_naics || []).map(e => e.code));
  const out = [];
  for (const r of NAICS_RECONSIDER_RULES) {
    if (inBoundary.has(r.code) || keptOut.has(r.code)) continue;
    if (g.keywords.some(k => r.pattern.test(k.term))) {
      out.push({ value: r.code, kind: 'naics', title: r.title,
        reason: r.reason + ' (flagged from your keywords; never changed for you)',
        confidence: 0.5, origin: 'reconsider' });
    }
  }
  return out;
}

function renderKeywordWorkshop(panel) {
  const g = GATE;
  const wrap = el(`<div class="kws"></div>`);

  // summary header
  const inN = g.keywords.length;
  const judgeN = (g.near_misses || []).filter(c => c.kind !== 'naics'
    && !g.keywords.some(k => normTerm(k.term) === normTerm(c.value))
    && !g.kept_out.some(k => normTerm(k.term) === normTerm(c.value))).length;
  const outN = g.kept_out.length;
  const summary = el(`<div class="kws-summary">
    <div class="kws-stat"><span class="n">${inN}</span><span class="k">terms in search</span></div>
    <div class="kws-stat judge"><span class="n">${judgeN}</span><span class="k">need judgment</span></div>
    <div class="kws-stat out"><span class="n">${outN}</span><span class="k">kept out</span></div>
  </div>`);
  wrap.appendChild(summary);

  // add-term field
  wrap.appendChild(buildAddTerm(panel));

  // undo banner (after a move-out)
  if (g.undo) {
    const u = el(`<div class="kws-undo" role="status"><span>Moved “${esc(g.undo.kw.term)}” out of the search.</span></div>`);
    const btn = el(`<button class="btn sm ghost">Undo</button>`);
    btn.onclick = () => {
      const i = g.kept_out.findIndex(k => k === g.undo.kw);
      if (i >= 0) g.kept_out.splice(i, 1);
      g.keywords.push(g.undo.kw);
      g.undo = null; drawEditor(panel);
    };
    u.appendChild(btn);
    wrap.appendChild(u);
  }

  const grid = el(`<div class="kws-grid"></div>`);
  const main = el(`<div></div>`);

  // LANE 1 — IN THE SEARCH, grouped by classification band
  for (const band of KW_BANDS) {
    const members = g.keywords.map((k, i) => ({ k, i }))
      .filter(x => bandFor(x.k.category) === band.key);
    if (!members.length) continue;
    const sec = el(`<div class="kws-band"><h4>${esc(band.label)} <span class="c">${members.length}</span></h4></div>`);
    const lane = el(`<div class="kws-lane"></div>`);
    members.forEach(({ k, i }) => lane.appendChild(buildChip(k, i, panel)));
    sec.appendChild(lane); main.appendChild(sec);
  }
  if (!g.keywords.length)
    main.appendChild(el(`<div class="kws-inspector empty">No terms in the search yet. Add one above, or promote a term that needs judgment.</div>`));

  // LANE 2 — NEEDS YOUR JUDGMENT (borderline near-misses)
  const borderline = (g.near_misses || []).filter(c => c.kind !== 'naics'
    && !g.keywords.some(k => normTerm(k.term) === normTerm(c.value))
    && !g.kept_out.some(k => normTerm(k.term) === normTerm(c.value)));
  if (borderline.length) {
    const sec = el(`<div class="kws-band" style="margin-top:20px"><h4 style="color:var(--warn)">Needs your judgment <span class="c">${borderline.length}</span></h4></div>`);
    borderline.forEach(c => sec.appendChild(buildBorderline(c, panel)));
    main.appendChild(sec);
  }

  // LANE 3 — KEPT OUT (collapsed drawer, restorable)
  if (g.kept_out.length) {
    const det = el(`<details class="kws-out"><summary>Kept out · ${g.kept_out.length} (preserved, restorable)</summary></details>`);
    const lane = el(`<div class="kws-lane" style="margin-top:8px"></div>`);
    g.kept_out.forEach((k, i) => lane.appendChild(buildKeptChip(k, i, panel)));
    det.appendChild(lane); main.appendChild(det);
  }

  grid.appendChild(main);
  grid.appendChild(buildInspector(panel));
  wrap.appendChild(grid);
  panel.appendChild(wrap);
}

function buildChip(k, i, panel) {
  const g = GATE;
  const sel = g.selected && g.selected.lane === 'in' && g.selected.index === i;
  const chip = el(`<span class="kw-chip${sel ? ' sel' : ''}" tabindex="0" role="button"
    aria-label="${esc(k.term)} — inspect or edit"></span>`);
  chip.appendChild(el(`<span class="prov" title="${esc(KW_PROV_LABEL[k.origin] || 'System inferred')}">${KW_PROV_ICON[k.origin] || '◇'}</span>`));
  chip.appendChild(el(`<span>${esc(k.term)}</span>`));
  chip.appendChild(el(`<span class="cat">${esc(k.category)}</span>`));
  const rm = el(`<button class="rm" aria-label="Move “${esc(k.term)}” out of search">&times;</button>`);
  rm.title = 'Move out of search';
  rm.onclick = (e) => { e.stopPropagation(); moveOut(i, panel); };
  chip.appendChild(rm);
  const open = () => { g.selected = { lane: 'in', index: i }; drawEditor(panel); };
  chip.onclick = open;
  chip.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  return chip;
}

function buildKeptChip(k, i, panel) {
  const g = GATE;
  const chip = el(`<span class="kw-chip" tabindex="0" role="group" aria-label="${esc(k.term)} — kept out"></span>`);
  chip.appendChild(el(`<span>${esc(k.term)}</span>`));
  chip.appendChild(el(`<span class="cat">${esc(k.category)}</span>`));
  const rs = el(`<button class="rm" aria-label="Restore “${esc(k.term)}” to search" title="Restore to search">↩</button>`);
  rs.onclick = (e) => { e.stopPropagation(); g.kept_out.splice(i, 1); g.keywords.push(k); drawEditor(panel); };
  chip.appendChild(rs);
  return chip;
}

function buildBorderline(c, panel) {
  const g = GATE;
  const conf = Math.round((c.confidence || 0) * 100);
  const risk = conf < 40 ? 'Low confidence' : (c.category === 'agency' ? 'Adjacent relevance' : 'Possible breadth');
  const box = el(`<div class="kw-judge"></div>`);
  box.appendChild(el(`<div class="t">${esc(c.value)}</div>`));
  box.appendChild(el(`<span class="risk">${esc(risk)} · ${conf}% confidence</span>`));
  box.appendChild(el(`<div class="why">${esc(c.reason || 'Inferred as a near-miss and withheld for your judgment.')}</div>`));
  const acts = el(`<div class="acts"></div>`);
  const use = el(`<button class="btn sm">Use in search</button>`);
  use.onclick = () => { promoteBorderline(c, c.value, panel); };
  const edit = el(`<button class="btn sm ghost">Edit first</button>`);
  edit.onclick = () => {
    const v = prompt('Refine the term before adding it to the search:', c.value);
    if (v && v.trim()) promoteBorderline(c, v.trim(), panel);
  };
  const keep = el(`<button class="btn sm ghost">Keep out</button>`);
  keep.onclick = () => {
    g.kept_out.push({ term: c.value, category: c.category || 'search_term',
      rationale: c.reason || '', origin: 'system',
      note: 'kept out at review: ' + (c.reason || 'borderline, not pursued') });
    drawEditor(panel);
  };
  acts.append(use, edit, keep);
  box.appendChild(acts);
  return box;
}

function promoteBorderline(c, term, panel) {
  const g = GATE;
  const edited = normTerm(term) !== normTerm(c.value);
  g.keywords.push({ term, category: c.category || 'capability',
    rationale: c.reason || 'promoted from the judgment queue',
    origin: edited ? 'edited' : 'system',
    edited_from: edited ? c.value : null,
    note: 'promoted from “needs judgment” at review' });
  g.selected = { lane: 'in', index: g.keywords.length - 1 };
  drawEditor(panel);
}

function moveOut(i, panel) {
  const g = GATE;
  const [kw] = g.keywords.splice(i, 1);
  kw.note = kw.note || 'moved out of the search at review';
  g.kept_out.push(kw);
  g.selected = null;
  if (g.undo && g.undo.timer) clearTimeout(g.undo.timer);
  g.undo = { kw, timer: setTimeout(() => { if (GATE === g) { g.undo = null; } }, 8000) };
  drawEditor(panel);
}

function buildAddTerm(panel) {
  const g = GATE;
  const box = el(`<div class="kws-add"></div>`);
  const grow = el(`<div class="grow"><label for="kws-add-term">Add a term</label></div>`);
  const inp = el(`<input id="kws-add-term" placeholder="a capability, buyer phrase, product category, or mission term">`);
  grow.appendChild(inp);
  const catWrap = el(`<div style="flex:0 0 150px"><label for="kws-add-cat">Classification</label></div>`);
  const cat = el(`<select id="kws-add-cat">${KW_CATS.map(c => `<option value="${c}">${c}</option>`).join('')}</select>`);
  catWrap.appendChild(cat);
  const add = el(`<button class="btn sm">Add to search</button>`);
  const warn = el(`<div class="warn" role="alert" style="display:none"></div>`);
  const submit = () => {
    const term = inp.value.trim();
    warn.style.display = 'none';
    if (!term) return;
    const exact = g.keywords.find(k => normTerm(k.term) === normTerm(term));
    if (exact) { warn.textContent = `“${term}” is already in the search.`; warn.style.display = 'block'; return; }
    const close = g.keywords.find(k => normTerm(k.term).includes(normTerm(term)) || normTerm(term).includes(normTerm(k.term)));
    const keptDup = g.kept_out.find(k => normTerm(k.term) === normTerm(term));
    if (close && !confirm(`“${term}” looks close to the existing term “${close.term}”. Add it anyway?`)) return;
    if (keptDup) { g.kept_out.splice(g.kept_out.indexOf(keptDup), 1); }
    g.keywords.push({ term, category: cat.value, rationale: 'consultant added at review',
      origin: 'consultant', note: 'consultant added' });
    g.selected = { lane: 'in', index: g.keywords.length - 1 };
    inp.value = '';
    drawEditor(panel);
  };
  add.onclick = submit;
  inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
  box.append(grow, catWrap, add, warn);
  return box;
}

function buildInspector(panel) {
  const g = GATE;
  const box = el(`<aside class="kws-inspector" aria-live="polite"><h4>Term inspector</h4></aside>`);
  if (!g.selected || g.selected.lane !== 'in' || !g.keywords[g.selected.index]) {
    box.appendChild(el(`<div class="empty">Select a term to inspect its wording, classification, provenance, and evidence — then refine it in place.</div>`));
    return box;
  }
  const k = g.keywords[g.selected.index];
  const field = (lbl, node) => {
    const f = el(`<div class="field"><div class="lbl">${esc(lbl)}</div></div>`);
    f.appendChild(node); return f;
  };
  const termIn = el(`<input value="${esc(k.term)}" aria-label="term wording">`);
  termIn.oninput = () => {
    if (normTerm(termIn.value) !== normTerm(k.term)) {
      if (k.origin === 'system') { k.edited_from = k.term; k.origin = 'edited'; }
    }
    k.term = termIn.value;
  };
  termIn.onblur = () => drawEditor(panel);
  box.appendChild(field('Wording', termIn));
  const catIn = el(`<select aria-label="classification">${KW_CATS.map(c => `<option ${c === k.category ? 'selected' : ''}>${c}</option>`).join('')}</select>`);
  catIn.onchange = () => { k.category = catIn.value; drawEditor(panel); };
  box.appendChild(field('Classification', catIn));
  box.appendChild(field('Provenance', el(`<div class="val">${esc(KW_PROV_LABEL[k.origin] || 'System inferred')}</div>`)));
  if (k.edited_from) box.appendChild(field('Previous wording', el(`<div class="val">${esc(k.edited_from)}</div>`)));
  box.appendChild(field('Why LILA inferred it', el(`<div class="val">${esc(k.rationale || '—')}</div>`)));
  if (k.source) box.appendChild(field('Source', el(`<div class="val">${esc(k.source)}</div>`)));
  if (k.note) box.appendChild(field('Decision note', el(`<div class="val">${esc(k.note)}</div>`)));
  return box;
}

// ── NAICS BOUNDARY WORKSHOP ────────────────────────────────────────────────

const NAICS_PROV_LABEL = { system: 'System inferred', consultant: 'Consultant added',

const NAICS_RE = /^\d{6}$/;
function naicsFamily(code) { return (code || '').slice(0, 4); }   // NAICS national industry family
function naicsSector(code) { return (code || '').slice(0, 2); }   // 2-digit sector

// Official 6-digit NAICS titles (public reference data, not an invented
