<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LILA — Control Room</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<!-- dark Command Center client view (ui/client-view, 2026-07-24) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/client-view.css">
<script src="/static/client-view.js" defer></script>
<link rel="stylesheet" href="/static/command-center-home.css">
<script src="/static/command-center-home.js"></script>
<style>
  :root{
    --navy:#0e1b2e; --navy2:#16273d; --paper:#f6f4ef; --panel:#fdfcfa;
    --ink:#131c28; --ink2:#4c5a68; --muted:#67727e;
    --rule:#d8d3c8; --rule-dk:#b9b2a3;
    --blue:#2E9FD8; --blue-dk:#1c6ea3;
    --ok:#1d6f4c; --bad:#a83232; --warn:#946a12; --wait:#9aa2ab;
    --mono:Arial,Helvetica,sans-serif;      /* tracked-caps label face */
    --sans:Arial,Helvetica,sans-serif;
    --serif:'Times New Roman',Times,serif;   /* display face */
    --term:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);
       font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* ── navy L-frame: top bar + left rail ── */
  .top{position:sticky;top:0;z-index:20;background:var(--navy);color:#e8eef5;
       display:flex;align-items:center;gap:14px;padding:0 20px;height:52px;
       border-bottom:3px solid var(--blue)}
  .top .logo{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.28em;
             text-transform:uppercase;display:flex;align-items:center;gap:10px}
  .top .logo span{color:var(--blue)}
  .gtm-mark{height:34px;width:auto;object-fit:contain;background:#fff;border-radius:3px;
            padding:3px 7px;display:block}
  .top .logo .product-title{font-weight:600;letter-spacing:.24em}
  .top .spacer{flex:1}
  .wrap{display:flex;margin:0;padding:0;max-width:none;gap:0}
  .side{width:264px;flex:0 0 264px;background:var(--navy);min-height:calc(100vh - 52px);
        padding:20px 0 20px}
  .maincol{flex:1;min-width:0;padding:26px 34px;max-width:1080px}
  .maincol h3{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
              color:var(--muted);margin:4px 0 8px;font-weight:600}

  /* buttons: square, decisive */
  .btn{border:none;border-radius:0;padding:9px 16px;font-size:12.5px;font-weight:600;
       cursor:pointer;font-family:var(--mono);letter-spacing:.06em;background:var(--navy);
       color:#fff;text-transform:uppercase}
  .btn:hover{background:var(--blue-dk)}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule-dk)}
  .btn.ghost:hover{border-color:var(--navy);background:transparent;color:var(--navy)}
  .btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)}
  .btn.sm{padding:6px 11px;font-size:11px}

  /* sidebar client ledger */
  .side h3{color:#8fa6c2;padding:0 20px;margin:0 0 10px;font-family:var(--mono);font-size:10px;
           letter-spacing:.3em;text-transform:uppercase;font-weight:600}
  .ccard{background:transparent;border:none;border-left:3px solid transparent;border-radius:0;
         padding:11px 17px;margin:0;cursor:pointer;color:#c7d2de}
  .ccard:hover{background:var(--navy2)}
  .crow-ctl{visibility:hidden;font-size:10.5px;color:#8fa6c2;cursor:pointer;padding:0 2px;line-height:1.4}
  .ccard:hover .crow-ctl{visibility:visible}
  .crow-ctl:hover{color:#f6f4ef}
  .crow-x{font-size:13px}
  .crow-x:hover{color:#d24040}
  .ccard.sel{background:var(--navy2);border-left-color:var(--blue)}
  .ccard .nm{font-weight:600;font-size:13.5px;color:#f2f6fa}
  .ccard .need{font-size:10.5px;margin-top:5px;font-family:var(--mono);letter-spacing:.08em;
               text-transform:uppercase;display:inline-block;padding:2px 8px;
               background:rgba(46,159,216,.16);color:#7cc2e8;border-left:2px solid var(--blue)}
  .ccard .need.attn{background:rgba(46,159,216,.28);color:#a8d8f2}
  .progress{display:flex;gap:2px;margin-top:8px}
  .pseg{height:3px;flex:1;background:#2a3c53}
  .pseg.on{background:var(--blue)}
  .foot{font-size:11px;color:#57708c;padding:16px 20px;font-family:var(--mono)}
  .foot button{background:none;border:none;color:#57708c;cursor:pointer;font-size:11px;
               text-decoration:underline;font-family:var(--mono)}
  /* home + non-client views: the left rail is pure navy, no links or words.
     the utility nav (API switches / map / contacts) lives in client view. */
  .side.bare > *{display:none}

  /* attention ticker */
  .attn{background:#e7f1f9;border:1px solid #c3d9ea;border-left:4px solid var(--blue);
        border-radius:0;margin-bottom:22px}
  .attn .arow{display:flex;align-items:center;gap:12px;padding:11px 16px;
              border-bottom:1px solid #c3d9ea}
  .attn .arow:last-child{border-bottom:none}
  .attn .who{font-weight:700;min-width:130px}
  .attn .what{flex:1;color:var(--ink2);font-size:13px}
  /* the calendar grid: a real month, quiet and readable */
  .calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-top:10px}
  .calhead span{font-family:var(--mono),monospace;font-size:9px;letter-spacing:.16em;color:var(--muted);padding:4px 8px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule-dk);border:1px solid var(--rule-dk)}
  .calcell{background:var(--card,#fff);min-height:96px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .calcell.out{background:var(--panel);opacity:.55}
  .calcell.has{cursor:pointer}
  .calcell.has:hover{background:#f2f7fb}
  .calcell.sel{outline:2px solid var(--blue-dk);outline-offset:-2px}
  .calcell.today .calday{background:var(--navy);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
  .calday{font-family:var(--serif);font-size:13px;font-weight:700}
  .calchip{display:block;border-left:3px solid var(--blue-dk);padding:1px 5px;font-size:10.5px;line-height:1.3;background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .calchip b{font-family:var(--mono),monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:3px}
  .calmore{font-family:var(--mono),monospace;font-size:9px;color:var(--blue-dk)}
  /* home ticker tape: one quiet marquee of what the pipeline knows */
  .tape{overflow:hidden;border:1px solid var(--rule-dk);background:var(--navy);margin:0 0 14px;padding:7px 0}
  .tape-track{display:inline-flex;align-items:center;gap:18px;white-space:nowrap;animation:tape-scroll 55s linear infinite;will-change:transform;padding-left:10px}
  .tape:hover .tape-track{animation-play-state:paused}
  .tape-item{display:inline-flex;align-items:baseline;gap:8px;background:none;border:none;cursor:pointer;padding:0;color:#f6f4ef;font-size:12px}
  .tape-item:hover .tape-text{text-decoration:underline}
  .tape-client{font-family:var(--mono),monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#9db2c9}
  .tape-text{font-family:var(--sans)}
  .tape-dot{color:#546a85;margin:0 4px}
  .tape-gap{display:inline-block;width:60px}
  @keyframes tape-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  /* depository row controls (reorder + archive live here now, not the sidebar) */
  .dep-ctl{display:flex;gap:4px;align-items:center;opacity:0;transition:opacity .12s}
  .arow:hover .dep-ctl{opacity:1}
  .dep-ctl button{background:none;border:none;cursor:pointer;color:var(--muted);
                  font-size:12px;line-height:1;padding:3px 4px;font-family:var(--mono)}
  .dep-ctl button:hover{color:var(--navy)}
  .dep-ctl .x{font-size:14px}
  .dep-ctl .x:hover{color:var(--bad)}
  /* prominent back control on a client page */
  .btn.back{background:var(--navy);color:#fff;border:none}
  .btn.back:hover{background:var(--blue-dk)}

  /* status: square markers, mono, no pills */
  .chip{display:inline-block;padding:2px 8px;border-radius:0;font-size:10px;font-weight:600;
        font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;
        border:1px solid currentColor;background:transparent}
  .c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)}
  .c-wait{color:var(--wait)} .c-ready{color:var(--blue-dk)}

  .chead{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;
         border-bottom:2px solid var(--navy);padding-bottom:12px}
  .chead h1{font-size:34px;margin:0;font-weight:700;font-family:var(--serif);letter-spacing:0}

  /* A scope is an operating workstation, not a filter.  This dominant rail
     sits above every progress/artifact surface and switches the whole page. */
  .scope-switcher-shell{background:var(--navy);color:#f2f6fa;border-bottom:3px solid var(--blue);
                        padding:11px 13px 12px;margin:-4px 0 16px;min-width:0}
  .scope-switcher-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;
                        text-transform:uppercase;color:#9db2c9;margin-bottom:7px}
  .scope-switcher{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
  .scope-segment{display:flex;align-items:baseline;gap:7px;min-width:0;max-width:100%;
                 padding:8px 11px;border:1px solid #52677e;color:#cbd8e5;text-decoration:none;
                 background:var(--navy2);font-family:var(--mono);font-size:11px;
                 letter-spacing:.04em;line-height:1.2}
  .scope-segment:hover{border-color:#9db2c9;color:#fff}
  .scope-segment[aria-current="page"]{background:#f6f4ef;color:var(--navy);
                                      border-color:#f6f4ef;box-shadow:inset 0 -3px 0 var(--blue)}
  .scope-segment .ws-name{font-weight:700;overflow-wrap:anywhere}
  .scope-segment .ws-phase{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;
                           opacity:.78;white-space:nowrap}
  /* Client identity/intake are shared inputs, not scope deliverables. Keep
     them in one restrained strip between the workstation rail and whichever
     scope surface follows; they never enter the document shelf below. */
  .client-foundation{display:grid;grid-template-columns:minmax(190px,auto) minmax(0,1fr);
                     align-items:start;gap:8px 16px;min-width:0;margin:-4px 0 16px;
                     padding:9px 12px;background:#eef3f7;border:1px solid #cad6df;
                     border-left:3px solid var(--blue)}
  .client-foundation-title{font-family:var(--mono);font-size:9.5px;line-height:1.45;
                           letter-spacing:.08em;color:var(--navy);
                           font-weight:700;overflow-wrap:anywhere}
  .client-foundation-links{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px 14px;
                           min-width:0}
  .client-foundation-link{display:inline-flex;align-items:baseline;gap:5px;min-width:0;
                          max-width:100%;text-align:left;white-space:normal;overflow-wrap:anywhere}
  .client-foundation-link .foundation-fmt{font-size:8.5px;letter-spacing:.1em;
                                          text-transform:uppercase;color:var(--muted);
                                          white-space:nowrap}
  .client-foundation-viewer{display:none;grid-column:1/-1;max-height:230px;overflow:auto;
                            min-width:0;padding:9px 11px;background:var(--panel);
                            border:1px solid var(--rule);font-size:12px}
  .client-foundation-viewer.show{display:block}
  .client-foundation-viewer pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
  /* the sole creation door, beside the segments (Tranche 3) */
  .scope-new{align-self:center;background:transparent;color:#cfe0f2;cursor:pointer;
             border:1px dashed #4f6b8a;border-radius:2px;padding:7px 12px;font-family:var(--mono);
             font-size:11px;letter-spacing:.06em;font-weight:700;white-space:nowrap}
  .scope-new:hover{border-color:var(--blue);color:#fff;background:rgba(46,159,216,.14)}
  .scope-new:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  /* quick-scope toggles: common agencies as one-click shortcuts into creation */
  .scope-quick{align-self:center;background:rgba(255,255,255,.04);color:#a9c2dd;cursor:pointer;
               border:1px dashed #41597a;border-radius:2px;padding:7px 10px;font-family:var(--mono);
               font-size:11px;letter-spacing:.06em;font-weight:700;white-space:nowrap}
  .scope-quick:hover{border-color:var(--blue);border-style:solid;color:#fff;background:rgba(46,159,216,.16)}
  .scope-quick:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  /* + New scope dialog */
  .modal.newscope h2{margin:0 0 4px}
  .modal.newscope .sub{color:var(--ink2);font-size:13px;margin:0 0 14px}
  .modal.newscope fieldset.ns-scope{border:1px solid var(--rule);padding:10px 12px;margin:0 0 12px}
  .modal.newscope legend{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
                         text-transform:uppercase;color:var(--muted);padding:0 4px}
  .modal.newscope .ns-radio{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0;cursor:pointer}
  .modal.newscope .ns-radio input{
    width:auto;padding:0;flex:0 0 auto}
  .modal.newscope .ns-agencies{margin:0 0 12px}
  .modal.newscope .ns-agencies label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
  .modal.newscope .ns-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .modal.newscope .ns-disclose{font-size:12.5px;color:var(--ink2);background:#f2f6fa;
                               border-left:3px solid var(--blue);padding:9px 12px;margin:0 0 12px;line-height:1.45}
  .modal.newscope .ns-msg{min-height:18px;font-size:12.5px;color:var(--bad);margin-bottom:8px}
  .modal.newscope .ns-msg:empty{margin-bottom:0}
  .modal.onboarding{max-height:86vh;overflow-y:auto}
  .modal.onboarding fieldset{border:1px solid var(--rule);padding:10px 12px;margin:0 0 12px}
  .modal.onboarding .ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modal.onboarding label.ob-l{display:block;font-size:12px;color:var(--ink2);margin:6px 0 3px}
  .modal.onboarding input[type=text],.modal.onboarding input[type=number],.modal.onboarding input[type=date],.modal.onboarding textarea,.modal.onboarding select{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--rule)}
  .modal.onboarding textarea{min-height:44px;resize:vertical}
  .modal.onboarding .ob-row{display:grid;grid-template-columns:1fr 130px 1fr 26px;gap:6px;margin-bottom:5px;align-items:center}
  .modal.onboarding .ob-row.kill{grid-template-columns:1fr 110px 1fr 26px}
  .modal.onboarding .ob-row button{border:none;background:none;color:var(--bad);cursor:pointer;font-size:15px}
  .modal.onboarding .ob-add{font-size:12px;margin-top:2px}
  .modal.onboarding .ob-fileerr{color:var(--bad);font-size:12px;white-space:pre-wrap;margin-top:4px}
  .modal.onboarding .ob-ready{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:3px 8px;border:1px solid var(--rule)}
  .modal.onboarding .ob-ready.ok{color:#0a6c2e;border-color:#0a6c2e}
  .modal.onboarding .ob-ready.no{color:var(--bad);border-color:var(--bad)}
  .modal.newscope .ns-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
  @media (max-width:420px){
    .modal.newscope{padding:16px 14px}
    .modal.newscope .ns-actions{justify-content:stretch}
    .modal.newscope .ns-actions .btn{flex:1 1 auto}
  }
  @media (max-width:560px){
    .client-foundation{grid-template-columns:minmax(0,1fr);gap:6px}
    .client-foundation-link{flex:1 1 100%}
    .client-foundation-viewer{grid-column:1}
  }
  .workstation-dormant{border:1px solid var(--rule-dk);background:var(--panel);
                       padding:26px 28px;min-width:0}
  .workstation-dormant .ws-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.22em;
                                  text-transform:uppercase;color:var(--blue-dk)}
  .workstation-dormant h2{font-family:var(--serif);font-size:26px;margin:8px 0 7px}
  .workstation-dormant p{max-width:680px;color:var(--ink2);margin:0 0 13px}
  .workstation-dormant p,.workstation-dormant li{overflow-wrap:anywhere}
  .workstation-early-steps{margin-top:14px}
  .ws-ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;
             margin-top:22px}
  .ws-ladder span{border-top:3px solid var(--rule);padding-top:6px;font-family:var(--mono);
                  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
                  overflow-wrap:anywhere}
  .ws-ladder span.on{border-color:var(--blue);color:var(--blue-dk);font-weight:700}

  /* pipeline as a ruled ledger */
  .steps{position:relative;background:var(--panel);border:1px solid var(--rule)}
  .step{position:relative;background:transparent;border:none;border-bottom:1px solid var(--rule);
        border-radius:0;padding:16px 20px 16px 66px;margin:0}
  .step:last-child{border-bottom:none}
  .step.ready{background:#f4f9fd;box-shadow:inset 3px 0 0 var(--blue)}
  .step .num{position:absolute;left:20px;top:18px;width:30px;height:26px;border-radius:0;
             display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;
             font-family:var(--mono);background:transparent;color:var(--muted);
             border:1px solid var(--rule-dk)}
  .step.done .num{color:var(--ok);border-color:var(--ok)}
  .step.ready .num{background:var(--navy);color:#fff;border-color:var(--navy)}
  .step.blocked .num{color:var(--bad);border-color:var(--bad)}
  .step .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .step .hd h2{font-size:16px;margin:0;font-weight:700;font-family:var(--serif)}
  .step .sum{color:var(--ink2);margin:4px 0 0;font-size:13px}
  .step .acts{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .step .arts{margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
  .alink{font-size:12px;color:var(--blue-dk);background:transparent;border:none;
         border-bottom:1px solid var(--blue-dk);border-radius:0;padding:1px 0;cursor:pointer;
         font-weight:600;font-family:var(--mono);letter-spacing:.02em}
  .alink:hover{color:var(--navy);border-color:var(--navy)}

  /* opportunity review */
  .oppbanner{display:flex;align-items:baseline;gap:14px;margin-top:12px;padding:12px 16px;
             background:#e9f4ea;border:1px solid #bcd9c0;border-left:4px solid var(--ok)}
  .oppbanner .n{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--ok);line-height:1}
  .oppbanner .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
                  text-transform:uppercase;color:var(--ok);font-weight:600}
  .opptable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;background:#fff;
            border:1px solid var(--rule)}
  .opptable th{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
               color:var(--muted);text-align:left;padding:7px 10px;border-bottom:2px solid var(--rule-dk);
               font-weight:600}
  .opptable td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink2)}
  .opptable td.t{color:var(--ink);font-weight:600}
  .opptable td.d{font-family:var(--mono);font-size:11px;white-space:nowrap;color:var(--blue-dk)}
  .opptable tr:hover{background:#f3f8fc}

  /* stage band */
  .stage-hd{font-family:var(--mono);font-size:11px;letter-spacing:.3em;font-weight:600;
            color:var(--navy);margin:30px 0 8px;display:flex;align-items:center;gap:12px}
  .stage-hd::after{content:'';flex:1;height:1px;background:var(--rule-dk)}
  .stage-hd:first-of-type{margin-top:4px}

  /* docs shelf: little clickable document previews */
  .docgrid{display:flex;flex-wrap:wrap;gap:14px}
  .docard{background:var(--panel);padding:0;cursor:pointer;border:1px solid var(--rule);
          /* fixed size in the wrap-grid: keep 158px and WRAP to a new row when
             the column is narrow, never flex-shrink toward an unclickable
             sliver (client views lose ~536px to the sidebar + rail) */
          flex:0 0 158px;width:158px;border-top:2px solid var(--navy);overflow:hidden}
  .docard:hover{box-shadow:0 3px 12px rgba(16,34,56,.18);border-color:var(--navy)}
  .docard .page{position:relative;height:190px;background:#fff;border-bottom:1px solid var(--rule);overflow:hidden}
  .docard .page iframe{width:640px;height:800px;transform:scale(.245);transform-origin:0 0;
                       border:0;pointer-events:none;background:#fff}
  .docard .fauxdoc{padding:16px 14px}
  .docard .fauxdoc .fl{height:5px;background:var(--rule);margin-bottom:7px}
  .docard .fauxdoc .fl.hd{height:9px;width:65%;background:var(--rule-dk)}
  .docard .fmt-badge{position:absolute;right:6px;bottom:6px;font-family:var(--mono);font-size:10px;
                     letter-spacing:.14em;background:var(--navy);color:#f6f4ef;padding:2px 6px}
  .docard .meta{padding:9px 12px 11px}
  .docard .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
                   color:var(--muted);text-transform:uppercase}
  .docard .ttl{font-weight:700;font-size:13px;margin:3px 0 1px;font-family:var(--serif);line-height:1.25}
  .docard .dt{font-size:10.5px;color:var(--ink2);font-family:var(--mono);margin-bottom:4px}
  /* laptop widths: the working column keeps priority; the Target rail is
     parked doctrine anyway and yields first (UX pass 2026-07-12) */
  @media (max-width:1280px){ .orail{display:none} }
  @media (max-width:1100px){ .side{width:220px;flex:0 0 220px} .maincol{padding:22px 22px} }
  @media (max-width:920px){
    .wrap{flex-direction:column}
    .side{width:100%;flex:none;min-height:0;padding:10px 0 14px}
    .maincol{padding:16px 14px;max-width:none}
  }
  /* The server-rendered scoreboard banner has a wide min-content width; keep
     it inside a horizontal scroll container so it can never push the document
     width at phone sizes (2026-07-13). Desktop is unaffected. */
  #bannerSlot{max-width:100%;overflow-x:auto}
  /* Narrow identity treatment (2026-07-12): the enlarged top bar and the
     client header both re-flow instead of overflowing at phone widths. */
  @media (max-width:720px){
    .top{flex-wrap:wrap;height:auto;min-height:52px;padding:8px 14px;gap:8px 12px}
    .top .logo{font-size:11px;letter-spacing:.16em;gap:8px}
    .top .logo .product-title{letter-spacing:.12em}
    .gtm-mark{height:28px}
    .chead{flex-wrap:wrap;align-items:center;row-gap:8px}
    .chead h1{font-size:24px;flex-basis:100%;order:3}
    .chead .clogo-hdr{height:40px;max-width:150px}
    .scope-switcher-shell{margin-top:-2px;padding:10px}
    .scope-switcher{display:grid;grid-template-columns:1fr}
    .scope-segment{width:100%;justify-content:space-between}
    .scope-new,.scope-quick{width:100%;text-align:center}
    .workstation-dormant{padding:20px 18px}
    .ws-ladder{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:12px}
    .step{padding-left:52px;padding-right:12px}
    .step .num{left:12px}
    .change-digest-headcopy,.req-headcopy{min-width:0!important}
  }
  /* keyboard operators get the same affordances as mouse operators */
  :focus-visible{outline:2px solid var(--blue-dk);outline-offset:2px}
  .docard:focus-within .doc-ctls{display:inline-flex}
  .doc-ctls{position:absolute;top:5px;right:5px;display:none;gap:2px;background:rgba(246,244,239,.92);
            border:1px solid var(--rule-dk);padding:2px 4px;z-index:2}
  .docard:hover .doc-ctls{display:inline-flex}
  .doc-ctl{font-size:11px;color:var(--muted);cursor:pointer;padding:0 3px;line-height:1.5}
  .doc-ctl:hover{color:var(--navy)}
  .doc-ctl.x:hover{color:#8e1c1c}
  /* Aspect-ratio-aware logo slots (2026-07-12): fixed height, width auto up to
     a max, so a wide wordmark renders wide and a square/monogram renders
     square in the same slot. No remote fetch in these paths. */
  .clogo{height:16px;width:auto;max-width:74px;object-fit:contain;background:#fff;padding:1px;flex:0 0 auto}
  .clogo-row{height:30px;width:auto;max-width:132px;object-fit:contain;background:#fff;border:1px solid var(--rule);padding:2px 5px;flex:0 0 auto}
  .clogo-hdr{height:48px;width:auto;min-width:48px;max-width:210px;object-fit:contain;background:#fff;border:1px solid var(--rule);border-radius:4px;padding:5px 10px;flex:0 0 auto}

  /* FINAL PRODUCT: the red button and the conclusion preview */
  .fedcal{border:1px solid var(--rule-dk);background:var(--card,#fff);margin:0 0 18px;padding:18px 20px 8px}
  .fedcal-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  .fedcal-title{font-family:var(--serif);font-size:16.5px;font-weight:700}
  .fedcal-sub{font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:.02em}
  .fedcal-month{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
  .fedcal-row{display:flex;align-items:center;gap:14px;padding:9px 6px;border-top:1px solid rgba(20,40,60,.08);cursor:pointer;text-decoration:none;color:inherit}
  .fedcal-row:hover{background:var(--panel)}
  .fedcal-row:first-of-type{border-top:none}
  .fedcal-date{display:flex;flex-direction:column;align-items:center;min-width:44px;padding:2px 0;border-left:3px solid transparent}
  .fedcal-row[data-near="1"] .fedcal-date{border-left-color:var(--blue-dk)}
  /* EVENTS_LANE: events and their registration deadlines read distinctly
     from award clocks. Amber marks a registration deadline; a closed one is
     flagged (struck label, dimmed), never hidden. */
  .fedcal-row[data-kind="event"] .fedcal-date{border-left-color:#1b3557}
  .fedcal-row[data-kind="registration_deadline"] .fedcal-date{border-left-color:#c8811a}
  .fedcal-row[data-kind="registration_deadline"] .fedcal-body .s{color:#a8690d}
  .fedcal-row[data-closed="1"]{opacity:.62}
  .fedcal-row[data-closed="1"] .fedcal-body .s{text-decoration:line-through}
  .fedcal-ribbon{display:flex;gap:3px;margin:10px 0 4px;overflow-x:auto}
  .fedcal-mcell{flex:1 0 40px;background:var(--panel);border:1px solid rgba(20,40,60,.10);
    border-radius:3px;padding:5px 3px;cursor:pointer;text-align:center;font:inherit;line-height:1.15}
  .fedcal-mcell:hover{background:rgba(20,40,60,.07)}
  .fedcal-mcell.is-empty{opacity:.45}
  .fedcal-mcell .mm{display:block;font-family:var(--mono);font-size:8.5px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .fedcal-mcell .nn{display:block;font-size:13px;font-weight:800;min-height:16px}
  .fedcal-date .d{font-family:var(--serif);font-size:21px;font-weight:800;line-height:1.05}
  .fedcal-date .m{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted)}
  .fedcal-body{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .fedcal-body .t{font-family:var(--sans);font-size:13px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fedcal-body .s{font-family:var(--sans);font-size:11px;color:var(--muted)}
  .fedcal-src{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-dk);opacity:0;transition:opacity .12s}
  .fedcal-row:hover .fedcal-src{opacity:1}
  .finale{margin-top:34px;border-top:3px solid var(--navy);padding-top:14px}
  .finale .stage-hd{color:var(--navy);letter-spacing:.04em;text-transform:none;font-size:15px}
  .finale .stage-hd::after{background:var(--navy);opacity:.25}
  .btn-final{display:block;width:100%;max-width:560px;background:#8e1c1c;color:#f6f4ef;border:none;
             padding:17px 22px;font-family:var(--sans);font-weight:700;letter-spacing:.22em;
             font-size:13px;text-transform:uppercase;cursor:pointer;border-radius:0}
  .btn-final:hover{background:#a32222}
  .btn-final:disabled{opacity:.4;cursor:default}
  @keyframes finalOsc{0%,100%{background:#8e1c1c}50%{background:#430d0d}}
  .btn-final.working{animation:finalOsc 1.5s ease-in-out infinite;cursor:progress}
  .finale-note{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
               color:var(--muted);margin:8px 0 0}
  .finale-preview{margin-top:18px;border:1px solid var(--rule-dk)}
  .finale-preview .cap{display:flex;align-items:baseline;gap:12px;background:var(--navy);
                       color:#f6f4ef;padding:10px 16px}
  .finale-preview .cap .t{font-family:var(--serif);font-size:15px;font-weight:700}
  .finale-preview .cap .s{font-family:var(--sans);font-size:10px;letter-spacing:.18em;
                          text-transform:uppercase;color:#9db2c9}
  .finale-preview iframe{width:100%;height:560px;border:0;background:#fff;display:block}

  .console{background:#0a1420;color:#9fc0dd;border-radius:0;padding:11px 14px;margin-top:11px;
           font-family:var(--term);font-size:12px;max-height:260px;overflow-y:auto;
           white-space:pre-wrap;display:none;border-left:3px solid var(--blue)}
  .console.show{display:block}
  /* live search board: per-source status pills over the raw console */
  .sb-grid{display:flex;flex-wrap:wrap;gap:6px}
  .sb-triage{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .sb-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--term);font-size:11px;
           padding:4px 9px;border:1px solid var(--rule-dk);background:var(--panel);color:var(--muted)}
  .sb-pill i{font-style:normal;opacity:.65}
  .sb-dot{width:7px;height:7px;border-radius:50%;background:#5b87ae;animation:sbpulse 1.1s ease-in-out infinite}
  .sb-done{color:#54d67b;border-color:#2c5b3f}
  .sb-done .sb-dot{background:#54d67b;animation:none}
  .sb-fail{color:#e06060;border-color:#6b2f2f}
  .sb-fail .sb-dot{background:#e06060;animation:none}
  @keyframes sbpulse{0%,100%{opacity:.25}50%{opacity:1}}
  .viewer{border:1px solid var(--rule);border-radius:0;padding:20px 24px;background:var(--panel);
          margin-top:11px;overflow-x:auto;display:none}
  .viewer.show{display:block}
  .viewer h1,.viewer h2{border-bottom:1px solid var(--rule);padding-bottom:5px}
  .viewer pre{background:#f1efe8;padding:11px;border-radius:0;overflow-x:auto;font-size:12px}
  .viewer table{border-collapse:collapse} .viewer td,.viewer th{border:1px solid var(--rule);padding:5px 9px}

  /* strategy editor at the approval gate — revise before you approve */
  .gate-edit{border:1px solid var(--rule-dk);background:#faf8f3;padding:16px 18px;margin-top:12px}
  .gate-hint{font-size:12px;color:var(--ink2);line-height:1.55;margin-bottom:14px;
             border-left:3px solid var(--blue);padding-left:10px}
  .gate-field{margin:0 0 16px}
  .gate-field>label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
             text-transform:uppercase;color:var(--muted);margin:0 0 7px;font-weight:600}
  .gate-sub{font-family:var(--sans);font-size:11px;letter-spacing:0;text-transform:none;color:#a99}
  .gate-ta{resize:vertical;line-height:1.5}
  .kw-row{display:flex;gap:8px;margin:0 0 6px;align-items:center}
  .kw-row .kw-term{flex:1}
  .kw-row .kw-cat{flex:0 0 130px}
  .kw-x{flex:0 0 auto;width:30px;background:none;border:1px solid var(--rule-dk);color:var(--muted);
        cursor:pointer;font-size:16px;line-height:1;padding:6px 0}
  .kw-x:hover{color:var(--bad);border-color:var(--bad)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
  .ed-chip{display:inline-flex;align-items:center;gap:5px;background:#eef2f6;border:1px solid var(--rule-dk);
           padding:3px 4px 3px 9px;font-size:12.5px;font-family:var(--mono)}
  .ed-chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;
           line-height:1;padding:0 3px}
  .ed-chip button:hover{color:var(--bad)}
  .chip-add{max-width:220px}
  .gate-savebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px;border-top:1px solid var(--rule);
                padding-top:12px}
  .gate-msg{font-family:var(--mono);font-size:11px;color:var(--ink2)}

  /* ── Keyword Strategy Workshop (2026-07-12) ── */
  .kws{margin-top:4px}
  .kws-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .kws-stat{display:flex;flex-direction:column;gap:1px;border:1px solid var(--rule-dk);
            background:#fff;padding:8px 14px;min-width:110px}
  .kws-stat .n{font-size:22px;font-weight:800;line-height:1;color:var(--navy);font-family:var(--sans)}
  .kws-stat.judge .n{color:var(--warn)}
  .kws-stat.out .n{color:var(--muted)}
  .kws-stat .k{font-size:11px;color:var(--ink2);margin-top:4px}
  .kws-add{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;
           background:#fff;border:1px solid var(--rule-dk);padding:12px 14px;margin-bottom:16px}
  .kws-add .grow{flex:1 1 260px}
  .kws-add label{margin:0 0 4px}
  .kws-add .warn{flex-basis:100%;font-size:12px;color:var(--warn);margin-top:2px}
  .kws-grid{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
  .kws-grid>*{min-width:0}
  .kws-band{margin-bottom:16px}
  .kws-band>h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
               color:var(--ink2);margin:0 0 8px;font-weight:700;display:flex;gap:8px;align-items:baseline}
  .kws-band>h4 .c{color:var(--muted);font-weight:600}
  .kws-lane{display:flex;flex-wrap:wrap;gap:7px}
  .kw-chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--rule-dk);
           border-left:3px solid var(--ok);padding:6px 6px 6px 11px;font-size:13.5px;cursor:pointer;
           max-width:100%;min-width:0;overflow-wrap:anywhere;flex-wrap:wrap}
  .kw-chip.sel{border-color:var(--navy);box-shadow:0 0 0 2px rgba(14,27,46,.12)}
  .kw-chip .cat{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--muted);
                text-transform:uppercase}
  .kw-chip .prov{font-size:14px;line-height:1}
  .kw-chip .rm{width:24px;height:24px;background:none;border:1px solid var(--rule-dk);color:var(--muted);
               cursor:pointer;font-size:15px;line-height:1;padding:0;border-radius:0}
  .kw-chip .rm:hover,.kw-chip .rm:focus{color:var(--bad);border-color:var(--bad);outline:none}
  .kw-chip .rm:focus-visible{box-shadow:0 0 0 2px rgba(168,50,50,.35)}
  .kw-judge{border:1px solid #e4c37a;border-left:3px solid var(--warn);background:#fdf8ee;
            padding:11px 13px;margin-bottom:9px}
  .kw-judge .t{font-size:14px;font-weight:700;color:var(--ink)}
  .kw-judge .why{font-size:12px;color:var(--ink2);margin:5px 0 9px;line-height:1.5}
  .kw-judge .risk{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
                  text-transform:uppercase;color:var(--warn);border:1px solid #e4c37a;padding:1px 6px;
                  margin-bottom:8px}
  .kw-judge .acts{display:flex;gap:7px;flex-wrap:wrap}
  .kws-inspector{border:1px solid var(--rule-dk);background:#fff;padding:14px 15px;position:sticky;top:64px}
  .kws-inspector h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
                    color:var(--ink2);margin:0 0 10px;font-weight:700}
  .kws-inspector .field{margin-bottom:11px}
  .kws-inspector .field .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
                             margin-bottom:3px;font-family:var(--mono)}
  .kws-inspector .field .val{font-size:13px;color:var(--ink);line-height:1.45}
  .kws-inspector .empty{font-size:12.5px;color:var(--muted);line-height:1.5}
  .kws-out{margin-top:6px}
  .kws-out summary{cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
                   text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 0}
  .kws-out .kw-chip{border-left-color:var(--muted);opacity:.85}
  .kws-undo{display:inline-flex;align-items:center;gap:8px;background:#eef3f8;border:1px solid var(--rule-dk);
            padding:7px 11px;font-size:12.5px;margin:8px 0}
  @media (max-width:900px){ .kws-grid{grid-template-columns:1fr} .kws-inspector{position:static} }
  /* NAICS Boundary Workshop: each six-digit code is a deliberate card, not a
     generic chip (2026-07-12). */
  .naics-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px}
  .naics-card{border:1px solid var(--rule-dk);background:#fff;border-left:3px solid var(--navy);
              padding:9px 11px;min-width:0}
  .naics-card.sel{border-left-color:var(--blue);box-shadow:0 0 0 2px rgba(46,159,216,.22)}
  .naics-card.kept{border-left-color:var(--muted);opacity:.9}
  .nc-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .nc-code{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.02em}
  .nc-role{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;padding:1px 5px;font-weight:700}
  .nc-role.core{background:var(--navy);color:#fff}
  .nc-role.boundary{background:#e7eef5;color:var(--navy)}
  .naics-card .prov{margin-left:auto;font-size:12px;color:var(--muted)}
  .nc-title{font-size:11.5px;color:var(--ink2);margin:4px 0 7px;line-height:1.35;word-break:break-word}
  .nc-expl{font-size:12px;color:var(--ink2);line-height:1.48;padding:8px 9px;margin:3px 0 8px;
           background:#f4f7fa;border-left:2px solid var(--blue-dk);overflow-wrap:anywhere}
  .nc-expl .lab,.nc-context .lab{display:block;font-family:var(--mono);font-size:8.5px;
           letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--blue-dk);margin-bottom:3px}
  .nc-expl.missing{background:#fff8ea;border-left-color:var(--warn);color:#6f531d}
  .nc-expl.missing .lab{color:var(--warn)}
  .nc-expl.review{background:#fdf8ee;border-left-color:var(--warn)}
  .nc-expl.review .lab{color:var(--warn)}
  .nc-context{font-size:11px;color:var(--muted);line-height:1.45;padding:6px 8px;margin:-3px 0 8px;
              border:1px solid #e4c37a;background:#fdf8ee;overflow-wrap:anywhere}
  .nc-context .lab{color:var(--warn)}
  .nc-acts{display:flex;gap:6px;flex-wrap:wrap}
  .nc-btn{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
          border:1px solid var(--rule-dk);background:#f6f8fb;color:var(--navy);cursor:pointer;padding:4px 8px}
  .nc-btn:hover{background:#eaf1f8}
  .nc-btn.rm{color:var(--bad);border-color:#e6cccc}
  .nc-btn.rm:hover{background:#faeeee}
  .nc-btn:focus-visible{outline:2px solid var(--blue-dk);outline-offset:1px}
  .naics-ws .warn.advisory{color:var(--warn);border-left:3px solid var(--warn);background:#fdf6e9;
              padding:7px 10px;font-size:12.5px}
  /* tablet keeps two tracks; phone drops to ONE column so the card header
     never overflows a narrow viewport (Cycle-5 review B3). The 560px rule
     wins at phone widths by cascade. */
  @media (max-width:720px){ .naics-cards{grid-template-columns:1fr 1fr} }
  @media (max-width:560px){ .naics-cards{grid-template-columns:1fr} }
  @media (max-width:560px){
    .finale-preview{overflow:hidden}
    .finale-preview .cap{flex-wrap:wrap;align-items:center}
    .finale-preview .cap .t,.finale-preview .cap .s{flex:1 1 100%}
    .change-digest-headcopy{min-width:0!important;flex-basis:100%!important}
  }

  input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--rule-dk);border-radius:0;
        font-size:13.5px;font-family:var(--sans);color:var(--ink);background:#fff}
  input:focus,textarea:focus{outline:none;border-color:var(--navy)}
  label{display:block;font-size:10.5px;font-weight:600;color:var(--ink2);margin:11px 0 4px;
        font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .inline{display:flex;gap:8px;align-items:center}
  .inline input{width:auto}
  .overlay{position:fixed;inset:0;background:rgba(10,18,28,.55);display:none;z-index:40;
           align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border-radius:0;border-top:4px solid var(--navy);
         max-width:640px;width:100%;padding:24px 28px}
  .modal h2{margin:0 0 4px;font-size:18px;font-family:var(--serif);font-weight:700}
  .sugwrap{position:relative}
  .suggest{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--rule-dk);
           border-radius:0;box-shadow:0 10px 26px rgba(14,27,46,.16);z-index:50;overflow:hidden;display:none}
  .suggest.show{display:block}
  .sitem{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:13px}
  .sitem:hover{background:#eef4f9}
  .sitem img{width:18px;height:18px;flex:0 0 18px}
  .sitem .dom{color:var(--muted);font-size:12px;margin-left:auto;font-family:var(--mono)}
  .didmean{font-size:12.5px;color:var(--warn);margin-top:5px;display:none}

python3 run_ui.py</pre>

    </div>`;

}

let CLIENTS = [], SEL = null, DETAIL = null, POLLS = {};

// presses and the intermediate results approvals are curtained; the
// orchestrator chain owns intake -> DRAFT_READY with one human gate at
// AWAITING_TAXONOMY_GO. Pairs with LILA_LEGACY_WORKSTATION server-side.
// Kept live: Analyst Layer gate controls, the review iterate loop,
// dossier/watchlist presses, refresh press + delta, change digest.
const SHOW_LEGACY_WORKSTATION = false;
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};

/* Markdown enters this privileged control room from client/model-authored
   strategy text. Parse it in an inert template, then retain only a compact
   document vocabulary. No raw HTML attribute survives, and links are useful
   only when they are explicit http(s) destinations. */
const SAFE_MD_TAGS = new Set([
  'P','BR','STRONG','EM','DEL','CODE','PRE','BLOCKQUOTE','UL','OL','LI',
  'H1','H2','H3','H4','H5','H6','HR','A','TABLE','THEAD','TBODY','TR','TH','TD',
]);
function safeHttpUrl(value) {
  try {
    const parsed = new URL(String(value || ''));
    return parsed.protocol === 'http:' || parsed.protocol === 'https:'
      ? parsed.href : null;
  } catch { return null; }
}
function safeMarkdownHtml(markdown) {
  const source = String(markdown ?? '');
  if (typeof marked === 'undefined' || !marked.parse) {
    return '<pre>' + esc(source) + '</pre>';
  }
  const template = document.createElement('template');
  template.innerHTML = marked.parse(source);
  const cleanChildren = parent => {
    [...parent.childNodes].forEach(node => {
      if (node.nodeType === Node.TEXT_NODE) return;
      if (node.nodeType !== Node.ELEMENT_NODE) { node.remove(); return; }
      if (!SAFE_MD_TAGS.has(node.tagName)) {
        node.replaceWith(document.createTextNode(node.textContent || ''));
        return;
      }
      const href = node.tagName === 'A' ? safeHttpUrl(node.getAttribute('href')) : null;
      [...node.attributes].forEach(attribute => node.removeAttribute(attribute.name));
      if (href) {
        node.setAttribute('href', href);
        node.setAttribute('target', '_blank');
        node.setAttribute('rel', 'noopener noreferrer');
      }
      cleanChildren(node);
    });
  };
  cleanChildren(template.content);
  return template.innerHTML;
}
const STATE_CHIP = { done:['c-ok','done'], ready:['c-ready','your move'], waiting:['c-wait','waiting'],
                     blocked:['c-bad','blocked'] };

/* ============ sidebar ============ */
async function loadClients(keepSel = true, options = {}) {
  CLIENTS = await api('/api/clients');
  // Background polling may refresh the data cache, but it must not repaint
  // the Command Center. Replacing #main resets scroll, focus, open details,
  // and the active Decide/Pursue/Verify context even when nothing changed.
  if (options.paint === false) return CLIENTS;
  // sidebar is context-scoped: full roster on home, ONLY the open client's
  // targets + artifacts inside a client view
  if (SEL && keepSel) renderClientSidebar();
  else renderAllClientsList();
  if ((!SEL || !keepSel) && !CT.active) renderHome();  // don't wipe the contacts view
  return CLIENTS;
}

function bareSidebar(bare) {
  const side = document.querySelector('.side');
  if (side) side.classList.toggle('bare', bare);
}

/* client logo, used wherever a client name is shown: the cached brand mark
   first (drop via the Desktop Brand Marks folder), the favicon guess as
   fallback, nothing if neither resolves — never a broken image. */
function clientLogoImg(slug, domain, cls) {
  const fb = domain
    ? `this.onerror=()=>this.remove();this.src='https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64'`
    : 'this.remove()';
  return `<img class="${cls}" src="/api/marks/client/${encodeURIComponent(slug)}" onerror="${fb}" alt="">`;
}

/* home + non-client views: the left rail is pure navy, nothing in it. The
   client roster is the middle depository (reorder + archive on those rows);
   the utility nav lives in the client sidebar only. */
function renderAllClientsList() {
  bareSidebar(true);
  $id('clientList').innerHTML = '';
}

/* client-scoped sidebar: only THIS client's pursuits and artifacts, plus the
   utility nav in the footer */
function renderClientSidebar() {
  const d = DETAIL;
  if (!d) return;
  bareSidebar(false);
  const list = $id('clientList');
  const sb = d.sidebar || { targets: [], artifacts: [] };
  const ws = d.workstation || null;
  const needLabel = ws
    ? `${ws.ref.label} · ${ws.phase === 'dormant' ? 'establish boundary' : ws.phase}`
    : ((d.attention && d.attention.label) || 'All caught up');
  const tgts = (sb.targets || []).map(t => `
    <div style="padding:7px 0;border-top:1px solid var(--rule)">
      <div style="display:flex;gap:6px;align-items:baseline">
        <span style="font-family:var(--mono),monospace;font-size:10px;font-weight:700;color:#fff;

          padding:1px 6px">${esc(t.grade)}</span>
        <span style="font-size:12px;font-weight:700;flex:1">#${t.rank} ${esc(t.title)}</span>
      </div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:2px">${esc(t.agency || '—')} · due ${esc(t.deadline || '—')}</div>
    </div>`).join('');
  const arts = groupDocsByLabel(sb.artifacts).map(g => `
    <button class="alink" style="display:block;font-size:11.5px;margin:4px 0;text-align:left"
      title="${g.newest.qa_pass ? 'QA passed' : 'DO NOT SEND'}${g.count > 1 ? esc(' · newest of ' + g.count + ' builds; older ones are superseded') : ''}"
      onclick="window.open('/report?path=${encodeURIComponent(g.newest.path)}','_blank')">
      ${g.newest.qa_pass ? '' : '⚠ '}${esc(g.newest.label)} <span style="color:var(--muted)">.${esc(g.newest.fmt)}${g.count > 1 ? ` ×${g.count}` : ''}</span></button>`).join('');
  list.innerHTML = `
    <div style="padding:0 20px 12px"><button class="btn back sm" style="width:100%" onclick="renderHome()">← All clients</button></div>
    <div class="ccard sel" style="cursor:default">
      <div class="nm" style="display:flex;align-items:center;gap:8px">${clientLogoImg(d.slug, d.logo_domain, 'clogo-row')}${esc(d.client_name)}</div>
      <div class="need">${esc(needLabel)}</div>
    </div>
    <h3 style="margin-top:14px">Pursuits</h3>
    ${tgts || `<div style="font-size:11.5px;color:var(--muted);padding:4px 0">${d.workstation_mode === 'legacy-current-held'
      ? 'withheld until the exact scope search is refreshed'
      : (d.workstation_mode === 'dormant'
        ? 'none; this workstation has no accepted boundary yet'
      : (d.workstation_mode === 'legacy-current-early'
          ? 'withheld until this workstation has a current search'
        : (d.workstation_mode === 'native-early'
          ? (ws && ws.phase === 'assess'
            ? 'current search complete; downstream review is not active for this workstation yet'
            : 'withheld until this workstation has a current search')
        : (d.assess_ready
          ? 'none pursue-grade in the current screen; the Review step carries every verdict'
          : 'none graded yet; run the assessment'))))}</div>`}
    <h3 style="margin-top:14px">Artifacts</h3>
    ${arts || '<div style="font-size:11.5px;color:var(--muted);padding:4px 0">no artifacts yet</div>'}`;
}

async function fillMiniDoc(card, doc) {
  try {
    const { content } = await api('/api/file?path=' + encodeURIComponent(doc.path));
    const txt = content.slice(0, 1400)
      .replace(/^#{1,3} /gm, '').replace(/[*_`>|]/g, '').replace(/\[(.*?)\]\(.*?\)/g, '$1');
    const box = card.querySelector('.fauxdoc');
    if (box) box.outerHTML = `<div style="padding:10px 9px;font-family:Georgia,serif;
      font-size:5.5px;line-height:1.7;color:var(--ink2);white-space:pre-wrap;
      overflow:hidden;height:170px;user-select:none">${esc(txt)}</div>`;

async function moveDoc(key, dir) {

let CAL_MONTH = null;
let CAL_ITEMS = null;

async function showCalendar() {
  if (window.LILACommandCenterHome) window.LILACommandCenterHome.deactivate();
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Loading the calendar…</div>';
  try { CAL_ITEMS = ((await api('/api/calendar')) || {}).items || []; }
  catch (e) { main.innerHTML = `<div class="empty">calendar unavailable: ${esc(e.message || e)}</div>`; return; }
  if (!CAL_ITEMS.length) {
    main.innerHTML = `<div class="empty">No dated commitments yet. Run a report (Analyst Layer &rarr; Run report) and every response deadline, vehicle milestone, and verified event lands here.</div>`;
    return;
  }
  if (!CAL_MONTH) {
    const today = new Date(); today.setDate(1); today.setHours(0,0,0,0);
    const soonest = CAL_ITEMS.map(i => i.date).sort()
      .find(d => new Date(d + 'T00:00:00') >= today);
    CAL_MONTH = soonest ? new Date(soonest.slice(0, 7) + '-01T00:00:00') : today;
  }
  renderCalendarMonth();
}

function renderCalendarMonth(selectedDate) {
  const MONTHS = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];
  const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const ORIGIN_TINT = { candidate_date: 'var(--blue-dk)',
    vehicle_signal_date: '#c45a10', vehicle_watch_record: '#c45a10',
    verified_event: '#1f7a3d' };
  const main = document.getElementById('main');
  const year = CAL_MONTH.getFullYear(), month = CAL_MONTH.getMonth();
  const byDay = {};
  for (const item of CAL_ITEMS) (byDay[item.date] ||= []).push(item);

  const first = new Date(year, month, 1);
  const gridStart = new Date(first);
  gridStart.setDate(1 - first.getDay());
  const todayIso = new Date().toISOString().slice(0, 10);

  let cells = '';
  for (let index = 0; index < 42; index++) {
    const day = new Date(gridStart);
    day.setDate(gridStart.getDate() + index);
    const iso = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;
    const inMonth = day.getMonth() === month;
    const items = byDay[iso] || [];
    const chips = items.slice(0, 3).map(item =>
      `<span class="calchip" style="border-left-color:${ORIGIN_TINT[item.origin] || 'var(--blue-dk)'}"
        title="${esc(item.client_name)} · ${esc(item.title)} · ${esc(item.label)} · ${esc(item.status.replace(/_/g, ' '))}">
        <b>${esc(item.client_name.split(' ')[0])}</b> ${esc(item.title)}</span>`).join('');
    const more = items.length > 3
      ? `<span class="calmore">+${items.length - 3} more</span>` : '';
    cells += `<div class="calcell${inMonth ? '' : ' out'}${iso === todayIso ? ' today' : ''}${items.length ? ' has' : ''}${selectedDate === iso ? ' sel' : ''}" data-date="${iso}">
      <span class="calday">${day.getDate()}</span>${chips}${more}</div>`;
  }

  const monthItems = CAL_ITEMS
    .filter(item => item.date.slice(0, 7) === `${year}-${String(month + 1).padStart(2, '0')}`);
  const detailItems = selectedDate
    ? CAL_ITEMS.filter(item => item.date === selectedDate) : monthItems;
  const detailRows = detailItems.map(item => {
    const href = (item.source_urls || [])[0] || '';
    const day = new Date(item.date + 'T00:00:00');
    return `<a class="fedcal-row" ${href ? `href="${esc(href)}" target="_blank" rel="noopener noreferrer"` : ''}>
      <span class="fedcal-date"><span class="d">${day.getDate()}</span>
        <span class="m">${esc(MONTHS[day.getMonth()].slice(0, 3).toUpperCase())}</span></span>
      <span class="fedcal-body">
        <span class="t">${esc(item.title)}</span>
        <span class="s"><b>${esc(item.client_name)}</b> · ${esc([item.agency, item.label, item.status.replace(/_/g, ' ')].filter(Boolean).join(' · '))}</span>
      </span>
      ${href ? '<span class="fedcal-src">source</span>' : ''}
    </a>`;
  }).join('') || '<div class="fedcal-month">Nothing dated in this view.</div>';

  main.innerHTML = `<div class="fedcal" style="margin-top:14px">
    <div class="fedcal-hd" style="align-items:center">
      <button class="btn sm ghost cal-nav" data-step="-1">&#8249;</button>
      <span class="fedcal-title" style="min-width:190px;text-align:center">${esc(MONTHS[month])} ${year}</span>
      <button class="btn sm ghost cal-nav" data-step="1">&#8250;</button>
      <button class="btn sm ghost cal-today">Today</button>
      <span style="flex:1"></span>
      <span class="fedcal-sub">every client · click a day for its commitments</span>
    </div>
    <div class="calhead">${DOW.map(d => `<span>${d}</span>`).join('')}</div>
    <div class="calgrid">${cells}</div>
    <div class="fedcal-month">${selectedDate
      ? esc(new Date(selectedDate + 'T00:00:00').toDateString())
      : esc(MONTHS[month] + ' ' + year)} · ${detailItems.length} commitment${detailItems.length === 1 ? '' : 's'}</div>
    ${detailRows}
  </div>`;
  main.querySelectorAll('.cal-nav').forEach(button => {
    button.onclick = () => {
      CAL_MONTH = new Date(year, month + Number(button.dataset.step), 1);
      renderCalendarMonth();
    };
  });
  main.querySelector('.cal-today').onclick = () => {
    CAL_MONTH = new Date(); CAL_MONTH.setDate(1);
    renderCalendarMonth(todayIso);
  };
  main.querySelectorAll('.calcell.has').forEach(cell => {
    cell.onclick = () => renderCalendarMonth(cell.dataset.date);
  });
}

/* One artifact FAMILY, one visual: builds of the same deliverable collapse
   behind their newest member (state and click target follow the newest;
   older QA passes read as superseded, never as sendable). */
function groupDocsByLabel(list) {
  const groups = new Map();
  for (const d of (list || [])) {
    const key = d.label || d.path || '?';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(d);
  }
  return Array.from(groups.values()).map(members => {
    members.sort((a, b) => (b.updated || 0) - (a.updated || 0));
    return { newest: members[0], members, count: members.length };
  });
}

let TAB = 'pipeline';

/* ── ONE canonical operator status (Phase B, 2026-07-12) ──────────────────
   Every dashboard surface derives the same "what happens next" from the same
   states the gates actually use: strategy gate, search stage, strict ledger,
   assess approval, release verdict, target door. Surfaces render this; they
   never re-derive their own version of "ready". */
function deriveStatus(d) {
  const sl = d.assess_ledger || {};
  const fb = d.final_brief || null;
  const sb = d.signal_board || null;
  const canRefreshSignal = !!(d.workstation && d.workstation.is_legacy_current
    && d.workstation.ref && d.workstation.ref.id === 'all');
  const stages = d.stages || {};
  const holds = [];
  if (sl.state === 'current' && sl.coverage_gaps) {
    holds.push(`${sl.coverage_gaps} required coverage gap${sl.coverage_gaps === 1 ? '' : 's'}`);
  }
  if (!d.review_approved) {
    (d.review_approval_problems || []).slice(0, 2).forEach(x => holds.push(x));
  }
  // The Signal Board resolver is the one client-release source. Legacy brief
  // state never lights or blocks the canonical client-ready status.
  if (sb && !sb.qa_pass && sb.reason && sb.reason !== 'release') {
    holds.push(sb.reason);
  }
  let next;
  if (d.status !== 'approved') {
    next = { label: 'Approve Analyst Layer', anchor: '.step[data-key="gate"]',
             hint: 'nothing spends until the Analyst Layer is locked' };
  } else if (!stages.searched) {
    next = { label: 'Run opportunity search', anchor: '.step[data-key="search"]',
             hint: 'locked keywords + your scope' };
  } else if (sl.state === 'stale') {
    next = { label: 'Refresh the search', anchor: '.step[data-key="search"]',
             hint: 'strict lane held closed: stored ledger no longer matches current inputs' };
  } else if (!d.review_approved) {
    next = { label: 'Review & approve results', anchor: '.step[data-key="review"]',
             hint: 'the sign-off activates Produce' };
  } else if (!sb || !sb.qa_pass) {
    next = canRefreshSignal
      ? { label: 'Refresh via the Analyst Layer', anchor: '.step[data-key="gate"]',
          hint: (sb && sb.reason) || 'adjust the strategy if needed and re-approve to run a fresh press' }
      : null;
  } else if (!d.target_approved) {
    next = { label: 'Deliver · then proceed to Target', anchor: '.finale',
             hint: 'client-ready; the Target door unlocks outreach' };
  } else {
    next = { label: 'All clear — outreach live', anchor: '.finale',
             hint: 'assessment client-ready and Target unlocked' };
  }
  const scopeAgencies = ((sl.scope || {}).agencies || [])
    .map(a => a.abbr || a.name || a).filter(Boolean);
  // one-gate law + one-deliverable law (2026-07-18): with the legacy
  // cockpit curtained, the only next-action still pointing at a live
  // control is the Analyst Layer gate; every other branch targeted a
  // curtained press or the demoted brief, so the band renders the honest
  // chain status line instead (filled from the C2 seam in renderClient).
  if (!SHOW_LEGACY_WORKSTATION && next
      && !['Approve Analyst Layer', 'Refresh Signal Board',
           'Deliver · then proceed to Target'].includes(next.label)) {
    next = null;
  }
  return {
    next, holds,
    strictCurrent: sl.state === 'current',
    scopeLabel: scopeAgencies.length ? scopeAgencies.join(' · ') : null,
    map: sl.exists && sl.state === 'current' ? {
      bid_now: sl.live_actionable || 0,
      research: (sl.live_classifications || {}).unscreened || 0,
      horizon: sl.horizon_theses || 0,
      partners: sl.partner_paths || 0,
    } : null,
    lastVerified: sl.as_of || null,
    clientReady: !!(sb && sb.qa_pass),
  };
}

  // Quick-scope toggles (2026-07-13): the most common agencies as one-click
  // shortcuts INTO the sole creation door, pre-filled. Only agencies without an
  // existing workstation show (existing ones are already switch segments); the
  // "+ New scope" / custom door remains for everything else, with autofill.
  const existing = new Set(rows.map(row => row.ref.id));
  COMMON_SCOPE_AGENCIES
    .filter(a => !existing.has('agency_' + a.abbr.toLowerCase()))
    .forEach(a => {
      const chip = el(`<button type="button" class="scope-quick"
        title="Create a ${esc(a.name)} scope from this client's baseline strategy"
        aria-label="New ${esc(a.name)} scope">+ ${esc(a.abbr)}</button>`);
      chip.onclick = () => openNewScopeDialog(d.slug, chip, { agency: a });
      rail.appendChild(chip);
    });
  // The sole creation door (Tranche 3): All Federal or a custom agency with
  // autofill; scope switching stays GET-only, creation is an explicit POST.
  const create = el(`<button type="button" class="scope-new" aria-haspopup="dialog"
    data-scope-new>+ New scope</button>`);
  create.onclick = () => openNewScopeDialog(d.slug, create);
  rail.appendChild(create);
  return nav;
}

function renderClientFoundation(d) {
  const docs = Array.isArray(d.foundation_documents)
    ? d.foundation_documents.filter(doc => doc && doc.path) : [];
  if (!docs.length) return null;
  const section = el(`<section class="client-foundation"
      aria-label="Shared client foundation">
    <div class="client-foundation-title">Shared client foundation · same in every scope</div>
    <div class="client-foundation-links"></div>
    <div class="client-foundation-viewer" aria-live="polite"></div>
  </section>`);
  const links = section.querySelector('.client-foundation-links');
  const viewer = section.querySelector('.client-foundation-viewer');
  const origin = {
    slug: d.slug,
    workstationId: d.workstation && d.workstation.ref
      ? d.workstation.ref.id : null,
  };
  docs.forEach(doc => {
    const fmt = String(doc.fmt || doc.kind || 'file').toLowerCase();
    const href = '/api/file?path=' + encodeURIComponent(doc.path);
    const link = el(`<a class="alink client-foundation-link"
        data-foundation-path="${esc(doc.path)}" href="${esc(href)}"
        target="_blank" rel="noopener">
      <span>${esc(doc.label || doc.kind || 'Foundation document')}</span>
      <span class="foundation-fmt">${esc(fmt)}</span>
    </a>`);
    link.onclick = async event => {
      if (event.button !== 0 || event.metaKey || event.ctrlKey
          || event.shiftKey || event.altKey) return;
      event.preventDefault();
      viewer.classList.add('show');
      viewer.textContent = 'Opening shared foundation…';
      try {
        const { content, encoding } = await api(href);
        if (!section.isConnected || !isActiveOrigin(origin)) return;
        if (encoding === 'data-url' && String(content).startsWith('data:image/')) {
          viewer.innerHTML = `<img src="${esc(content)}"
            alt="${esc(doc.label || 'Client brand mark')}"
            style="display:block;max-width:min(360px,100%);max-height:180px;
              object-fit:contain;margin:0 auto">`;
        } else if (fmt === 'md' || doc.path.endsWith('.md')) {
          viewer.innerHTML = safeMarkdownHtml(content);
        } else {
          let pretty = content;
          try { pretty = JSON.stringify(JSON.parse(content), null, 2); } catch {}
          viewer.innerHTML = '<pre>' + esc(pretty) + '</pre>';
        }
      } catch (error) {
        if (!section.isConnected || !isActiveOrigin(origin)) return;
        viewer.textContent = 'Foundation document unavailable: '
          + (error.message || error);
      }
    };
    links.appendChild(link);
  });
  return section;
}

function appendClientFoundation(main, d) {
  const foundation = renderClientFoundation(d);
  if (foundation) main.appendChild(foundation);
}

// ── Client onboarding door: name to sweep-ready, Command Center only ────────
// The three files the pipeline requires, written through the exact schemas
// and loaders the runners use (the API is the validator; this dialog never
// duplicates validation logic). Load an existing slug to edit; save is
// all-or-nothing with per-file CAS.
async function buildFederalCalendar(slug, container) {
  /* The report's Section 6, brought to the operating screen: one quiet
     chronological rail. Absent document = absent card (no filler). */
  let payload = null;
  try { payload = await api('/api/client/' + slug + '/calendar'); }
  catch (_e) { return; }
  const items = (payload && payload.items) || [];
  if (!items.length) return;
  const MONTHS = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];
  const card = el(`<div class="fedcal">
    <div class="fedcal-hd">
      <span class="fedcal-title">Federal opportunity calendar</span>
      <span class="fedcal-sub">every dated commitment · candidates, vehicles, verified events</span>
    </div>
  </div>`);
  const today = new Date();
  const nearCut = new Date(today.getTime() + 30 * 86400000);

  /* EVENTS_LANE (2026-07-27): a density ribbon across the horizon, one cell
     per month, counts plus a dot cluster. Sparse months stay VISIBLE and
     empty so the spread reads as coverage, not as gaps. Clicking jumps. */
  const monthsSpan = [];
  if (items.length) {
    const first = new Date(items[0].date + 'T00:00:00');
    const last = new Date(items[items.length - 1].date + 'T00:00:00');
    for (let y = first.getFullYear(), m = first.getMonth();
         y < last.getFullYear() || (y === last.getFullYear() && m <= last.getMonth());) {
      monthsSpan.push(`${y}-${String(m + 1).padStart(2, '0')}`);
      m += 1; if (m > 11) { m = 0; y += 1; }
    }
    const counts = {};
    items.forEach(i => { counts[i.date.slice(0, 7)] = (counts[i.date.slice(0, 7)] || 0) + 1; });
    const ribbon = el(`<div class="fedcal-ribbon"></div>`);
    monthsSpan.forEach(key => {
      const n = counts[key] || 0;
      const [yy, mm] = key.split('-');
      const cell = el(`<button class="fedcal-mcell${n ? '' : ' is-empty'}"
        title="${esc(MONTHS[+mm - 1])} ${yy}: ${n} item${n === 1 ? '' : 's'}">
        <span class="mm">${esc(MONTHS[+mm - 1].slice(0, 3))}</span>
        <span class="nn">${n || ''}</span></button>`);
      cell.addEventListener('click', () => {
        const target = card.querySelector(`[data-month-key="${key}"]`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      ribbon.appendChild(cell);
    });
    card.appendChild(ribbon);
  }

  let lastMonth = '';
  for (const item of items) {
    const day = new Date(item.date + 'T00:00:00');
    const monthLabel = `${MONTHS[day.getMonth()]} ${day.getFullYear()}`;
    if (monthLabel !== lastMonth) {
      lastMonth = monthLabel;
      card.appendChild(el(`<div class="fedcal-month"
        data-month-key="${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}"
        >${esc(monthLabel)}</div>`));
    }
    const near = day >= today && day <= nearCut;
    const href = (item.source_urls || [])[0] || '';
    const row = el(`<a class="fedcal-row" data-near="${near ? 1 : 0}"
        data-kind="${esc(item.kind || '')}"
        data-closed="${item.status === 'closed' ? 1 : 0}"
        ${href ? `href="${esc(href)}" target="_blank" rel="noopener noreferrer"` : ''}>
      <span class="fedcal-date"><span class="d">${day.getDate()}</span>
        <span class="m">${esc(MONTHS[day.getMonth()].slice(0, 3).toUpperCase())}</span></span>
      <span class="fedcal-body">
        <span class="t">${esc(item.title)}</span>
        <span class="s">${esc([item.agency, item.label, item.status.replace(/_/g, ' ')]
          .filter(Boolean).join(' · '))}</span>
      </span>
      ${href ? '<span class="fedcal-src">source</span>' : ''}
    </a>`);
    card.appendChild(row);
  }
  container.appendChild(card);
}

        <div><label class="ob-l">Remove toptier codes (remove wins)</label><div data-chips="scope-remove" class="ns-chips"></div>

  overlay.appendChild(dialog);
  document.body.appendChild(overlay);
  const q = sel => dialog.querySelector(sel);
  const chips = {};   // key -> array of strings
  ['core','adjacent','excluded','naics','competitors','mission','scope-add','scope-remove']
    .forEach(k => { chips[k] = []; });

  function drawChips(key) {
    const box = dialog.querySelector(`[data-chips="${key}"]`);
    box.innerHTML = '';

      const chip = el(`<span class="ed-chip">${esc(t)}<button type="button" aria-label="Remove ${esc(t)}">&times;</button></span>`);
