// Official NAICS title for a code, or '' when unknown (never invented).
function naicsTitle(code) { return NAICS_TITLES[(code || '').trim()] || ''; }

function renderNaicsWorkshop(panel) {
  const g = GATE;
  const wrap = el(`<div class="kws naics-ws"></div>`);

  const candidates = naicsJudgmentCandidates(g);
  const summary = el(`<div class="kws-summary">
    <div class="kws-stat"><span class="n">${g.naics.length}</span><span class="k">in the boundary</span></div>
    <div class="kws-stat judge"><span class="n">${candidates.length}</span><span class="k">need judgment</span></div>
    <div class="kws-stat out"><span class="n">${(g.kept_out_naics || []).length}</span><span class="k">kept out</span></div>
  </div>`);
  wrap.appendChild(summary);

  wrap.appendChild(buildNaicsAdd(panel));

  if (g.naicsUndo) {
    const u = el(`<div class="kws-undo" role="status"><span>Moved ${esc(g.naicsUndo.entry.code)} out of the boundary.</span></div>`);
    const btn = el(`<button class="btn sm ghost">Undo</button>`);
    btn.onclick = () => {
      if (!g.naicsUndo) return;   // stale click after expiry — never deref null
      const entry = g.naicsUndo.entry;
      const i = (g.kept_out_naics || []).indexOf(entry);
      if (i >= 0) g.kept_out_naics.splice(i, 1);
      if (!g.naics.some(x => x.code === entry.code)) g.naics.push(entry);
      if (g.naicsUndo.timer) clearTimeout(g.naicsUndo.timer);
      g.naicsUndo = null; drawEditor(panel);
    };
    u.appendChild(btn); wrap.appendChild(u);
  }

  const grid = el(`<div class="kws-grid"></div>`);
  const main = el(`<div></div>`);

  // LANE 1 — IN THE BOUNDARY (deliberate cards)
  const l1 = el(`<div class="kws-band"><h4>In the boundary <span class="c">${g.naics.length}</span></h4></div>`);
  if (g.naics.length) {
    const lane = el(`<div class="naics-cards"></div>`);
    g.naics.forEach((e, i) => lane.appendChild(buildNaicsCard(e, i, panel)));
    l1.appendChild(lane);
  } else {
    l1.appendChild(el(`<div class="kws-inspector empty">No codes in the boundary. Add a six-digit code above, or promote one that needs judgment.</div>`));
  }
  main.appendChild(l1);

  // LANE 2 — NEEDS YOUR JUDGMENT (near-miss NAICS + keyword-driven reconsider)
  if (candidates.length) {
    const sec = el(`<div class="kws-band" style="margin-top:20px"><h4 style="color:var(--warn)">Needs your judgment <span class="c">${candidates.length}</span></h4></div>`);
    candidates.forEach(c => sec.appendChild(buildNaicsJudgment(c, panel)));
    main.appendChild(sec);
  }

  // LANE 3 — KEPT OUT (collapsed, restorable)
  if ((g.kept_out_naics || []).length) {
    const det = el(`<details class="kws-out"><summary>Kept out · ${g.kept_out_naics.length} (preserved, restorable)</summary></details>`);
    const lane = el(`<div class="naics-cards" style="margin-top:8px"></div>`);
    g.kept_out_naics.forEach((e, i) => lane.appendChild(buildNaicsKeptCard(e, i, panel)));
    det.appendChild(lane); main.appendChild(det);
  }

  grid.appendChild(main);
  grid.appendChild(buildNaicsInspector(panel));
  wrap.appendChild(grid);
  panel.appendChild(wrap);
}

function naicsJudgmentCandidates(g) {
  // near_misses of kind naics not yet decided, plus keyword-driven reconsiders
  const inB = new Set(g.naics.map(e => e.code));
  const out = new Set((g.kept_out_naics || []).map(e => e.code));
  const nm = (g.near_misses || []).filter(c => c.kind === 'naics'
    && !inB.has(String(c.value).trim()) && !out.has(String(c.value).trim()));
  const seen = new Set(nm.map(c => String(c.value).trim()));
  const recon = naicsReconsiderCandidates(g).filter(c => !seen.has(c.value));
  return nm.concat(recon);
}

// NAICS card: a plain group with TWO explicit sibling buttons (Inspect, Move
// out) — no nested interactive semantics, so mouse and Enter/Space each act
// exactly as labeled on a real keyboard path (Cycle-5 review B2).
function buildNaicsCard(e, i, panel) {
  const g = GATE;
  const sel = g.naicsSelected && g.naicsSelected.lane === 'in' && g.naicsSelected.index === i;
  const reasonId = `naics-reason-${e.code}-${i}`;
  const card = el(`<div class="naics-card${sel ? ' sel' : ''}" data-naics-idx="${i}" role="group" aria-label="NAICS ${esc(e.code)}" aria-describedby="${reasonId}"></div>`);
  const head = el(`<div class="nc-head"></div>`);
  head.appendChild(el(`<span class="nc-code">${esc(e.code)}</span>`));
  head.appendChild(el(`<span class="nc-role ${e.role === 'core' ? 'core' : 'boundary'}">${e.role === 'core' ? 'CORE' : 'BOUNDARY'}</span>`));
  head.appendChild(el(`<span class="prov" title="${esc(NAICS_PROV_LABEL[e.origin] || 'System inferred')}">${NAICS_PROV_ICON[e.origin] || '◇'}</span>`));
  card.appendChild(head);
  card.appendChild(el(`<div class="nc-title">${esc(e.title || naicsTitle(e.code) || 'label unavailable')}</div>`));
  const hasReason = !!String(e.rationale || '').trim();
  const hasContext = !!String(e._reviewContext || '').trim();
  const explClass = hasReason ? '' : (hasContext ? ' review' : ' missing');
  const explLabel = hasReason ? 'Why it is in the boundary'
    : (hasContext ? 'Original review context' : 'Explanation needed');
  const explText = hasReason ? e.rationale
    : (hasContext ? e._reviewContext : NAICS_EXPLANATION_NEEDED);
  card.appendChild(el(`<div id="${reasonId}" class="nc-expl${explClass}">
    <span class="lab">${explLabel}</span>
    <span class="txt">${esc(explText)}</span>
  </div>`));
  if (hasReason && hasContext) card.appendChild(el(`<div class="nc-context">
    <span class="lab">Original review context</span>${esc(e._reviewContext)}
  </div>`));
  const acts = el(`<div class="nc-acts"></div>`);
  const insp = el(`<button class="nc-btn" aria-label="Inspect NAICS ${esc(e.code)}">Inspect</button>`);
  insp.onclick = () => { g.naicsSelected = { lane: 'in', index: i }; drawEditor(panel); focusNaicsInspector(); };
  const rm = el(`<button class="nc-btn rm" aria-label="Move NAICS ${esc(e.code)} out of the boundary">Move out</button>`);
  rm.onclick = () => moveNaicsOut(i, panel);
  acts.append(insp, rm);
  card.appendChild(acts);
  return card;
}

function buildNaicsKeptCard(e, i, panel) {
  const card = el(`<div class="naics-card kept" role="group" aria-label="NAICS ${esc(e.code)}, kept out"></div>`);
  const head = el(`<div class="nc-head"></div>`);
  head.appendChild(el(`<span class="nc-code">${esc(e.code)}</span>`));
  card.appendChild(head);
  card.appendChild(el(`<div class="nc-title">${esc(e.title || e.note || 'kept out')}</div>`));
  const acts = el(`<div class="nc-acts"></div>`);
  const rs = el(`<button class="nc-btn" aria-label="Restore NAICS ${esc(e.code)} to the boundary">Restore</button>`);
  rs.onclick = () => restoreNaicsCode(e.code, panel);   // lossless owner
  acts.append(rs);
  card.appendChild(acts);
  return card;
}

// ONE lossless restore owner (Cycle-5 review B4): reuse the PRESERVED kept-out
// record verbatim — title, role, rationale, origin, note all intact.
// Restoration is an event (the backend journals the transition); it never
// overwrites the original provenance.
function restoreNaicsCode(code, panel) {
  const g = GATE;
  const idx = (g.kept_out_naics || []).findIndex(e => e.code === code);
  if (idx < 0) return false;
  const [rec] = g.kept_out_naics.splice(idx, 1);
  retainNaicsReviewContext(rec, legacyNaicsExplanation(
    code, g.keywords, g.near_misses).context);
  if (!g.naics.some(e => e.code === code)) {
    g.naics.push(rec);
    g.naicsSelected = { lane: 'in', index: g.naics.length - 1 };
  }
  if (g.naicsUndo && g.naicsUndo.entry && g.naicsUndo.entry.code === code) {
    if (g.naicsUndo.timer) clearTimeout(g.naicsUndo.timer);
    g.naicsUndo = null;
  }
  drawEditor(panel);
  return true;
}

function focusNaicsInspector() {
  setTimeout(() => {
    const first = document.querySelector('.naics-ws .kws-inspector input, .naics-ws .kws-inspector select, .naics-ws .kws-inspector button');
    if (first) first.focus();
  }, 0);
}

function _naicsCardNode(i) {
  return document.querySelector('.naics-ws .naics-card[data-naics-idx="' + i + '"]');
}

function buildNaicsJudgment(c, panel) {
  const g = GATE;
  const conf = Math.round((c.confidence || 0) * 100);
  const box = el(`<div class="kw-judge"></div>`);
  box.appendChild(el(`<div class="t">${esc(c.value)}${c.title ? ' · ' + esc(c.title) : ''}</div>`));
  box.appendChild(el(`<span class="risk">${c.origin === 'reconsider' ? 'Keyword-flagged' : 'Near-miss'} · ${conf}% confidence</span>`));
  box.appendChild(el(`<div class="why">${esc(c.reason || 'Considered for the boundary and withheld for your judgment.')}</div>`));
  const acts = el(`<div class="acts"></div>`);
  const use = el(`<button class="btn sm">Use in boundary</button>`);
  use.onclick = () => promoteNaicsCandidate(c, panel);
  const inspect = el(`<button class="btn sm ghost">Inspect first</button>`);
  inspect.onclick = () => {   // READ-ONLY selection: inspect without promoting
    g.naicsSelected = { lane: 'candidate', candidate: c };
    drawEditor(panel);
    focusNaicsInspector();
  };
  const keep = el(`<button class="btn sm ghost">Keep out</button>`);
  keep.onclick = () => {
    if (!(g.kept_out_naics || []).some(e => e.code === c.value)) {
      (g.kept_out_naics = g.kept_out_naics || []).push({
        code: c.value, title: c.title || '', role: 'boundary', origin: 'system',
        rationale: '', note: 'kept out at review', _rationaleSource: 'missing',
        _reviewContext: c.reason || '' });
    }
    if (g.naicsSelected && g.naicsSelected.lane === 'candidate'
        && g.naicsSelected.candidate === c) g.naicsSelected = null;
    drawEditor(panel);
  };
  acts.append(use, inspect, keep);
  box.appendChild(acts);
  return box;
}

function promoteNaicsCandidate(c, panel) {
  const g = GATE;
  const kept = (g.kept_out_naics || []).find(e => e.code === c.value);
  if (kept) { restoreNaicsCode(c.value, panel); return; }
  if (g.naics.some(e => e.code === c.value)) {
    g.kept_out_naics = (g.kept_out_naics || []).filter(e => e.code !== c.value);
    drawEditor(panel);
    return;
  }
  g.naics.push({ code: c.value, title: c.title || '', role: 'boundary',
    origin: 'consultant', rationale: '',
    note: 'promoted from needs judgment at review', _rationaleSource: 'missing',
    _reviewContext: c.reason || '' });
  g.naicsSelected = { lane: 'in', index: g.naics.length - 1 };
  drawEditor(panel);
}

function moveNaicsOut(i, panel) {
  const g = GATE;
  const [e] = g.naics.splice(i, 1);
  e.note = e.note || 'moved out of the boundary at review';
  (g.kept_out_naics = g.kept_out_naics || []).push(e);
  g.naicsSelected = null;
  if (g.naicsUndo && g.naicsUndo.timer) clearTimeout(g.naicsUndo.timer);
  g.naicsUndo = { entry: e };
  // Expiry removes only the transient banner. A full editor redraw would steal
  // focus from an operator already refining another code.
  g.naicsUndo.timer = setTimeout(() => {
    if (GATE === g && g.naicsUndo && g.naicsUndo.entry === e) {
      g.naicsUndo = null;
      const banner = panel && panel.querySelector('.naics-ws .kws-undo');
      if (banner) banner.remove();
    }
  }, 8000);
  drawEditor(panel);
}

function naicsAddWarnings(g, code) {
  // WARN only, never change: same-family overlap + materially-broadens
  const w = [];
  const fam = g.naics.find(e => naicsFamily(e.code) === naicsFamily(code) && e.code !== code);
  if (fam) w.push(`Overlaps the same NAICS family as ${fam.code} (both ${naicsFamily(code)}xx). Kept as your call; nothing changed.`);
  const sectors = new Set(g.naics.map(e => naicsSector(e.code)));
  if (g.naics.length && !sectors.has(naicsSector(code)))
    w.push(`Introduces sector ${naicsSector(code)}, a new industry area. This materially broadens the boundary; kept as your call.`);
  return w;
}

function buildNaicsAdd(panel) {
  const g = GATE;
  const box = el(`<div class="kws-add"></div>`);
  const grow = el(`<div class="grow"><label for="naics-add-code">Add a NAICS code</label></div>`);
  const inp = el(`<input id="naics-add-code" inputmode="numeric" maxlength="6" placeholder="a six-digit code, e.g. 541512">`);
  grow.appendChild(inp);
  const titleWrap = el(`<div style="flex:1 1 180px"><label for="naics-add-title">Label (optional)</label></div>`);
  const titleIn = el(`<input id="naics-add-title" placeholder="official/local label, if known">`);
  titleWrap.appendChild(titleIn);
  const whyWrap = el(`<div style="flex:2 1 260px"><label for="naics-add-why">Why it belongs</label></div>`);
  const whyIn = el(`<input id="naics-add-why" placeholder="ground the code in this client's work">`);
  whyWrap.appendChild(whyIn);
  const add = el(`<button class="btn sm">Add to boundary</button>`);
  const warn = el(`<div class="warn" role="alert" style="display:none"></div>`);
  const submit = () => {
    const code = inp.value.trim();
    warn.style.display = 'none'; warn.className = 'warn';
    if (!code) return;
    if (!NAICS_RE.test(code)) {   // reject non-six-digit BEFORE anything persists
      warn.textContent = 'A NAICS code must be exactly six digits.';
      warn.style.display = 'block'; return;
    }
    if (g.naics.some(e => e.code === code)) {
      warn.textContent = `${code} is already in the boundary.`; warn.style.display = 'block'; return;
    }
    // Re-adding a kept-out code RESTORES its preserved record losslessly
    // (Cycle-5 review B4), never a fresh generic entry that discards title/
    // role/rationale/origin/note.
    if ((g.kept_out_naics || []).some(e => e.code === code)) {
      restoreNaicsCode(code, panel);
      inp.value = ''; titleIn.value = ''; whyIn.value = '';
      return;
    }
    const rationale = whyIn.value.trim();
    if (!rationale) {
      warn.textContent = 'Explain why this code belongs in the boundary.';
      warn.style.display = 'block'; whyIn.focus(); return;
    }
    const soft = naicsAddWarnings(g, code);
    g.naics.push({ code, title: titleIn.value.trim(), role: 'boundary',
      origin: 'consultant', rationale, note: 'consultant added',
      _rationaleSource: 'explicit', _reviewContext: '' });
    g.naicsSelected = { lane: 'in', index: g.naics.length - 1 };
    inp.value = ''; titleIn.value = ''; whyIn.value = '';
    drawEditor(panel);
    if (soft.length) {   // non-blocking advisory after the add
      const a = document.querySelector('.naics-ws .warn');
      if (a) { a.className = 'warn advisory'; a.innerHTML = soft.map(esc).join('<br>'); a.style.display = 'block'; }
    }
  };
  add.onclick = submit;
  inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
  box.append(grow, titleWrap, whyWrap, add, warn);
  return box;
}

// Persisted web SearchSpec.naics_codes is empty, but the web RESEARCH prompt
// still receives the boundary codes as search terms (run_searches._t_web ->
// web_search). State that precisely (Cycle-5 review B8).
const NAICS_DOWNSTREAM_COPY = 'Changes the SAM.gov and USAspending search specs (their NAICS lanes mirror this boundary). The persisted web spec carries no NAICS, but the web research prompt still receives these codes as search terms. NAICS narrows WHERE we look; it never asserts capability fit.';

function buildNaicsInspector(panel) {
  const g = GATE;
  const box = el(`<aside class="kws-inspector" aria-live="polite"><h4>NAICS inspector</h4></aside>`);
  const field = (lbl, node) => { const f = el(`<div class="field"><div class="lbl">${esc(lbl)}</div></div>`); f.appendChild(node); return f; };

  // READ-ONLY candidate view (Inspect first): nothing is in the boundary yet
  if (g.naicsSelected && g.naicsSelected.lane === 'candidate') {
    const c = g.naicsSelected.candidate;
    box.appendChild(el(`<div class="empty" style="margin-bottom:10px">Inspecting a candidate. It is NOT in the boundary. "Use in boundary" below is the only action that promotes it.</div>`));
    box.appendChild(field('Six-digit code', el(`<div class="val">${esc(c.value)}</div>`)));
    const cTitle = c.title || naicsTitle(c.value);
    if (cTitle) box.appendChild(field('Official / local title', el(`<div class="val">${esc(cTitle)}</div>`)));
    box.appendChild(field('Why it was flagged', el(`<div class="val">${esc(c.reason || 'Considered for the boundary and withheld for your judgment.')}</div>`)));
    box.appendChild(field('Would join as', el(`<div class="val">Boundary (adjacent / broad). You can set it to Core after adding.</div>`)));
    box.appendChild(field('Provenance', el(`<div class="val">Candidate · ${c.origin === 'reconsider' ? 'flagged from your keywords' : 'inference near-miss'} (never added for you)</div>`)));
    box.appendChild(field('Downstream impact', el(`<div class="val" style="font-size:12px;color:var(--muted)">${esc(NAICS_DOWNSTREAM_COPY)}</div>`)));
    const use = el(`<button class="btn sm" style="margin-top:10px">Use in boundary</button>`);
    use.onclick = () => promoteNaicsCandidate(c, panel);
    box.appendChild(use);
    return box;
  }

  if (!g.naicsSelected || g.naicsSelected.lane !== 'in' || !g.naics[g.naicsSelected.index]) {
    box.appendChild(el(`<div class="empty">Select a code to inspect its label, role, explanation, provenance, downstream impact, and note, then refine it in place. NAICS is a coarse boundary filter, not a capability match.</div>`));
    return box;
  }
  const idx = g.naicsSelected.index;
  const e = g.naics[idx];
  // Editing any prior entry marks it edited; this updates the model +
  // the card IN PLACE (no full redraw), so tabbing through the form never
  // loses focus (Cycle-5 review B5).
  const provVal = el(`<div class="val">${esc(NAICS_PROV_LABEL[e.origin] || 'System inferred')}</div>`);
  const markEdited = () => {
    if (e.origin !== 'edited') {
      e.origin = 'edited';
      provVal.textContent = NAICS_PROV_LABEL.edited;
      const node = _naicsCardNode(idx);
      const p = node && node.querySelector('.prov');
      if (p) { p.textContent = NAICS_PROV_ICON.edited; p.title = NAICS_PROV_LABEL.edited; }
    }
  };
  box.appendChild(field('Six-digit code', el(`<div class="val">${esc(e.code)}</div>`)));
  const official = naicsTitle(e.code);
  if (official) box.appendChild(field('Official NAICS title',
    el(`<div class="val" style="color:var(--ink2)">${esc(official)}</div>`)));
  const titleIn = el(`<input value="${esc(e.title)}" aria-label="official or local label" placeholder="${esc(official || 'label, if known')}">`);
  titleIn.oninput = () => {
    e.title = titleIn.value; markEdited();
    const node = _naicsCardNode(idx); const t = node && node.querySelector('.nc-title');
    if (t) t.textContent = e.title || naicsTitle(e.code) || 'label unavailable';
  };
  box.appendChild(field('Official / local title', titleIn));
  const roleSel = el(`<select aria-label="role">
    <option value="core"${e.role === 'core' ? ' selected' : ''}>Core (exact / primary lane)</option>
    <option value="boundary"${e.role !== 'core' ? ' selected' : ''}>Boundary (adjacent / broad)</option></select>`);
  roleSel.onchange = () => {
    if (e.role !== roleSel.value) markEdited();
    e.role = roleSel.value;
    const node = _naicsCardNode(idx); const r = node && node.querySelector('.nc-role');
    if (r) { r.textContent = e.role === 'core' ? 'CORE' : 'BOUNDARY'; r.className = 'nc-role ' + (e.role === 'core' ? 'core' : 'boundary'); }
  };
  box.appendChild(field('Role in the boundary', roleSel));
  box.appendChild(field('Provenance', provVal));
  const rationaleIn = el(`<textarea rows="4" aria-label="why this NAICS code belongs" placeholder="ground this code in the client's work">${esc(e.rationale || '')}</textarea>`);
  rationaleIn.oninput = () => {
    e.rationale = rationaleIn.value;
    e._rationaleSource = e.rationale.trim() ? 'explicit' : 'missing';
    markEdited();
    const node = _naicsCardNode(idx); const reason = node && node.querySelector('.nc-expl');
    if (reason) {
      const present = !!e.rationale.trim();
      reason.className = 'nc-expl' + (present ? '' : ' missing');
      reason.querySelector('.lab').textContent = present ? 'Why it is in the boundary' : 'Explanation needed';
      reason.querySelector('.txt').textContent = present ? e.rationale : NAICS_EXPLANATION_NEEDED;
    }
  };
  box.appendChild(field('Why it belongs', rationaleIn));
  if (e._reviewContext) box.appendChild(field('Original review context',
    el(`<div class="val">${esc(e._reviewContext)}</div>`)));
  const noteIn = el(`<textarea rows="2" aria-label="operator note" placeholder="your note on this code">${esc(e.note || '')}</textarea>`);
  noteIn.oninput = () => { e.note = noteIn.value; markEdited(); };
  box.appendChild(field('Operator note', noteIn));
  box.appendChild(field('Downstream impact', el(`<div class="val" style="font-size:12px;color:var(--muted)">${esc(NAICS_DOWNSTREAM_COPY)}</div>`)));
  return box;
}

function chipList(label, arr, panel) {
  const wrap = el(`<div class="gate-field"><label>${esc(label)}</label></div>`);

  arr.forEach((v, i) => {
    const c = el(`<span class="ed-chip">${esc(v)}<button title="remove">&times;</button></span>`);
    c.querySelector('button').onclick = () => { arr.splice(i, 1); drawEditor(panel); };
    chips.appendChild(c);
  });
  const add = el(`<input class="chip-add" placeholder="add + Enter">`);

  return wrap;
}

async function saveRevision(btn, msg, advanceToNaics) {
  const origin = {
    // Standalone legacy workshop views predate DETAIL.slug. SEL is their
    // durable client identity; workstation-backed views still carry both.
    slug: (DETAIL && DETAIL.slug) || SEL,
    clientName: GATE && GATE.client,
    workstationId: WSEL,
    packetSha256: (GATE && GATE.packetSha256) ?? null,
    navSeq: NAV_SEQ,
  };
  btn.disabled = true; msg.style.color = ''; msg.textContent = 'saving …';
  const keywords = GATE.keywords.filter(k => (k.term || '').trim());
  const kept_out = (GATE.kept_out || []).filter(k => (k.term || '').trim());
  // the workshop's in-boundary lane IS the authoritative inferred_naics; the
  // rich entries ride alongside as naics_meta (Boundary Workshop, 2026-07-12).
  const inferred_naics = GATE.naics.map(e => e.code);
  const unexplained = GATE.naics.filter(e => !String(e.rationale || '').trim());
  if (!advanceToNaics && unexplained.length) {
    msg.style.color = 'var(--bad)';
    msg.textContent = `not saved: explain or move out NAICS ${unexplained.map(e => e.code).join(', ')}`;
    btn.disabled = false;
    const idx = GATE.naics.indexOf(unexplained[0]);
    const inspect = btn.closest('.gate-edit')?.querySelector(
      `.naics-card[data-naics-idx="${idx}"] .nc-btn`);
    if (inspect) { inspect.focus(); inspect.scrollIntoView({ block: 'center' }); }
    return;
  }
  const serializeNaics = e => ({
    code: e.code, title: e.title || '', role: e.role || 'boundary',
    origin: e.origin || 'system', rationale: e.rationale || '', note: e.note || '' });
  // Blank rationale remains an honest, visible "explanation needed" state on
  // vocabulary navigation. Normal saves are blocked above until it is resolved.
  const naics_meta = GATE.naics.map(serializeNaics);
  const kept_out_naics = (GATE.kept_out_naics || []).map(serializeNaics);
  try {
    // The locked/iterate path keeps its narrow contract (terms + NAICS only);
    // the pre-approval path carries the full workshop. Both preserve provenance.
    const r = GATE.locked
      ? await api('/api/strategy/terms', { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client_name: GATE.client,
            workstation_id: origin.workstationId,
            expected_packet_sha256: origin.packetSha256,
            keywords, kept_out, inferred_naics, naics_meta, kept_out_naics }) })
      : await api('/api/strategy/revise', { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client_name: GATE.client,
            workstation_id: origin.workstationId,
            expected_packet_sha256: origin.packetSha256, updates: {
            pursuit_strategy: GATE.pursuit_strategy,
            keywords, kept_out,
            inferred_naics, naics_meta, kept_out_naics,
            target_agencies: GATE.target_agencies,
            set_aside_angles: GATE.set_aside_angles,
          } }) });
    if (origin.navSeq !== NAV_SEQ || !isActiveOrigin(origin)) return;
    // A successful CAS write advances the exact rendered packet. Preserve the
    // server-returned token before any in-place editor rebuild so the next save
    // cannot accidentally reuse the predecessor token.
    if (r.packet_sha256) {
      GATE.packetSha256 = r.packet_sha256;
      if (DETAIL) DETAIL.strategy_packet_sha256 = r.packet_sha256;
    }
    const wasLocked = GATE.locked;
    const savedText = advanceToNaics
      ? `vocabulary saved · revision ${r.revision_count} · review NAICS below`
      : `saved · revision ${r.revision_count}${wasLocked ? ' (approval intact)' : ''}`;
    if (advanceToNaics) {
      // Workflow navigation (NOT a new approval): rebuild from the exact
      // server-returned strategy, then move programmatic focus to the stable
      // NAICS region in that fresh DOM.
      const panel = btn.closest('.gate-edit');
      if (panel && r.strategy) {
        renderStrategyEditor(panel, r.strategy,
          { status: wasLocked ? 'approved' : (r.status || 'pending') });
        const freshMsg = panel.querySelector('.gate-msg');
        if (freshMsg) { freshMsg.style.color = 'var(--ok)'; freshMsg.textContent = savedText; }
      }
      const a = panel && panel.querySelector('#naics-workshop-anchor');
      if (a) { a.focus({ preventScroll: false }); a.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      return;
    }
    msg.style.color = 'var(--ok)';
    msg.textContent = savedText;
    setTimeout(() => {
      if (origin.navSeq === NAV_SEQ && isActiveOrigin(origin)) {
        if (origin.workstationId == null) {
          select(origin.slug, { history: 'none' });
        } else {
          openWorkstation(origin.slug, origin.workstationId, { history: 'none' });
        }
      }
    }, 600);
  } catch (e) {
    if (origin.navSeq !== NAV_SEQ || !isActiveOrigin(origin)) return;
    msg.style.color = 'var(--bad)';
    msg.textContent = 'not saved: ' + (e.message || e);
    btn.disabled = false;
  }
}

async function gate(approve, note, buttons = [], msg = null) {
  const origin = {
    slug: DETAIL && DETAIL.slug,
    clientName: DETAIL && DETAIL.client_name,
    workstationId: WSEL,
    packetSha256: (DETAIL && DETAIL.strategy_packet_sha256) ?? null,
    navSeq: NAV_SEQ,
  };
  buttons.forEach(button => { button.disabled = true; });
  if (msg) { msg.style.color = ''; msg.textContent = 'saving decision …'; }
  try {
    const decided = await api('/api/decide', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ client_name: origin.clientName,
        workstation_id: origin.workstationId,
        expected_packet_sha256: origin.packetSha256, approve, note }) });
    if (decided.job_id) {
      /* One-gate law: the approval IS the go. Follow the auto-started
         Pre-Assessment press to completion before repainting. */
      if (msg) { msg.style.color = ''; msg.textContent = 'approved · generating the Pre-Assessment …'; }
      for (;;) {
        await new Promise(resolve => setTimeout(resolve, 2000));
        let j = null;
        try { j = await api('/api/job/' + decided.job_id); } catch (_e) { break; }
        if (!j || j.status !== 'running') break;
      }
    } else if (decided.auto_run_note && msg) {
      msg.textContent = decided.auto_run_note;
    }
    if (origin.navSeq === NAV_SEQ && isActiveOrigin(origin)) {
      openWorkstation(origin.slug, origin.workstationId, { history: 'none' });
    }
  } catch (error) {
    if (origin.navSeq !== NAV_SEQ || !isActiveOrigin(origin)) return;
    buttons.forEach(button => { button.disabled = false; });
    if (msg) {
      msg.style.color = 'var(--bad)';
      msg.textContent = 'decision not saved: ' + (error.message || error);
    }
  }
}

/* ---- review opportunities: the human checkpoint. Review the triaged
   notices, suggest a correction, re-triage (zero quota), review again, then
   produce the assessment below. Qualify & the Assess report run internally. */
function buildReview(s, acts, card) {
  if (s.state === 'waiting') {
    acts.appendChild(el(`<span style="font-size:12px;color:var(--muted)">Run the opportunity search first.</span>`));

  }
  // Clean pass (operator ruling 2026-07-24): the re-screen, re-search,
  // and dossier presses are retired from Review. The loop is the Analyst
  // Layer itself: adjust the boundary and re-approve. The read surfaces
  // below (results, boards, raw-opp drawers) stay exactly as they are.

  if (s.detail.research_picture) buildPicture(s.detail.research_picture, card);
  // ONE opportunity truth (2026-07-12): under a CURRENT strict pointer the
  // ledger records are the board; raw-sweep triage demotes to a labeled
  // diagnostic drawer. Held-closed strict states never show legacy as truth.
  const strict = s.detail.strict || null;
  if (strict && strict.state === 'current') {
    buildStrictReviewBoard(strict, card);
    if ((s.detail.opportunities || []).length) {
      const drawer = el(`<details style="margin-top:10px">
        <summary style="cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Diagnostic · legacy raw-sweep triage (not report truth)</summary>
      </details>`);
      buildOppReview(s.detail.opportunities, drawer);
      card.appendChild(drawer);
    }
  } else if (strict && strict.state === 'stale') {
    card.appendChild(el(`<div style="border:1px solid var(--bad);background:#fdf6f5;padding:9px 12px;margin-top:10px;font-size:12px"><b>Strict lane held closed:</b> the stored ledger no longer matches the current scope, sweep, or inputs. Refresh the search (or re-approve) before treating any board as truth. ${esc((strict.diagnostics || [])[0] || '')}</div>`));
    if ((s.detail.opportunities || []).length) {
      const drawer = el(`<details style="margin-top:10px">
        <summary style="cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Diagnostic · legacy raw-sweep triage (not report truth)</summary>
      </details>`);
      buildOppReview(s.detail.opportunities, drawer);
      card.appendChild(drawer);
    }
  } else if ((s.detail.opportunities || []).length) {
    buildOppReview(s.detail.opportunities, card);
  }
  if (DETAIL.assess_ledger) {
    // Strict evidence ledger board retired (operator ruling 2026-07-23);
    // the requirement span review stays: BID_NOW still needs the human read.
    buildRequirementSpanReview(DETAIL.assess_ledger, card);
  }

  // THE SIGN-OFF, LAST: you have now read the full picture and the
  // pursue-grade calls above — approving here is what activates Produce.
  // Fresh search/screen runs clear it automatically.
  const apBar = el(`<div class="gate-savebar" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--rule-dk)"></div>`);
  if (DETAIL.review_approved) {
    apBar.appendChild(el(`<span class="chip c-ok">RESULTS APPROVED — Produce is active below</span>`));
    // A standing partial-release grant is an operator decision; once made it
    // must stay VISIBLE, not only exist at click time. Plain re-approvals
    // preserve it; it binds to the exact run and dies on blocker drift.
    const sl = DETAIL.assess_ledger || {};
    if (sl.partial_release_approved) {
      apBar.appendChild(el(`<span class="chip c-wait"
        title="you authorized release with the disclosed required-source gaps; the grant is bound to this exact run and its blocker manifest — any gap change requires a new decision">PARTIAL-RELEASE GRANT HELD · ${Number(sl.coverage_gaps || 0)} disclosed gap${Number(sl.coverage_gaps || 0) === 1 ? '' : 's'} · run …${esc(String(sl.run_id || '').slice(-8))}</span>`));
    }
    // The Assess -> Target door (2026-07-12): outreach stays physically
    // locked until this explicit click; evidence drift re-locks it.
    if (DETAIL.target_approved) {
      apBar.appendChild(el(`<span class="chip c-ok">TARGET UNLOCKED — outreach lane is live</span>`));
      const relock = el(`<button class="btn sm ghost" title="re-lock the outreach lane (contact plan, target report, rail)">Re-lock Target</button>`);
      relock.onclick = async () => {
        relock.disabled = true;
        try {
          await api('/api/review/target-approve', { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_name: DETAIL.client_name, revoke: true }) });
          select(SEL);
        } catch (e) { relock.disabled = false; }
      };
      apBar.appendChild(relock);
    } else {
      const toTarget = el(`<button class="btn sm" title="one act: approve the reviewed results and open outreach (contact plan, target report, the Target rail)">Approve results &rarr; open Target</button>`);
      toTarget.onclick = async () => {
        toTarget.disabled = true;
        try {
          if (!DETAIL.review_approved) {
            await api('/api/review/assess-approve', { method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ client_name: DETAIL.client_name }) });
          }
          await api('/api/review/target-approve', { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_name: DETAIL.client_name }) });
          select(SEL);
        } catch (e) {
          toTarget.disabled = false;
          toTarget.textContent = 'Target blocked: ' + (e.message || e).slice(0, 60);
        }
      };
      apBar.appendChild(toTarget);
    }
    const undo = el(`<button class="btn sm ghost" title="return to review; Produce deactivates until you approve again">Undo approval</button>`);
    undo.onclick = async () => {
      undo.disabled = true;
      try {
        await api('/api/review/assess-approve', { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client_name: DETAIL.client_name, revoke: true }) });
        select(SEL);
      } catch (e) { undo.disabled = false; }
    };
    if (SHOW_LEGACY_WORKSTATION) apBar.appendChild(undo);
  } else {
    // The approval-drift panel is retired (operator ruling 2026-07-23);
    // the server-side binding remains the gate.
    if (SHOW_LEGACY_WORKSTATION) apBar.appendChild(el(`<span style="font-family:var(--mono),monospace;font-size:11px;opacity:.8;margin-right:10px">Reviewed the picture and the calls above?</span>`));
    const strictLedger = DETAIL.assess_ledger || {};
    const disclosedGaps = Number(strictLedger.coverage_gaps || 0);
    // One intentional act (operator ruling 2026-07-25): the Assess
    // sign-off rides the Target door below; the standalone
    // approve-results button is retired. The disclosed-gaps panel
    // stays its own explicit decision.
    if (strictLedger.exists && strictLedger.state === 'current'
        && Number.isFinite(disclosedGaps) && disclosedGaps > 0) {
      const partialPanel = el(`<div style="flex-basis:100%;margin-top:10px;border:1px solid var(--rule-dk);background:var(--panel);padding:10px 12px">
        <label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;font-weight:700">
          <input class="assess-partial-release-confirm" type="checkbox">
          <span>Approve release with the ${disclosedGaps} listed required source-coverage gap${disclosedGaps === 1 ? '' : 's'}</span>
        </label>
        <div style="font-size:11px;color:var(--muted);margin:5px 0 8px 22px">This authorization is limited to the exact gaps shown in the strict evidence ledger. Any gap change requires a new approval.</div>
        <button class="btn ok sm assess-partial-release" disabled>Approve with the disclosed gaps</button>
        <span class="gate-msg assess-partial-release-msg"></span>
      </div>`);
      const confirm = partialPanel.querySelector('.assess-partial-release-confirm');
      const partialButton = partialPanel.querySelector('.assess-partial-release');
      const partialMsg = partialPanel.querySelector('.assess-partial-release-msg');
      confirm.onchange = () => { partialButton.disabled = !confirm.checked; };
      partialButton.onclick = async () => {
        partialButton.disabled = true; confirm.disabled = true;
        partialMsg.textContent = 'saving …';
        try {
          await api('/api/review/assess-approve', { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_name: DETAIL.client_name,
              partial_release_approved: true,
              partial_release_run_id: strictLedger.run_id,
              partial_release_blockers_sha256:
                strictLedger.blocking_sources_sha256 }) });
          select(SEL);
        } catch (e) {
          partialMsg.textContent = 'not saved: ' + (e.message || e);
          confirm.disabled = false;
          partialButton.disabled = !confirm.checked;
        }
      };
      apBar.appendChild(partialPanel);
    }
  }
  card.appendChild(apBar);
}

function buildAssessLedgerSummary(ledger, card) {
  const state = ledger.state || (ledger.exists ? 'current'
    : (ledger.stale ? 'stale' : (ledger.unavailable ? 'unavailable' : 'missing')));
  const diagnostics = ledger.diagnostics || [];
  if (!ledger.exists) {
    const labels = {
      missing: 'NOT YET BUILT',
      stale: 'STALE — REFRESH REQUIRED',
      unavailable: 'TEMPORARILY UNAVAILABLE',
    };
    const messages = {
      missing: 'No strict ledger is current for this search yet.',
      stale: 'The stored ledger belongs to an earlier scope, sweep, or capability profile and is not being presented as current.',
      unavailable: 'The strict ledger could not be validated right now.',
    };
    const notes = diagnostics.length
      ? `<ul style="margin:7px 0 0;padding-left:18px">${diagnostics.map(note => `<li>${esc(note)}</li>`).join('')}</ul>`
      : '';
    card.appendChild(el(`<div style="border:1px solid var(--rule-dk);background:var(--panel);margin-top:12px;padding:11px 14px">
      <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
        <span style="font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-dk)">Strict evidence ledger</span>
        <span class="chip c-wait">${labels[state] || labels.missing}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:7px">${messages[state] || messages.missing} Assessment generation remains available.</div>
      <div style="font-size:12px;line-height:1.5">${notes}</div>
    </div>`));
    return;
  }

  const gaps = ledger.coverage_gaps || 0;
  const warnings = ledger.coverage_warnings || 0;
  const live = ledger.live_records || 0;
  const actionable = ledger.live_actionable || 0;
  const horizon = ledger.horizon_theses || 0;
  const partners = ledger.partner_paths || 0;
  const panel = el(`<div style="border:1px solid var(--rule-dk);background:var(--panel);margin-top:12px;padding:11px 14px">
    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
      <span style="font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-dk)">Strict evidence ledger</span>
      <span class="chip c-ok" title="the current pointer is valid for this scope: the pursuit board, Section-01 facts, watchlist, and release verdict all derive from this immutable run — removing the pointer is the operator rollback to legacy report truth">REPORT TRUTH · STRICT · RUN …${esc(String(ledger.run_id || '').slice(-8))}</span>
      <span class="chip c-ready">${live} LIVE CENSUS</span>
      <span class="chip ${actionable ? 'c-ok' : 'c-ready'}">${actionable} ACTIONABLE</span>
      <span class="chip c-ready">${horizon} HORIZON</span>
      <span class="chip c-ready">${partners} PARTNER PATHS</span>
      ${gaps ? `<span class="chip c-wait">${gaps} REQUIRED COVERAGE GAP${gaps === 1 ? '' : 'S'}</span>` : '<span class="chip c-ok">REQUIRED SOURCES COMPLETE</span>'}
      ${warnings ? `<span class="chip c-wait">${warnings} COVERAGE WARNING${warnings === 1 ? '' : 'S'} TOTAL</span>` : '<span class="chip c-ok">ALL COVERAGE COMPLETE</span>'}
      <span style="flex:1"></span>
      <button class="btn sm ghost">Show evidence status</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:7px"><b>LIVE CENSUS</b> is every verified SAM notice in scope. <b>ACTIONABLE</b> is the narrower BID NOW set with requirement evidence, completed attachment review, capability fit, and a future deadline. Unknowns stay visible and do not become opportunities.</div>
    <div class="ledger-detail" style="display:none;margin-top:9px;font-size:12px;line-height:1.5"></div>
  </div>`);
  const btn = panel.querySelector('button');
  const detail = panel.querySelector('.ledger-detail');
  const issues = ledger.coverage_issues || ledger.blocking_sources || [];
  const lines = [
    ...issues.map(row => `<li><b>${esc(row.lane || 'coverage')} · ${esc(row.source)}</b> · ${esc(row.status)}${row.required ? ' · REQUIRED' : ''}${row.note ? ` · ${esc(row.note)}` : ''}</li>`),
    ...diagnostics.map(note => `<li><b>diagnostic</b> · ${esc(note)}</li>`),
  ];
  detail.innerHTML = lines.length
    ? `<ul style="margin:0;padding-left:18px">${lines.join('')}</ul>`
    : '<span style="color:var(--ok)">No strict-ledger diagnostics are open.</span>';
  btn.onclick = () => {
    const opening = detail.style.display === 'none';
    detail.style.display = opening ? 'block' : 'none';
    btn.textContent = opening ? 'Hide evidence status' : 'Show evidence status';
  };
  card.appendChild(panel);
}

function safeRequirementSourceUrl(value) {
  try {
    const url = new URL(String(value || ''));
    const host = url.hostname.toLowerCase();
    return url.protocol === 'https:'
      && (host === 'sam.gov' || host.endsWith('.sam.gov')) ? url.href : '';
  } catch { return ''; }
}

function buildRequirementSpanReview(ledger, card) {
  const candidates = Number((ledger || {}).requirement_review_candidates || 0);
  const approvedCount = Number((ledger || {}).requirement_reviews_approved || 0);
  const approved = Number.isFinite(approvedCount)
    ? Math.max(0, Math.min(candidates, approvedCount)) : 0;
  if (!ledger || !ledger.exists || ledger.state !== 'current'
      || !ledger.run_id || !Number.isFinite(candidates) || candidates <= 0
      || !DETAIL || !DETAIL.client_name || !SEL) return;

  const clientName = DETAIL.client_name;
  const slugAtOpen = SEL;
  const expectedRun = ledger.run_id;
  const endpoint = '/api/assess/requirements?client_name=' + encodeURIComponent(clientName);
  const wrap = el(`<div class="gate-edit" style="padding:12px 14px;margin-top:10px">
    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
      <span style="font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-dk)">Live requirement check</span>
      <span class="chip ${approved === candidates ? 'c-ok' : 'c-ready'}">${approved} OF ${candidates} APPROVED</span>
      <span style="flex:1"></span>
      <button class="btn sm req-load">Review live requirement spans</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:7px">Read the exact language from SAM and decide whether it really describes work this client can perform. Nothing is promoted to actionable from keywords alone.</div>
    <span class="gate-msg req-status"></span>
    <div class="req-items" style="display:none;margin-top:10px"></div>
  </div>`);
  const loadBtn = wrap.querySelector('.req-load');
  const status = wrap.querySelector('.req-status');
  const box = wrap.querySelector('.req-items');

  const renderItems = data => {
    if (!data || data.run_id !== expectedRun) {
      box.style.display = 'block';
      box.innerHTML = '<div style="font-size:12px;color:var(--muted)">The search changed before these spans opened. Refresh this client and review the current language.</div>';
      return;
    }
    const items = (Array.isArray(data.items) ? data.items : [])
      .filter(item => item && ['unscreened', 'bid_now'].includes(item.classification))
      .map(item => ({ ...item, safe_source_url: safeRequirementSourceUrl(item.source_url) }))
      .filter(item => item.notice_id && item.evidence_id && item.excerpt
        && item.title && item.agency && item.safe_source_url);
    box.style.display = 'block';
    box.innerHTML = '';
    if (!items.length) {
      box.appendChild(el('<div style="font-size:12px;color:var(--muted)">No current exact requirement spans are available for a decision.</div>'));
      return;
    }

    items.forEach(item => {
      const wasApproved = Boolean(item.reviewed_at);
      const wasRejected = !wasApproved
        && String(item.gap || '').startsWith('Operator rejected');
      const attachments = (Array.isArray(item.attachments) ? item.attachments : [])
        .map(attachment => ({
          name: String((attachment || {}).name || 'Unnamed attachment'),
          media_type: String((attachment || {}).media_type || 'Type not provided'),
          safe_source_url: safeRequirementSourceUrl(
            (attachment || {}).source_url),
        }));
      const hasAttachments = attachments.length > 0;
      const attachmentInventoryHash =
        typeof item.attachment_inventory_hash === 'string'
          ? item.attachment_inventory_hash : null;
      const attachmentInventoryCount =
        item.attachment_inventory_count ?? null;
      const attachmentInventoryValid =
        item.attachment_inventory_valid === true
        && Number.isInteger(attachmentInventoryCount)
        && attachmentInventoryCount >= 0
        && attachmentInventoryCount === attachments.length
        && Boolean(attachmentInventoryHash);
      const reviewState = wasApproved ? 'APPROVED REQUIREMENT'
        : (wasRejected ? 'REJECTED — REVIEW AGAIN IF NEEDED' : 'NEEDS YOUR DECISION');
      const deadline = item.response_deadline
        ? `Response deadline: ${esc(item.response_deadline)}`
        : 'No response deadline is verified';
      const reviewed = wasApproved
        ? `<div style="font-size:11px;color:var(--ok);margin-top:4px">Approved by ${esc(item.reviewed_by || 'operator')} · ${esc(item.reviewed_at)}</div>`
        : '';
      const gap = item.gap
        ? `<div style="font-size:11px;color:var(--muted);margin-top:6px"><b>Still needed:</b> ${esc(item.gap)}</div>`
        : '';
      const row = el(`<div style="border-top:1px solid var(--rule-dk);padding:12px 0 10px">
        <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
          <div class="req-headcopy" style="flex:1;min-width:260px">
            <div style="font-family:var(--serif);font-size:16px;font-weight:700">${esc(item.title)}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(item.agency)} · ${deadline} · Notice ${esc(item.notice_id)}</div>
          </div>
          <span class="chip ${wasApproved ? 'c-ok' : 'c-wait'}">${reviewState}</span>
        </div>
        <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-dk);margin-top:10px">Exact language from SAM</div>
        <blockquote style="margin:5px 0 7px;padding:9px 11px;border-left:3px solid var(--blue);background:#fff;font-family:var(--serif);font-size:14px;line-height:1.45;white-space:pre-wrap">${esc(item.excerpt)}</blockquote>
        <a class="req-source" target="_blank" rel="noopener" style="font-size:11px;color:var(--blue-dk)">Open the SAM source ↗</a>
        <div class="req-attachment-block" style="margin-top:10px;padding:9px 11px;background:#fff;border:1px solid var(--rule)">
          <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-dk)">SAM attachments · ${attachments.length} listed</div>
          <ul class="req-attachments" style="margin:6px 0 0;padding-left:18px;font-size:12px;line-height:1.55"></ul>
          ${hasAttachments ? '' : `<div style="font-size:12px;color:var(--muted);margin-top:5px">${attachmentInventoryValid && attachmentInventoryCount === 0 ? 'SAM confirms that no attachments are listed.' : 'The SAM attachment inventory has not been verified yet.'}</div>`}
          ${hasAttachments ? `<label style="display:flex;gap:7px;align-items:flex-start;margin-top:8px;font-size:12px;font-weight:700"><input class="req-attachment-confirm" type="checkbox" ${wasApproved && item.attachments_checked ? 'checked' : ''} ${wasApproved ? 'disabled' : ''}> <span>I reviewed all listed attachments</span></label>` : ''}
          ${!attachmentInventoryValid ? '<div style="font-size:11px;color:var(--bad);margin-top:5px">This attachment list does not match its verified SAM inventory. Refresh the client before approving; Reject remains available.</div>' : ''}
        </div>
        ${reviewed}${gap}
        <div class="gate-savebar" style="margin-top:9px;padding-top:8px">
          <button class="btn sm req-approve" ${wasApproved || !attachmentInventoryValid || hasAttachments ? 'disabled' : ''}>${wasApproved ? 'Approved as requirement' : 'Approve as requirement'}</button>
          <button class="btn sm ghost req-reject">Reject</button>
          <span class="gate-msg req-row-status"></span>
        </div>
      </div>`);
      row.querySelector('.req-source').href = item.safe_source_url;
      const attachmentList = row.querySelector('.req-attachments');
      attachments.forEach(attachment => {
        const attachmentRow = el(`<li style="margin:3px 0"><b>${esc(attachment.name)}</b> · ${esc(attachment.media_type)} <a class="req-attachment-link" target="_blank" rel="noopener" style="margin-left:5px;color:var(--blue-dk)">Download from SAM ↗</a></li>`);
        const attachmentLink = attachmentRow.querySelector('.req-attachment-link');
        if (attachment.safe_source_url) attachmentLink.href = attachment.safe_source_url;
        else attachmentLink.replaceWith(el('<span style="margin-left:5px;color:var(--muted)">No direct SAM link</span>'));
        attachmentList.appendChild(attachmentRow);
      });
      const approveBtn = row.querySelector('.req-approve');
      const rejectBtn = row.querySelector('.req-reject');
      const rowStatus = row.querySelector('.req-row-status');
      const attachmentConfirm = row.querySelector('.req-attachment-confirm');
      if (attachmentConfirm) {
        attachmentConfirm.onchange = () => {
          approveBtn.disabled = wasApproved || !attachmentInventoryValid
            || !attachmentConfirm.checked;
        };
        approveBtn.disabled = wasApproved || !attachmentInventoryValid
          || !attachmentConfirm.checked;
      } else {
        approveBtn.disabled = wasApproved || !attachmentInventoryValid;
      }

      const decide = async approve => {
        if (approve && !attachmentInventoryValid) {
          rowStatus.style.color = 'var(--bad)';
          rowStatus.textContent = 'This attachment inventory is incomplete or changed. Refresh before approving.';
          rejectBtn.disabled = false;
          return;
        }
        if (approve && hasAttachments
            && (!attachmentInventoryHash || !attachmentConfirm
                || !attachmentConfirm.checked)) {
          rowStatus.style.color = 'var(--bad)';
          rowStatus.textContent = 'Review every listed attachment and check the confirmation before approving.';
          rejectBtn.disabled = false;
          return;
        }
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
        rowStatus.style.color = '';
        rowStatus.textContent = 'checking the current SAM language …';
        try {
          const latest = await api(endpoint);
          const current = (latest.items || []).find(
            candidate => candidate.notice_id === item.notice_id);
          if (latest.run_id !== expectedRun || !current
              || current.evidence_id !== item.evidence_id
              || current.excerpt !== item.excerpt
              || current.attachment_inventory_count
                !== attachmentInventoryCount
              || (current.attachment_inventory_hash ?? null)
                !== attachmentInventoryHash
              || (approve && current.attachment_inventory_valid !== true)) {
            rowStatus.style.color = 'var(--bad)';
            rowStatus.textContent = 'This language changed. Review the refreshed version before deciding.';
            if (SEL === slugAtOpen) await select(slugAtOpen);
            return;
          }
          await api('/api/assess/requirements', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_name: clientName,
              notice_id: item.notice_id, approve,
              run_id: expectedRun, evidence_id: item.evidence_id,
              excerpt: item.excerpt,
              attachment_inventory_count: attachmentInventoryCount,
              attachment_inventory_hash: attachmentInventoryHash,
              attachments_reviewed: approve
                ? (!hasAttachments || Boolean(attachmentConfirm.checked)) : false })
          });
          rowStatus.textContent = approve
            ? 'Saved as a requirement · refreshing …'
            : 'Rejected · refreshing …';
          if (SEL === slugAtOpen && DETAIL && DETAIL.client_name === clientName) {
            try { await select(slugAtOpen); }
            catch { rowStatus.textContent = 'Saved. Refresh this client to see the updated decision.'; }
          }
        } catch {
          rowStatus.style.color = 'var(--bad)';
          rowStatus.textContent = 'This span is no longer current. Refresh the client and review it again.';
          approveBtn.disabled = wasApproved || !attachmentInventoryValid
            || (hasAttachments && !attachmentConfirm.checked);
          rejectBtn.disabled = false;
        }
      };
      approveBtn.onclick = () => decide(true);
      rejectBtn.onclick = () => decide(false);
      box.appendChild(row);
    });
  };

  loadBtn.onclick = async () => {
    loadBtn.disabled = true;
    status.style.color = '';
    status.textContent = 'loading exact SAM language …';
    try {
      renderItems(await api(endpoint));

/* ---- jobs ---- */
function formatJobTime(raw) {
  const seconds = Math.max(0, Math.round(Number(raw) || 0));
  const minutes = Math.floor(seconds / 60);
  const remainder = seconds % 60;
  return minutes ? `${minutes}m ${String(remainder).padStart(2, '0')}s` : `${remainder}s`;
}

function renderJobConsole(j) {
  const lines = Array.isArray(j.lines) ? j.lines : [];
  const command = j.cmd ? '$ ' + j.cmd + '\n' : '';
  let telemetry = '';
  if (j.status === 'running') {
    const elapsed = formatJobTime(j.elapsed_seconds);
    const quiet = formatJobTime(j.quiet_seconds);
    if (j.runner_state === 'heartbeat_stale') {
      const age = formatJobTime(j.heartbeat_age_seconds);
      telemetry = `\n[HEARTBEAT STALE] ${elapsed} elapsed | last process check ${age} ago | status unknown; job remains locked`;
    } else if (j.runner_state === 'starting') {
      telemetry = `\n[STARTING] ${elapsed} elapsed | waiting for the pipeline process`;
    } else {
      telemetry = `\n[PROCESS ALIVE] ${elapsed} elapsed | no new console output for ${quiet}`;
    }
  }
  return command + lines.join('\n') + telemetry;
}

/* live search board: the sweep's fan-out lines become a per-source status
   grid — each source pulses while its code runs, lands green with its timing
   or red with its error, and the triage phase gets its own row. The raw
   console stays underneath for the full trail. */
function renderSearchBoard(host, lines) {
  const roster = [];
  const status = {};   // name -> {state, note}
  let triage = null;
  for (const ln of lines) {
    let m = ln.match(/^\[fan-out\] querying \d+ sources in parallel: (.+)$/);
    if (m) { m[1].split(',').map(s => s.trim()).forEach(n => { if (!roster.includes(n)) roster.push(n); }); continue; }
    m = ln.match(/^\[([a-z0-9_.]+)\] FAILED after ([\d.]+)s/i);
    if (m && roster.includes(m[1])) { status[m[1]] = { state: 'fail', note: m[2] + 's' }; continue; }
    m = ln.match(/^\[([a-z0-9_.]+)\] (.*) \(([\d.]+)s\)$/);
    if (m && roster.includes(m[1])) { status[m[1]] = { state: 'done', note: m[3] + 's' }; continue; }
    if (/^\[scope\]/.test(ln)) { triage = triage || {}; triage.scope = ln.replace('[scope] ', ''); }
    if (/^\[triage\] .* screening (\d+) notices/i.test(ln)) triage = { ...(triage || {}), state: 'run' };
    if (/^\[triage\] \d+ pursue/.test(ln)) triage = { ...(triage || {}), state: 'done', note: ln.replace('[triage] ', '') };
  }
  if (!roster.length) { host.style.display = 'none'; return; }
  host.style.display = 'block';
  const pill = (label, st) => {
    const cls = st ? (st.state === 'done' ? 'sb-done' : 'sb-fail') : 'sb-run';
    return `<span class="sb-pill ${cls}" title="${st && st.note ? esc(st.note) : 'querying…'}">
      <span class="sb-dot"></span>${esc(label)}${st && st.note ? ` <i>${esc(st.note)}</i>` : ''}</span>`;
  };
  let html = '<div class="sb-grid">' + roster.map(n => pill(n, status[n])).join('') + '</div>';
  if (triage) {
    html += `<div class="sb-triage">${triage.scope ? `<span class="sb-pill sb-done">scope · ${esc(triage.scope)}</span>` : ''}
      ${triage.state ? pill('screening the haul', triage.state === 'done' ? { state: 'done', note: triage.note } : null) : ''}</div>`;
  }
  host.innerHTML = html;
}

async function runJob(step, args, card, btn) {
  const origin = {
    slug: DETAIL && DETAIL.slug,
    workstationId: WSEL,
    clientName: DETAIL && DETAIL.client_name,
  };
  const con = card.querySelector('.console');
  let board = card.querySelector('.search-board');
  if (step === 'searches' && !board) {
    board = el(`<div class="search-board" style="display:none;margin-top:10px"></div>`);
    con.before(board);
  }
  con.classList.add('show'); con.textContent = 'starting…';
  btn.disabled = true;
  try {
    const jobArgs = { ...(args || {}), workstation_id: origin.workstationId };
    const { job_id } = await api('/api/run', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ client_name: origin.clientName, step, args: jobArgs }) });
    POLLS[job_id] = setInterval(async () => {
      const j = await api('/api/job/' + job_id);
      if (step === 'searches' && board) renderSearchBoard(board, j.lines);
      con.textContent = renderJobConsole(j);
      con.scrollTop = con.scrollHeight;
      if (j.status !== 'running') {
        clearInterval(POLLS[job_id]); delete POLLS[job_id];
        con.textContent += `\n\n[${j.status}]`;
        btn.disabled = false;
        if (j.status === 'done' || j.artifacts_written) {
          setTimeout(() => {
            if (SEL === origin.slug && WSEL === origin.workstationId) {
              openWorkstation(origin.slug, origin.workstationId, { history: 'none' });
            }
          }, 600);
        }
      }
    }, 900);
  } catch (e) { con.textContent = 'ERROR: ' + e.message; btn.disabled = false; }
}

/* ---- artifact viewer ---- */
async function viewArtifact(a, viewer) {
  if ((a.fmt === 'html') || a.path.endsWith('.html')) {
    window.open('/report?path=' + encodeURIComponent(a.path), '_blank');
    return;
  }
  const { content } = await api('/api/file?path=' + encodeURIComponent(a.path));
  if ((a.fmt === 'json' || a.path.endsWith('.json')) && content.length > 300000) {
    // Multi-MB JSON hangs the tab if rendered inline. Preview + open natively.
    viewer.classList.add('show');
    viewer.innerHTML = `<div style="font-family:var(--mono);font-size:12px;color:var(--ink2)">
      Large results file (${(content.length/1048576).toFixed(1)} MB) — inline preview only.
      <button class="alink" onclick="window.open('/report?path=${encodeURIComponent(a.path)}','_blank')">
        Open full file in new tab</button></div>
      <pre>${esc(content.slice(0, 4000))}\n… [truncated]</pre>`;
    return;
  }
  viewer.classList.add('show');
  if ((a.fmt === 'md') || a.path.endsWith('.md')) viewer.innerHTML = safeMarkdownHtml(content);
  else {
    let pretty = content;
    try { pretty = JSON.stringify(JSON.parse(content), null, 2); } catch {}
    viewer.innerHTML = '<pre>' + esc(pretty) + '</pre>';
  }
}

/* ---- company typeahead ---- */
let sugTimer = null, picked = false;
function initSuggest() {
  const inp = $id('in_name'), box = $id('suggest'), dm = $id('didmean');
  inp.addEventListener('input', () => {
    // the website belongs to the PICKED company; typing a different name
    // after a pick must not carry the old company's site (A4, 2026-07-12)
    if (SITE_FROM_SUGGEST) { $id('in_site').value = ''; SITE_FROM_SUGGEST = false; }
    picked = false; dm.style.display = 'none';
    clearTimeout(sugTimer);
    const q = inp.value.trim();
    if (q.length < 2) { box.classList.remove('show'); return; }
    sugTimer = setTimeout(async () => {
      let items = [];
      try { items = await api('/api/company_suggest?q=' + encodeURIComponent(q)); } catch {}
      box.innerHTML = '';
      if (!items.length) { box.classList.remove('show'); return; }
      // If the top hit's name doesn't start with what was typed, it came from
      // backoff (an overshoot typo) — surface it as "did you mean".
      const top = items[0];
      const overshoot = !top.name.toLowerCase().startsWith(q.toLowerCase().slice(0, top.name.length));
      for (const it of items) {
        const row = el(`<div class="sitem">
            ${it.logo ? `<img src="${esc(it.logo)}" onerror="this.remove()">` : ''}
            <span>${esc(it.name)}</span><span class="dom">${esc(it.domain || '')}</span></div>`);
        row.onclick = () => pickCompany(it);
        box.appendChild(row);
      }
      box.classList.add('show');
      if (overshoot && q.length > top.name.length) {
        dm.innerHTML = `Did you mean <b>${esc(top.name)}</b> (${esc(top.domain)})?`;
        dm.querySelector('b').onclick = () => pickCompany(top);
        dm.style.display = 'block';
      }
    }, 350);
  });
  // keyboard parity for div/span click targets (UX pass 2026-07-12): Enter
  // and Space activate anything marked role=button that isn't a real button
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ')
        && e.target instanceof Element
        && e.target.matches('[role="button"]:not(button):not(a)')) {
      e.preventDefault();
      e.target.click();
    }
  });
  document.addEventListener('click', (e) => {
    if (!box.contains(e.target) && e.target !== inp) box.classList.remove('show');
  });
}
let SITE_FROM_SUGGEST = false;
function pickCompany(it) {
  $id('in_name').value = it.name;
  if (it.domain) { $id('in_site').value = 'https://' + it.domain; SITE_FROM_SUGGEST = true; }
  picked = true;
  $id('suggest').classList.remove('show');
  $id('didmean').style.display = 'none';
}

/* ---- recurring PROGRAM change digest, internal Control Room only ---- */
async function buildChangeDigest(slug, workstationId, slot) {
  const origin = { slug, workstationId };
  const navSeq = NAV_SEQ;
  const card = el(`<div class="step" data-key="change-digest" style="margin:8px 0 18px">
    <div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap">
      <div class="change-digest-headcopy" style="flex:1;min-width:260px">
        <div style="font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-dk)">Intelligence change digest · internal</div>
        <div class="change-digest-summary" style="font-size:13px;margin-top:5px;color:var(--ink2)">loading prior digest…</div>
      </div>
      <button class="btn sm ghost change-digest-run">Capture baseline</button>
    </div>
    <div class="change-digest-lanes" style="margin-top:9px"></div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">PROGRAM signals and census movement only. Pursuit-grade status requires separate live SAM verification.</div>
    <pre class="console"></pre>
  </div>`);
  slot.replaceChildren(card);
  const summary = card.querySelector('.change-digest-summary');
  const lanes = card.querySelector('.change-digest-lanes');
  const run = card.querySelector('.change-digest-run');
  run.onclick = () => runJob('change_digest', {}, card, run);
  try {
    const data = await api(workstationAuxPath(
      slug, 'change-digest', workstationId));
    if (navSeq !== NAV_SEQ || !isActiveOrigin(origin) || !slot.isConnected) return;
    if (!data.built) {
      summary.textContent = data.note || 'No digest baseline exists yet.';
      run.textContent = 'Capture first baseline';
      return;
    }
    summary.textContent = `${data.summary || ''} · generated ${data.generated_at || ''}`;
    run.textContent = 'Refresh change digest';
    const laneRows = Object.values(data.lanes || {}).map(lane => {
      const changeCount = (lane.entered || []).length + (lane.left || []).length
        + (lane.moved || []).length + (lane.events || []).length;
      const chips = [
        `${(lane.entered || []).length} entered`,
        `${(lane.left || []).length} left`,
        `${(lane.moved || []).length} moved`,
        `${(lane.unchanged || []).length} unchanged`,
      ].join(' · ');
      const samples = [
        ...(lane.entered || []).map(row => `entered · ${row.title || row.id}`),
        ...(lane.left || []).map(row => `left · ${row.title || row.id}`),
        ...(lane.moved || []).map(row => `${row.label || 'moved'} · ${row.title || row.id}: ${row.from ?? 'not stated'} → ${row.to ?? 'not stated'}`),
        ...(lane.events || []).map(row => `${row.kind || 'event'} · ${row.detail || row.title || row.source_id}`),
      ];
      return `<div style="border-top:1px solid var(--rule);padding:7px 0">
        <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">
          <b style="font-size:12px">${esc(lane.label || '')}</b>
          <span class="chip ${changeCount ? 'c-wait' : 'c-ready'}">${esc(lane.state || '')}</span>
          <span style="font-family:var(--mono),monospace;font-size:10px;color:var(--muted)">${esc(chips)}</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(lane.framing || '')}</div>
        ${samples.length ? `<ul style="margin:5px 0 0;padding-left:18px;font-size:11px">${samples.map(item => `<li>${esc(item)}</li>`).join('')}</ul>` : ''}
      </div>`;
    });
    lanes.innerHTML = laneRows.join('');
  } catch (e) {
    if (navSeq !== NAV_SEQ || !isActiveOrigin(origin) || !slot.isConnected) return;
    summary.textContent = 'change digest unavailable: ' + (e.message || e);
    run.textContent = 'Retry digest';
  }
}

/* ============ contacts view: window onto the contact graph ============ */
/* Operator-only. The dashboard renders; the only write is a human merge

let CT = { filters: {}, sort: 'relevance', page: 1 };

const ctMark = (p) => p.logo_domain

       onerror="this.parentNode.textContent='${esc((p.agency || '?')[0])}'" alt=""></span>`
  : `<span class="ct-mark">${esc((p.agency || '?')[0])}</span>`;

const ctDot = (days) => {
  const c = days == null ? 'cold' : days < 30 ? 'fresh' : days < 180 ? 'warm' : 'cold';
  const t = days == null ? 'never dated' : `last observed ${days}d ago`;
  return `<span class="ct-dot ${c}" title="${t}"></span>`;
};

const ctChips = (p) => p.channels.map(c =>
  `<span class="ct-chip g${c.grade}" title="${c.kind}: ${esc(c.value)} · observed ${c.last_observed || 'unknown'}">${c.kind === 'email' ? '@' : '☎'} ${c.grade}</span>`
).join(' ');

function ctSparkline(observations) {
  const dated = observations.filter(o => o.observed_at);
  if (!dated.length) return '<span style="color:#8a8271;font-size:11px">no dated sightings</span>';
  const days = dated.map(o => new Date(o.observed_at).getTime());
  const lo = Math.min(...days), hi = Math.max(...days), span = Math.max(1, hi - lo);
  const W = 420, H = 26;
  const ticks = dated.map(o => {
    const x = 8 + (W - 16) * (new Date(o.observed_at).getTime() - lo) / span;
    return `<line x1="${x.toFixed(1)}" y1="4" x2="${x.toFixed(1)}" y2="${H - 4}">
      <title>${esc(o.notice_id)} · ${o.observed_at}</title></line>`;
  }).join('');
  return `<svg class="ct-spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"
    role="img" aria-label="observation timeline">${ticks}</svg>`;
}

const ctSilhouette = () => `
  <span class="ct-sil" title="no photo on file"><svg width="40" height="40" viewBox="0 0 40 40"
    xmlns="http://www.w3.org/2000/svg" aria-label="silhouette">
    <circle cx="20" cy="14" r="7" fill="#57708c"/>
    <path d="M6 36c1.5-8 7-12 14-12s12.5 4 14 12z" fill="#57708c"/></svg></span>`;

async function renderContacts(options = {}) {
  if (window.LILACommandCenterHome) window.LILACommandCenterHome.deactivate();
  if (NEW_SCOPE_CLOSE && !NEW_SCOPE_CLOSE()) {
    const origin = SEL && WSEL ? workstationPath(SEL, WSEL) : '/';
    if (location.pathname !== origin || location.search) historyReplace(origin);
    return false;
  }
  $id('main').classList.remove('cc-home');  // contacts keeps the light shell
  const history = options.history || (CT.active ? 'none' : 'push');
  const seq = ++NAV_SEQ;
  closeScopedOverlay();
  if (history === 'push'
      && (location.pathname !== '/' || location.search !== '?view=contacts')) {
    historyPush('/?view=contacts');
  } else if (history === 'replace') {
    historyReplace('/?view=contacts');
  }
  SEL = null; WSEL = null; WORKSTATIONS = []; DETAIL = null;
  CT.active = true;
  setRailContext(false);  // full-width operator view; the rail is client-view only
  bareSidebar(true);      // non-client view: left rail stays pure navy
  document.querySelectorAll('.ccard').forEach(c => c.classList.remove('sel'));
  const main = $id('main');
  main.innerHTML = '<div style="padding:28px 0;color:var(--muted)">Loading contacts…</div>';
  const qs = new URLSearchParams({ ...CT.filters, sort: CT.sort, page: CT.page, per_page: 50 });
  let sum, data;
  try {
    [sum, data] = await Promise.all([api('/api/contacts/summary'), api('/api/contacts?' + qs)]);
  } catch (e) {
    if (seq !== NAV_SEQ || !CT.active) return;
    main.innerHTML = `<h3>Contacts</h3><div class="empty">Contact graph unavailable: ${esc(e.message || e)}</div>`;
    return;
  }
  if (seq !== NAV_SEQ || !CT.active) return;
  CT.lastProfiles = data.profiles;
  CT.order = data.order || [];
  CT.hidden = data.hidden || 0;
  const rows = data.profiles.map((p, i) => `
    <div class="ct-row" onclick="ctToggleDetail(this, '${esc(p.normalized_name)}', '${esc((p.agency || '').toLowerCase())}')">
      ${ctMark(p)}
      <span class="ct-name">${esc(p.person_name)}${p.rotation ? '<span class="ct-rot" title="sightings stopped while a new name started at this office">ROTATION?</span>' : ''}</span>
      <span class="ct-title">${esc(p.title || '')}</span>
      <span class="ct-seat">${esc(p.seat || '')}</span>
      ${ctChips(p)}
      <span class="ct-sight">${p.sighting_count}×</span>
      ${ctDot(p.days_since)}
      <button class="btn sm ghost" title="add to the outreach rail" onclick="event.stopPropagation();ctAddOutreach(${i})">+ list</button>
      <span class="ct-ctl" onclick="event.stopPropagation()">
        <button title="move up (this view only)" onclick="ctMove(${i},-1)">&#9650;</button>
        <button title="move down (this view only)" onclick="ctMove(${i},1)">&#9660;</button>
        <button class="x" title="hide from this view — the contact stays in the database" onclick="ctHide(${i})">&#215;</button>
      </span>
    </div>`).join('');
  const pages = Math.max(1, Math.ceil(data.total / data.per_page));
  main.innerHTML = `
    <div class="hubtabs">
      <button onclick="renderHome()">Clients</button>
      <button class="on">Contacts</button>
    </div>
    <h3>Contacts <span style="font-family:var(--mono);font-size:11px;color:#8a8271">source-verified · official publications only · operator view</span></h3>
    <div class="ct-strip">
      <div class="ct-stat"><div class="n">${sum.profiles}</div><div class="l">profiles</div></div>
      <div class="ct-stat"><div class="n">${sum.observations}</div><div class="l">observations</div></div>
      <div class="ct-stat"><div class="n">${sum.offices}</div><div class="l">offices</div></div>
      <div class="ct-stat"><div class="n">${sum.observed_30d}</div><div class="l">seen &lt;30d</div></div>
      <button class="ct-review-badge" onclick="ctReview()">MERGE REVIEW<span class="cnt">${sum.review_pending}</span></button>
    </div>
    <div class="ct-filters">
      <input placeholder="name…" value="${esc(CT.filters.q || '')}" onchange="ctFilter('q', this.value)">
      <input placeholder="agency…" value="${esc(CT.filters.agency || '')}" onchange="ctFilter('agency', this.value)">
      <input placeholder="office…" value="${esc(CT.filters.office || '')}" onchange="ctFilter('office', this.value)">
      <input placeholder="seat / role…" value="${esc(CT.filters.seat || '')}" onchange="ctFilter('seat', this.value)">
      <input placeholder="NAICS…" style="width:80px" value="${esc(CT.filters.naics || '')}" onchange="ctFilter('naics', this.value)">
      <select onchange="ctFilter('grade', this.value)">
        <option value="">any grade</option>
        ${['A', 'B', 'C'].map(g => `<option ${CT.filters.grade === g ? 'selected' : ''}>${g}</option>`).join('')}
      </select>
      <select onchange="CT.sort = this.value; CT.page = 1; renderContacts()">
        <option value="relevance" ${CT.sort === 'relevance' ? 'selected' : ''}>relevance</option>
        <option value="last_observed" ${CT.sort === 'last_observed' ? 'selected' : ''}>last observed</option>
        <option value="name" ${CT.sort === 'name' ? 'selected' : ''}>name</option>
      </select>
    </div>
    <div class="ct-list">${rows || '<div class="ct-row" style="cursor:default">no profiles match — run the backfill or widen the filters</div>'}</div>
    <div style="margin-top:10px;font-family:var(--mono);font-size:11px;color:#8a8271">
      ${data.total} profiles · page ${data.page}/${pages}
      ${data.page > 1 ? `<button class="btn sm ghost" onclick="CT.page--;renderContacts()">‹ prev</button>` : ''}
      ${data.page < pages ? `<button class="btn sm ghost" onclick="CT.page++;renderContacts()">next ›</button>` : ''}
      ${data.hidden ? `· <button class="btn sm ghost" title="restore every hidden contact to this view" onclick="ctUnhideAll()">show ${data.hidden} hidden</button>` : ''}
      <div style="margin-top:6px;color:#a99">reorder &amp; hide affect your view only — the master database is never changed</div>
    </div>`;
}

function ctFilter(k, v) {
  if (v) CT.filters[k] = v; else delete CT.filters[k];
  CT.page = 1;
  renderContacts();
}

/* ---- Contacts view: reorder + hide are a VIEW overlay, never a graph edit.
   The master database is derived from append-only observations and is never
   touched here — these only change what this operator sees. ---- */
async function ctPrefs(body) {
  return api('/api/contacts/prefs', { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}
async function ctMove(i, dir) {
  const rows = CT.lastProfiles || [];
  const j = i + dir;
  if (i < 0 || j < 0 || j >= rows.length) return;
  const keys = rows.map(p => p.key);
  [keys[i], keys[j]] = [keys[j], keys[i]];
  // persist the visible order; keep any previously-pinned off-page keys after
  const off = (CT.order || []).filter(k => !keys.includes(k));
  await ctPrefs({ order: [...keys, ...off] });
  renderContacts();
}
async function ctHide(i) {
  const p = (CT.lastProfiles || [])[i];
  if (!p) return;
  if (!confirm(`Hide "${p.person_name}" from this view?\n\nThe contact stays in the master database — this only removes it from your Contacts list. Restore any time with "show hidden".`)) return;
  await ctPrefs({ hide: p.key });
  renderContacts();
}
async function ctUnhideAll() {
  await ctPrefs({ unhide_all: true });
  renderContacts();
}

async function ctToggleDetail(row, name, agency) {

  const d = await api(`/api/contacts/profile?name=${encodeURIComponent(name)}&agency=${encodeURIComponent(agency)}`);
  const chan = d.channels.map(c => `
    <div style="margin:2px 0">

      <span style="font-family:var(--mono);font-size:12px">${esc(c.value)}</span>
      <span style="color:#8a8271;font-size:11px">observed ${c.last_observed || 'unknown'}</span>
      ${c.source_url ? `<a class="alink" target="_blank" href="${esc(c.source_url)}">source ↗</a>` : ''}
    </div>`).join('');
  const obs = d.observations.map(o => `
    <tr><td>${o.observed_at || '—'}</td>
        <td>${o.source_url ? `<a class="alink" target="_blank" href="${esc(o.source_url)}">${esc(o.notice_id)}</a>` : esc(o.notice_id)}</td>
        <td>${esc(o.notice_type || '')}</td>
        <td>${esc(o.channel_kind ? o.channel_kind + ': ' + o.channel_value : 'named sighting')}</td>
        <td>${esc(o.channel_source || '')}</td>
        <td>${esc(o.naics || '')}</td></tr>`).join('');
  const panel = el(`<div class="ct-detail">
    ${ctSilhouette()}
    <div style="flex:1">
      <div style="font-weight:700;font-size:15px">${esc(d.person_name)}
        ${d.rotation ? `<span class="ct-rot">ROTATION? last seen ${d.rotation.last_seen || '?'} · possible successor ${esc(d.rotation.likely_successor || '?')}</span>` : ''}
      </div>
      <div style="color:var(--ink2);font-size:12px;margin:2px 0 8px">${esc(d.agency || '')} · ${(d.offices || []).map(esc).join(' · ')}
        ${(d.naics || []).length ? '· NAICS ' + d.naics.map(esc).join(', ') : ''}</div>
      ${chan || '<div style="color:#8a8271;font-size:12px">no reachable channel on record</div>'}
      <div style="margin-top:10px">${ctSparkline(d.observations)}</div>
      <table>
        <tr><th>observed</th><th>notice</th><th>type</th><th>channel</th><th>via</th><th>naics</th></tr>
        ${obs}
      </table>
    </div>
  </div>`);
  row.after(panel);
}

async function ctReview() {
  setRailContext(false);
  bareSidebar(true);
  const items = await api('/api/contacts/review');
  const merges = items.filter(i => i.candidates);
  const unattributed = items.filter(i => !i.candidates);
  const main = $id('main');
  const rows = merges.map((m, i) => `
    <div class="arow">
      <span class="who">${esc(m.agency || '?')}</span>
      <span class="what">${m.candidates.map(c => `<strong>${esc(c.person_name)}</strong> (${c.sighting_count}×)`).join(' vs ')}
        — ${esc(m.reason)}</span>
      <button class="btn sm" onclick="ctDecide(${i}, 'approve')">Same person — merge</button>
      <button class="btn sm ghost" onclick="ctDecide(${i}, 'reject')">Different people</button>

  const un = unattributed.map(u => `
